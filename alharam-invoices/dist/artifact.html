<title>نظام فواتير الحرم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: right-hand rail (RTL) for ledger sections, wide work area; documents render as true A4 paper sheets matching the company's Excel originals */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E3E8F0; --line:#CDD5E1;
  --ink:#141C33; --muted:#5B6680; --accent:#1F3C8F; --accent-ink:#FFFFFF; --accent-soft:#DDE4F6;
  --gold:#9C7629; --gold-soft:#F3E9D2;
  --ok:#1E7A4F; --ok-bg:#DCF0E4; --warn:#9A6200; --warn-bg:#FAEBC9; --bad:#B23A30; --bad-bg:#F7DEDA; --info:#3D4F7A; --info-bg:#E2E7F2;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-soft:#F1F1F1; --paper-blue:#DCE6F1; --paper-red:#D0021B; --paper-navy:#1F3C8F; --paper-gold:#9C7629;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-doc:"Tinos","Times New Roman",Times,serif;
  --f-doc-sans:"Arimo",Arial,Helvetica,sans-serif;
  --f-doc-ar:"Noto Naskh Arabic","Traditional Arabic",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161D30; --sunk:#1D263C; --line:#2C3752;
  --ink:#E5E9F3; --muted:#9AA5BF; --accent:#8BA4F2; --accent-ink:#0B1330; --accent-soft:#25325A;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D30; --sunk:#1D263C; --line:#2C3752;
  --ink:#E5E9F3; --muted:#9AA5BF; --accent:#8BA4F2; --accent-ink:#0B1330; --accent-soft:#25325A;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding-block:18px;padding-inline:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:auto}
.brand b{font-family:var(--f-display);font-size:16px;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;color:var(--ink);font-size:13px}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
main{min-width:0;padding-block:22px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mobile-nav a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink);background:var(--sunk);font-size:13px}
  .mobile-nav a.on{background:var(--accent);color:var(--accent-ink)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
input.i[disabled],select.i[disabled],textarea.i[disabled]{background:var(--sunk);color:var(--muted)}
textarea.i{min-height:70px;resize:vertical;line-height:1.6}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr,textarea.ltr{direction:ltr;text-align:left}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:span 2} @media (max-width:520px){.span2{grid-column:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.cols.even{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .l,.kpi.lead .s,.kpi.lead .v small{color:var(--accent-ink);opacity:.85}
.kpis.mini .kpi{padding:10px 14px}.kpis.mini .kpi .v{font-size:18px}
a.kpi{text-decoration:none;color:inherit}a.kpi:hover{border-color:var(--accent)}
.delta{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;margin-inline-start:6px}
.delta.up{background:var(--ok-bg);color:var(--ok)}.delta.down{background:var(--bad-bg);color:var(--bad)}
.kpi.lead .delta{background:rgba(255,255,255,.18);color:inherit}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--sunk);text-align:start;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 10px;white-space:nowrap}
table.t td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:end;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--sunk)}
.ltr{direction:ltr;unicode-bidi:isolate}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.paid,.chip.transferred{background:var(--ok-bg);color:var(--ok)}
.chip.partial{background:var(--warn-bg);color:var(--warn)}
.chip.issued,.chip.open{background:var(--info-bg);color:var(--info)}
.chip.draft{background:var(--sunk);color:var(--muted)}
.chip.cancelled{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.chip.legacy{background:var(--gold-soft);color:var(--gold)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.tag.pf{background:var(--accent-soft);color:var(--accent)}
.tag.lg{background:var(--sunk);color:var(--muted)}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.lock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* tabs / filters */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;font-size:12.5px;padding-block:5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent)}

/* editor */
table.lines{width:100%;border-collapse:collapse;min-width:680px}
table.lines th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:6px;background:var(--sunk);white-space:nowrap}
table.lines td{padding:4px;border-top:1px solid var(--line);vertical-align:top}
table.lines input{width:100%;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;min-width:0}
table.lines input:hover{border-color:var(--line)}
table.lines input:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.lines input[disabled]{color:var(--ink)}
table.lines tr.head input.d{font-weight:700}
table.lines td.tot{padding:10px 8px;text-align:end;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;line-height:0}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn.on{color:var(--gold)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.totals{display:grid;grid-template-columns:auto 160px;gap:6px 16px;justify-content:end;align-items:center;margin-top:12px}
.totals .big{font-size:18px;font-weight:700}
.sticky-bar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;border-radius:var(--r);z-index:5;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}

/* detail */
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.doccard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.doccard b{font-size:14px}
.doccard .hint{flex:1}
.doccard .row{display:flex;gap:6px;flex-wrap:wrap}

/* toast + modal */
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px;font-family:var(--f-display);font-size:16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.checkl{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.checkl label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;flex-wrap:wrap}
.checkl label:hover{background:var(--sunk)}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login .brand{flex-direction:column;text-align:center;gap:6px}
.login .brand img{width:52px}
.login .brand b{font-size:19px}
.login .err{color:var(--bad);font-size:13px;min-height:18px}

/* ---------- paper documents (match the Excel originals) ---------- */
.paper-wrap{overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px;background:var(--sunk);border-radius:var(--r)}
.paper-scale{transform-origin:top center}
.sheet{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:14px;line-height:1.45;direction:ltr;text-align:left;position:relative;padding:30px 44px 90px;box-shadow:0 2px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;margin-bottom:18px}
.sheet table{border-collapse:collapse;width:100%;color:var(--paper-ink);font-family:inherit}
.sheet td,.sheet th{color:var(--paper-ink)}
.sheet .ar{font-family:var(--f-doc-ar);direction:rtl;unicode-bidi:isolate}
.lh{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:16px;align-items:center;padding-bottom:10px;border-bottom:1.5px solid var(--paper-gold)}
.lh .co{font-family:var(--f-doc-sans);font-size:12.5px;line-height:1.55;text-align:center}
.lh .co .r1{font-size:13.5px;font-weight:700}
.lh .co .ar{font-family:var(--f-doc-ar)}
.lh img{width:74px;justify-self:end}
.dateno{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:14px}
.dateno b{font-weight:700}
.red{color:var(--paper-red)!important;font-weight:700}
.titlerow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin:14px 0 12px}
.titlebar{display:flex;flex-direction:column;align-items:center;gap:3px}
.titlebar i{display:block;height:3px;width:100%;background:var(--paper-navy)}
.titlebar b{font-size:22px;letter-spacing:4px;padding:2px 28px}
.titlerow .side{text-align:right;font-family:var(--f-doc-sans);font-size:12.5px;font-weight:700}
.doc-title{text-align:center;margin:16px 0 12px}
.doc-title b{display:inline-block;font-size:22px;letter-spacing:3px;border-top:3px double var(--paper-navy);border-bottom:3px double var(--paper-navy);padding:3px 26px}
.doc-title small{display:block;font-size:12.5px;color:#444;margin-top:4px}
.billto{display:grid;grid-template-columns:auto minmax(0,1.3fr) auto minmax(0,1fr);gap:4px 10px;margin-bottom:12px;font-size:13.5px}
.billto b{white-space:nowrap}
.billto .v{min-width:0;overflow-wrap:anywhere;font-family:var(--f-doc-sans);font-weight:700;font-size:12.5px}
.purpose{font-size:13.5px;margin:-4px 0 12px}
table.items th{background:var(--paper-soft);border:1px solid var(--paper-line);padding:6px;font-size:12.5px;font-family:var(--f-doc-sans)}
table.items td{border:1px solid var(--paper-line);padding:5px 7px;font-size:13px;vertical-align:top;white-space:pre-line;font-family:var(--f-doc-sans)}
table.items td.c{text-align:center}
table.items td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.items tr.h td{font-weight:700;font-family:var(--f-doc);font-size:14px}
table.items tr.pad td{height:26px}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;margin-top:8px;align-items:start}
.sumrow .w{font-family:var(--f-doc-sans);font-size:12.5px;font-weight:700;padding-top:14px}
.sumrow .w .ar{display:block;font-weight:400;margin-top:4px;font-size:13px}
table.tot td{padding:4px 8px;font-size:13px;font-family:var(--f-doc-sans)}
table.tot td:last-child{background:var(--paper-blue);border:1px solid #9FB4D0;text-align:right;font-variant-numeric:tabular-nums;width:110px}
table.tot tr.net td{font-weight:700}
table.bank{width:auto;min-width:420px;margin-top:20px;font-family:var(--f-doc-sans);font-size:12px}
table.bank td{border:1px solid var(--paper-line);padding:2px 8px}
table.bank tr.hd td{background:#E7E6E6;font-family:var(--f-doc);font-weight:700;font-size:14px;border-bottom:2px solid var(--paper-line)}
table.bank td:first-child{font-weight:700;white-space:nowrap}
.signblock{margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.signblock .co{font-family:var(--f-doc-sans);font-weight:700;font-size:13px}
.signblock .co small{display:block;font-weight:400;color:#555;font-size:11.5px;margin-top:2px}
.stampbox{position:relative;width:240px;height:120px}
.stampbox img.stamp{position:absolute;width:118px;opacity:.9;bottom:0;left:30px;transform:rotate(-8deg)}
.stampbox img.sign{position:absolute;width:150px;bottom:24px;left:80px}
.signs3{margin-top:auto;padding-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:center;font-size:13px}
.signs3>div>div:last-child{border-top:1px solid var(--paper-line);padding-top:5px}
.foot{position:absolute;left:40px;right:40px;bottom:22px;border-top:1px solid #999;padding-top:6px;text-align:center;font-family:var(--f-doc-sans);font-size:11.5px;color:#333}
.cert-meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;margin-top:16px;align-items:start}
table.kv td{border:1px solid var(--paper-line);padding:4px 8px;font-size:12.5px;vertical-align:top;font-family:var(--f-doc-sans)}
table.kv td:first-child{font-weight:700;background:var(--paper-soft);white-space:nowrap;width:1%}
.cert-body{font-size:15px;line-height:1.85;margin-top:10px;text-align:justify}
.cert-body p{margin:0 0 12px}
.cert-body ol{margin:4px 0 12px;padding-left:22px}
.cert-body h4{margin:10px 0 4px;font-size:15px;text-decoration:underline}
.wtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:18px}
.wtitle b{font-size:20px;display:block}
.wtitle small{font-size:12px;color:#555}
.letter{font-size:15px;line-height:1.8;margin-top:12px}
.letter p{margin:0 0 11px}
.letter ol{margin:0 0 11px;padding-left:24px}
.sheet.rtl .letter{direction:rtl;text-align:right;font-family:var(--f-doc-ar);font-size:15.5px}
.sheet.rtl .letter ol{padding-left:0;padding-right:24px}
.watermark{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:96px;color:rgba(178,58,48,.13);transform:rotate(-24deg);font-weight:700;pointer-events:none;font-family:var(--f-doc-sans)}
.watermark.draft{color:rgba(80,80,80,.12)}
.note-box{border:1px dashed #777;padding:6px 10px;font-size:12px;margin-top:10px;font-family:var(--f-doc-sans)}
.rcpt-box{border:1.5px solid var(--paper-line);padding:14px 18px;margin-top:10px;font-size:15px;line-height:2.1}
.rcpt-box .amt{display:inline-block;border:1.5px solid var(--paper-line);padding:2px 14px;font-weight:700;background:var(--paper-blue)}

#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page;height:1123px;overflow:hidden}
}
#render-root{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n)||0)*100)/100;
const fmt = (n, d=2) => (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = n => (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const blank = v => v===null || v===undefined || v==="";
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addMonths = (iso, n) => { if(!iso) return ""; const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+Number(n||0)); d.setDate(d.getDate()-1); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const dmy = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const longDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d} / ${MONTHS_EN[+m-1]} / ${y}`; };
const dayDate = iso => { if(!iso) return ""; return `${DAYS_EN[new Date(iso+"T00:00:00").getDay()]}    ${longDate(iso)}`; };
const longDateAr = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${+d} ${MONTHS_AR[+m-1]} ${y}`; };
const uid = p => (p||"x")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fill = (tpl, map) => String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=> map[k]!==undefined ? (map[k]===""?"—":map[k]) : m);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(base, over){ const out=clone(base); for(const k in (over||{})){ const v=over[k]; if(v && typeof v==="object" && !Array.isArray(v) && out[k] && typeof out[k]==="object" && !Array.isArray(out[k])) out[k]=deepMerge(out[k],v); else if(v!==undefined) out[k]=v; } return out; }
function ssGet(k){ try{ return JSON.parse(sessionStorage.getItem(k)||"null"); }catch(e){ return null; } }
function ssSet(k,v){ try{ v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function en3(n){ let s=""; const h=Math.floor(n/100), r=n%100; if(h) s+=ONES[h]+" Hundred"; if(r){ if(s) s+=" "; s+= r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?" "+ONES[r%10]:""); } return s; }
function enWords(n){ n=Math.floor(Math.abs(n)); if(!n) return "Zero"; const sc=["","Thousand","Million","Billion"]; let parts=[],i=0; while(n>0){ const c=n%1000; if(c) parts.unshift(en3(c)+(sc[i]?" "+sc[i]:"")); n=Math.floor(n/1000); i++; } return parts.join(" "); }
function amountEn(x){ x=r2(x); const r=Math.floor(Math.abs(x)), d=Math.round((Math.abs(x)-r)*100); return "Only "+enWords(r)+" Qatar Riyal and "+(d?enWords(d):"No")+" Dirhams"; }
/* amount in words — Arabic */
const AONES=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
const ATENS=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
const AHUN=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
function ar99(n){ if(n<20) return AONES[n]; const u=n%10,t=Math.floor(n/10); return u? AONES[u]+" و"+ATENS[t] : ATENS[t]; }
function ar3(n){ const h=Math.floor(n/100), r=n%100; return [AHUN[h], r?ar99(r):""].filter(Boolean).join(" و"); }
function arScale(n, one, two, plural){ if(n===1) return one; if(n===2) return two; if(n>=3&&n<=10) return ar3(n)+" "+plural; return ar3(n)+" "+one; }
function arWords(n){ n=Math.floor(Math.abs(n)); if(!n) return "صفر"; const parts=[]; const b=Math.floor(n/1e9)%1000, m=Math.floor(n/1e6)%1000, t=Math.floor(n/1000)%1000, r=n%1000;
  if(b) parts.push(arScale(b,"مليار","ملياران","مليارات")); if(m) parts.push(arScale(m,"مليون","مليونان","ملايين")); if(t) parts.push(arScale(t,"ألف","ألفان","آلاف")); if(r) parts.push(ar3(r)); return parts.join(" و"); }
function amountAr(x){ x=r2(x); const r=Math.floor(Math.abs(x)), d=Math.round((Math.abs(x)-r)*100); return "فقط "+arWords(r)+" ريال قطري"+(d?" و"+arWords(d)+" درهم":"")+" لا غير"; }

/* ---------------- invoice math & status ---------------- */
function lineTotal(l){
  if(!l || l.heading) return 0;
  if(blank(l.qty) && blank(l.price)) return r2(Number(l.amount)||0);
  if(blank(l.qty)) return r2(Number(l.price)||0);
  return r2((Number(l.qty)||0)*(Number(l.price)||0));
}
function dedAmount(d, sub){ return r2(!blank(d.pct) && Number(d.pct) ? sub*Number(d.pct)/100 : Number(d.amount)||0); }
const activePays = inv => (inv.payments||[]).filter(p=>!p.reversed);
function calc(inv){
  const sub = r2((inv.lines||[]).reduce((s,l)=> s + lineTotal(l),0));
  const ded = r2((inv.deductions||[]).reduce((s,d)=> s + dedAmount(d,sub),0));
  const total = r2(sub - ded - (Number(inv.discount)||0));
  const paid = inv.kind==="special" ? 0 : r2(activePays(inv).reduce((s,p)=>s+(Number(p.amount)||0),0));
  return {sub,ded,total,paid,balance:r2(total-paid)};
}
function statusOf(inv){
  if(inv.status==="cancelled") return "cancelled";
  if(inv.status==="draft") return "draft";
  if(inv.kind==="special") return inv.spStatus==="transferred"?"transferred":"open";
  if(inv.kind==="proforma") return inv.convertedTo?"paid":"issued";
  const c=calc(inv);
  if(c.total>0 && c.paid>=c.total-0.004) return "paid";
  if(c.paid>0) return "partial";
  return "issued";
}
const isLegacy = inv => !!inv.imported;
const awaitingReview = inv => isLegacy(inv) && !inv.reviewed;
const inAccounts = inv => inv.kind==="invoice" && inv.status!=="cancelled" && inv.status!=="draft";
const confirmed = inv => inAccounts(inv) && !awaitingReview(inv);
const isLocked = inv => inv.status!=="draft" && !(isLegacy(inv) && isAdmin());
const dispNo = inv => inv.no || ("DRAFT-"+String(inv.id||"").slice(-5).toUpperCase());

}

function warrantyType(inv){
  if(inv.warrantyType && inv.warrantyType!=="auto") return inv.warrantyType;
  const t=[inv.typeOfWorks, inv.worksList, ...(inv.lines||[]).map(l=>l.desc)].join(" ").toLowerCase();
  if(/paint|دهان|صبغ|coating/.test(t)) return "paint";
  if(/plant|flower|tree|landscap|grass|irrigat|زراع|نبات|زهور|اشجار|أشجار|تشجير|عشب/.test(t)) return "agri";
  return "general";
}

/* ---------------- serial numbers ----------------
   PREFIX-SERIES-NNNNNN, one continuous counter per series (never resets).
   Numbers are reserved only when a document is issued; drafts use a temporary label.
   Reservation takes a short lease on counters/<SERIES> so two devices never get the same number. */
const fmtSerial = (series, n) => `${S.settings.numbering.prefix}-${series}-${String(n).padStart(6,"0")}`;
function usedNumbers(){
  const out=[];
  for(const i of S.invoices){ if(i.no) out.push(i.no); for(const k of ["completion","warranty","cover"]) if(i.docNos?.[k]?.no) out.push(i.docNos[k].no); for(const p of i.payments||[]) if(p.rcv?.no) out.push(p.rcv.no); }
  return out;
}
function maxUsed(series){
  const re=new RegExp("^"+S.settings.numbering.prefix.replace(/[^A-Za-z0-9]/g,"\\$&")+"-"+series+"-(\\d+)$"); let m=0;
  for(const n of usedNumbers()){ const x=String(n).match(re); if(x) m=Math.max(m,+x[1]); }
  return m;
}
async function allocate(series){
  const start=Number(S.settings.numbering.start?.[series]||1);
  const now=new Date().toISOString();
  if(S.mode==="cloud"){
    const ref=DB.doc("counters/"+series);
    for(let attempt=0; attempt<8; attempt++){
      let lease; try{ lease=await ref.acquire({holder:S.session.u+"-"+(S.uid||"x"), ttlMs:6000}); }catch(e){ lease={acquired:true}; }
      if(!lease.acquired){ await new Promise(r=>setTimeout(r,500+Math.random()*500)); continue; }
      const snap=await ref.get(); const last=snap.exists?Number(snap.data().last)||0:0;
      const n=Math.max(last, maxUsed(series), start-1)+1;
      await ref.set({last:n, series, at:now, by:actor()});
      S.counters[series]={last:n};
      return fmtSerial(series,n);
    }
    throw new Error("الترقيم مشغول — حاول مرة أخرى");
  }
  const d=lsRead(); d.counters=d.counters||{}; const last=Number(d.counters[series]?.last)||0;
  const n=Math.max(last, maxUsed(series), start-1)+1; d.counters[series]={last:n,at:now,by:actor()}; lsWrite(d); S.counters=d.counters;
  return fmtSerial(series,n);
}

/* ---------------- storage layer ---------------- */
const LS_KEY="alharam-invoices-v1";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null") || {invoices:{},customers:{},settings:null,counters:{},audit:[]}; }catch(e){ return {invoices:{},customers:{},settings:null,counters:{},audit:[]}; } }
function lsWrite(d){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); return true; }catch(e){ toast("تعذر الحفظ في المتصفح: "+e.message); return false; } }
const Store = {
  async save(col, id, data){
    if(S.mode==="cloud") await withRetry(()=>DB.collection(col).doc(id).set(data));
    else { const d=lsRead(); d[col]=d[col]||{}; d[col][id]=data; if(!lsWrite(d)) throw new Error("local"); localLoad(); }
  },
  async remove(col, id){
    if(S.mode==="cloud") await withRetry(()=>DB.collection(col).doc(id).delete());
    else { const d=lsRead(); if(d[col]) delete d[col][id]; lsWrite(d); localLoad(); }
  },
  async saveSettings(st){
    if(S.mode==="cloud") await withRetry(()=>DB.doc("settings/main").set(st));
    else { const d=lsRead(); d.settings=st; lsWrite(d); localLoad(); }
  }
};
async function audit(action, ref, detail){
  const e={at:new Date().toISOString(), u:actor(), role:role(), action, ref:ref||"", detail:detail||""};
  try{
    if(S.mode==="cloud") await DB.collection("audit").add(e);
    else { const d=lsRead(); d.audit=[e,...(d.audit||[])].slice(0,2000); lsWrite(d); }
  }catch(err){ console.warn("audit",err); }
}
async function withRetry(fn){
  try{ return await fn(); }
  catch(e){
    if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return await fn(); }
    if(e && e.code==="invalid_argument" && S.mode==="cloud") toast("رفضت قاعدة البيانات الحفظ — قد لا تملك صلاحية التعديل على هذه المشاركة");
    if(e && e.code==="quota_exceeded") toast("امتلأت سعة قاعدة البيانات. صدّر نسخة احتياطية.");
    throw e;
  }
}
function localLoad(){
  const d=lsRead();
  S.invoices=Object.entries(d.invoices||{}).map(([id,v])=>({...v,id}));
  S.customers=Object.entries(d.customers||{}).map(([id,v])=>({...v,id}));
  S.settings=deepMerge(DEFAULT_SETTINGS, d.settings||{});
  S.counters=d.counters||{};
  S.loaded={inv:true,cus:true,set:true};
  sortData(); renderSoon();
}
function sortData(){
  S.invoices.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || String(dispNo(b)).localeCompare(String(dispNo(a))));
  S.customers.sort((a,b)=> (a.name||"").localeCompare(b.name||"","ar"));
}
async function boot(){
  render();
  let cloud=null;
  try{ if(window.claude && typeof window.claude.use==="function") cloud = await window.claude.use("db"); }catch(e){ cloud=null; }
  if(cloud){
    DB=cloud; S.mode="cloud";
    try{ USER = await window.claude.use("user"); }catch(e){ USER=null; }
    try{ DL = await window.claude.use("downloads"); }catch(e){ DL=null; }
    if(USER){
      try{ S.uid = await USER.id(); }catch(e){}
      try{ const w=await USER.can("data.write"); S.canWrite = w!==false; }catch(e){}
      try{ S.isPlatformAdmin = await USER.canEdit(); }catch(e){}
    }
    subscribe();
  } else { S.mode="local"; localLoad(); }
  S.session = ssGet("alharam-session") || lsGet("alharam-session");
  render();
}
function subscribe(){
  const timer=setTimeout(()=>{ S.stale=true; S.loaded.set=true; render(); },10000);
  const done=()=>{ if(S.loaded.inv&&S.loaded.cus){ clearTimeout(timer); S.stale=false; } };
  DB.collection("invoices").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
    S.invoices = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.inv=true; done(); sortData(); renderSoon();
  }, err=>{ S.loaded.inv=true; S.stale=true; clearTimeout(timer); toast("تعذر قراءة الفواتير ("+err.code+")"); render(); });
  DB.collection("customers").onSnapshot(snap=>{
    S.customers = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.cus=true; done(); sortData(); renderSoon();
  }, ()=>{ S.loaded.cus=true; S.stale=true; render(); });
  DB.collection("counters").onSnapshot(snap=>{ const c={}; snap.docs.forEach(d=>c[d.id]=d.data()); S.counters=c; }, ()=>{});
  DB.doc("settings/main").onSnapshot(snap=>{
    S.settings = deepMerge(DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    if(!snap.metadata.fromCache || snap.exists) S.loaded.set=true; renderSoon();
  }, ()=>{ S.loaded.set=true; renderSoon(); });
}

/* ---------------- authentication ----------------
   Usernames/password hashes live in settings/main (PBKDF2-SHA256, per-user salt).
   The real data protection is the artifact's sharing level; the login decides which screens a person gets. */
async function hashPw(pw, salt){
  if(!(window.crypto && crypto.subtle)) throw new Error("المتصفح لا يدعم التشفير المطلوب");
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function makeUser(u, name, roleName, pw){ const salt=newSalt(); return {u:u.trim().toLowerCase(), name:String(name||"").trim()||u, role:roleName, salt, hash:await hashPw(pw,salt), active:true, createdAt:new Date().toISOString()}; }
async function login(u, pw, remember){
  const user=(S.settings.users||[]).find(x=>x.u===String(u).trim().toLowerCase() && x.active!==false);
  if(!user) return "اسم المستخدم أو كلمة المرور غير صحيحة";
  const h=await hashPw(pw,user.salt);
  if(h!==user.hash) return "اسم المستخدم أو كلمة المرور غير صحيحة";
  S.session={u:user.u, name:user.name, role:user.role, at:Date.now()};
  ssSet("alharam-session",S.session); if(remember) lsSet("alharam-session",S.session); else lsSet("alharam-session",null);
  audit("تسجيل دخول", user.u);
  return "";
}
function logout(){ audit("تسجيل خروج", actor()); S.session=null; ssSet("alharam-session",null); lsSet("alharam-session",null); history.replaceState(null,"",location.pathname+location.search); S.route={name:"",arg:""}; render(); }
function validateSession(){
  if(!S.session) return;
  const user=(S.settings.users||[]).find(x=>x.u===S.session.u && x.active!==false);
  if(S.loaded.set && (S.settings.users||[]).length && (!user || user.role!==S.session.role)){ S.session=null; ssSet("alharam-session",null); lsSet("alharam-session",null); }
  else if(user) S.session.name=user.name;
}

/* ---------------- routing ---------------- */
const ROUTE_PERM = {dashboard:"dashboard", invoices:"invoices", special:"invoices", new:"edit", edit:"edit", inv:"invoices", register:"register", reports:"reports", customers:"customers", customer:"customers", statement:"statement", config:"settings", audit:"audit", sequences:"reports", rcpt:"print"};
function parseHash(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const simple=["dashboard","invoices","special","register","reports","customers","config","audit","sequences"];
  if(!h) return {name:"", arg:""};
  if(simple.includes(h)) return {name:h, arg:""};
  if(h==="new"||h==="new-invoice") return {name:"new",arg:"invoice"};
  if(h==="new-proforma") return {name:"new",arg:"proforma"};
  if(h==="new-special") return {name:"new",arg:"special"};
  let m=h.match(/^rcpt-(.+)-(\d+)$/); if(m) return {name:"rcpt",arg:m[1],k:+m[2]};
  m=h.match(/^(inv|edit|doc-invoice|doc-completion|doc-warranty|doc-cover|doc-pack|customer|statement)-(.+)$/);
  if(m) return {name:m[1],arg:m[2]};
  return {name:"",arg:""};
}
const homeRoute = () => isAdmin() ? "dashboard" : "invoices";
function go(h){ if(location.hash==="#"+h){ S.route=parseHash(); render(); } else location.hash=h; window.scrollTo(0,0); }
window.addEventListener("hashchange",()=>{ S.route=parseHash(); S.selected.clear(); S.doc.stamp=null; S.doc.styleSet=false; render(); window.scrollTo(0,0); });

/* ---------------- toast & modal ---------------- */
let _tt=null;
function toast(msg){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; clearTimeout(_tt); _tt=setTimeout(()=>t.remove(),3400); }
function modal(html, onMount){
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" dir="rtl">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); renderSoon(); };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  $$("[data-close]",bg).forEach(b=>b.onclick=close);
  onMount && onMount(bg, close);
  const f=$("input,select,textarea",bg)||$("button",bg); f && f.focus();
  return close;
}
function confirmBox(msg, okLabel, fn, danger, withReason){
  modal(`<h3>تأكيد</h3><p>${esc(msg)}</p>${withReason?'<label class="f">السبب (إلزامي)<textarea class="i" id="cb-reason"></textarea></label>':''}<div class="foot"><button class="btn" data-close>رجوع</button><button class="btn ${danger?"danger":"primary"}" id="cb-ok">${esc(okLabel)}</button></div>`,(bg,close)=>{
    $("#cb-ok",bg).onclick=async()=>{ const reason=withReason?$("#cb-reason",bg).value.trim():""; if(withReason&&reason.length<3){ toast("اكتب السبب"); return; } bg.remove(); try{ await fn(reason); }catch(e){ console.error(e); toast("تعذرت العملية: "+(e.message||e.code||e)); } renderSoon(); };
  });
}

function navActive(n){ const r=S.route.name; if(n==="invoices") return ["invoices","inv","edit","rcpt"].includes(r)||r.startsWith("doc"); if(n==="customers") return ["customers","customer","statement"].includes(r); return r===n; }
function connLabel(){ return S.mode==="cloud" ? (S.stale?'<span class="conn"><i class="dot warn"></i>البيانات قد لا تكون محدّثة</span>':'<span class="conn"><i class="dot ok"></i>متصل بقاعدة البيانات السحابية</span>')

function render(){
  if(S.mode==="loading" || (S.mode==="cloud" && !S.loaded.set)){ $("#app").innerHTML=`<div class="login-wrap"><div class="login"><div class="brand"><img src="${IMG.logo}" alt=""><b>نظام فواتير الحرم</b><small class="muted">جارٍ الاتصال بقاعدة البيانات…</small></div></div></div>`; return; }
  validateSession();
  if(!(S.settings.users||[]).length){ $("#app").innerHTML=viewSetup(); bindSetup(); return; }
  if(!S.session){ $("#app").innerHTML=viewLogin(); bindLogin(); return; }
  if(!S.route || !S.route.name) S.route=parseHash();
  if(!S.route.name) S.route={name:homeRoute(),arg:""};
  const perm=ROUTE_PERM[S.route.name] || (S.route.name.startsWith("doc-")?"print":"invoices");
  if(!can(perm)){ S.route={name:homeRoute(),arg:""}; history.replaceState(null,"","#"+homeRoute()); }
  const r=S.route.name; let html="";
  try{
    if(r==="dashboard") html=viewDashboard();
    else if(r==="invoices") html=viewInvoices(false);
    else if(r==="special") html=viewInvoices(true);
    else if(r==="new") html=viewEditor(null, S.route.arg||"invoice");
    else if(r==="edit") html=viewEditor(S.route.arg);
    else if(r==="inv") html=viewInvoice(S.route.arg);
    else if(r.startsWith("doc-")) html=viewDoc(r.slice(4), S.route.arg);
    else if(r==="rcpt") html=viewReceipt(S.route.arg, S.route.k);
    else if(r==="register") html=viewRegister();
    else if(r==="reports") html=viewReports();
    else if(r==="sequences") html=viewSequences();
    else if(r==="customers") html=viewCustomers();

  $("#app").innerHTML = shell(html);

}

function bindSetup(){
  const f=$("#setup-form"); if(!f||!$("#su-u")) return;
  f.onsubmit=async e=>{ e.preventDefault(); const err=$("#su-err"); err.textContent="";
    const u=$("#su-u").value.trim().toLowerCase(), n=$("#su-n").value.trim(), p=$("#su-p").value, a=$("#su-a").value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){ err.textContent="اسم المستخدم: حروف إنجليزية وأرقام فقط (3 أحرف على الأقل)"; return; }

    if(a && a.length<8){ err.textContent="كلمة مرور المحاسب 8 أحرف على الأقل"; return; }
    try{
      const users=[await makeUser(u,n||"CEO","admin",p)]; if(a) users.push(await makeUser("accountant","المحاسب","accountant",a));
      const st=clone(S.settings); st.users=users; await Store.saveSettings(st); S.settings=st;
      await login(u,p,false); audit("تهيئة النظام", u); f.remove(); render();
    }catch(e2){ err.textContent="تعذر الحفظ: "+(e2.message||e2.code||e2); }

function years(){ const s=new Set(S.invoices.map(i=>+(i.date||"").slice(0,4)).filter(Boolean)); s.add(new Date().getFullYear()); return [...s].sort((a,b)=>b-a); }
function delta(cur, prev){ if(!prev) return ""; const p=Math.round((cur-prev)/prev*100); return `<span class="delta ${p>=0?"up":"down"}">${p>=0?"▲":"▼"} ${Math.abs(p)}%</span>`; }
const lastSerial = series => { const n=Math.max(Number(S.counters[series]?.last)||0, maxUsed(series)); return n?fmtSerial(series,n):""; };
function viewDashboard(){
  if(!S.loaded.inv && S.mode==="cloud") return `<div class="top"><div><h1>لوحة التحكم</h1><p>جارٍ تحميل البيانات…</p></div></div>`;
  const Y=S.year, cy=new Date().getFullYear(), today=todayISO();
  const cut = Y===cy ? today.slice(5) : "12-31";

  const acc=S.invoices.filter(i=>inAccounts(i)&&inY(i,Y)), accPrev=S.invoices.filter(i=>inAccounts(i)&&inY(i,Y-1));
  const sumT=L=>r2(L.reduce((s,i)=>s+calc(i).total,0));
  const invoiced=sumT(acc), invoicedPrev=sumT(accPrev);
  const conf=S.invoices.filter(confirmed);
  const collectedY=r2(conf.reduce((s,i)=>s+activePays(i).filter(p=>(p.date||"").startsWith(String(Y))).reduce((a,p)=>a+(+p.amount||0),0),0));
  const outstanding=r2(conf.reduce((s,i)=>s+Math.max(0,calc(i).balance),0));
  const openCount=conf.filter(i=>calc(i).balance>0.004).length;

  const spOpen=S.invoices.filter(i=>i.kind==="special"&&statusOf(i)==="open"), spAmt=r2(spOpen.reduce((s,i)=>s+calc(i).total,0));
  const pfOpen=S.invoices.filter(i=>i.kind==="proforma"&&statusOf(i)==="issued"), pfAmt=r2(pfOpen.reduce((s,i)=>s+calc(i).total,0));
  const legacy=S.invoices.filter(i=>awaitingReview(i)&&i.status!=="cancelled");
  const missingCert=S.invoices.filter(i=>inAccounts(i)&&!isLegacy(i)&&(!i.typeOfWorks||!i.workOrder||!i.site));
  const mi=Array(12).fill(0), mp=Array(12).fill(0), mc=Array(12).fill(0);
  S.invoices.filter(i=>inAccounts(i)&&(i.date||"").startsWith(String(Y))).forEach(i=>mi[+i.date.slice(5,7)-1]+=calc(i).total);
  S.invoices.filter(i=>inAccounts(i)&&(i.date||"").startsWith(String(Y-1))).forEach(i=>mp[+i.date.slice(5,7)-1]+=calc(i).total);
  conf.forEach(i=>activePays(i).forEach(p=>{ if((p.date||"").startsWith(String(Y))) mc[+p.date.slice(5,7)-1]+=Number(p.amount)||0; }));
  const group=(key)=>{ const g={}; S.invoices.filter(i=>inAccounts(i)&&(i.date||"").startsWith(String(Y))).forEach(i=>{ const k=(key(i)||"").trim()||"غير محدد"; g[k]=(g[k]||0)+calc(i).total; }); return Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,7); };
  const bars=(rows)=>{ const mx=rows[0]?.[1]||1; return rows.length?rows.map(([n,v])=>`<div class="hbar"><span class="nm" title="${esc(n)}" dir="auto">${esc(n)}</span><span class="bar"><i style="width:${v/mx*100}%"></i></span><span class="num">${fmt0(v)}</span></div>`).join(""):'<div class="empty">لا توجد بيانات</div>'; };
  return `<div class="top"><div><h1>لوحة التحكم</h1><p>ملخص الإدارة لسنة ${Y}${Y===cy?" حتى اليوم، مقارنة بنفس الفترة من "+(Y-1):" مقارنة بسنة "+(Y-1)}</p></div>
    <div class="actions"><select class="i" id="dash-year" aria-label="السنة" style="width:auto">${years().map(y=>`<option ${y===Y?"selected":""}>${y}</option>`).join("")}</select>
    ${can("edit")?`<a class="btn primary" href="#new">${IC.plus}فاتورة جديدة</a>`:""}</div></div>

    <div class="kpi"><div class="l">الرصيد المفتوح لدى العملاء</div><div class="v">${fmt(outstanding)} <small>ر.ق</small></div><div class="s">${openCount} فاتورة مؤكدة لم تُسدد بالكامل</div></div>
    <div class="kpi"><div class="l">متوسط قيمة الفاتورة</div><div class="v">${fmt(acc.length?invoiced/acc.length:0)} <small>ر.ق</small></div><div class="s">${certCount} شهادة صادرة في ${Y}</div></div>
  </div>
  <div class="kpis mini">
    <a class="kpi" href="#invoices" data-goto-status="draft"><div class="l">مسودات لم تُعتمد</div><div class="v">${drafts.length}</div></a>

    <a class="kpi" href="#invoices" data-goto-tab="proforma"><div class="l">فواتير مبدئية لم تُحوّل</div><div class="v">${fmt0(pfAmt)} <small>ر.ق · ${pfOpen.length}</small></div></a>
    <a class="kpi" href="#invoices" data-goto-status="legacy"><div class="l">مستوردة بانتظار مراجعة السداد</div><div class="v">${legacy.length}</div></a>
  </div>
  <div class="cols">
    <div class="panel"><h2>الفواتير والتحصيل شهرياً <small>${Y}</small></h2>${monthChart(mi,mc,mp)}

      <div class="hbar" style="grid-template-columns:1fr auto"><span>مسودات بانتظار الاعتماد</span><b class="num">${drafts.length}</b></div>

      <div class="hbar" style="grid-template-columns:1fr auto"><span>آخر رقم فاتورة</span><b class="code">${esc(lastSerial("INV")||"—")}</b></div>
    </div>

  </div>`;

function monthChart(a,b,prev){
  const W=640,H=230,pl=48,pb=26,pt=10,pr=8, max=Math.max(1,...a,...b,...prev);
  const step=niceStep(max), top=Math.ceil(max/step)*step, ih=H-pb-pt, gw=(W-pl-pr)/12, bw=Math.min(16,gw/3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني شهري">`;
  for(let v=0; v<=top+0.001; v+=step){ const y=pt+ih-(v/top)*ih; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v>=1000?fmt0(v/1000)+"k":fmt0(v)}</text>`; }
  let path="";
  for(let m=0;m<12;m++){ const x=pl+gw*m+gw/2; const h1=a[m]/top*ih, h2=b[m]/top*ih;
    s+=`<rect x="${x-bw-1}" y="${pt+ih-h1}" width="${bw}" height="${Math.max(0,h1)}" rx="2" fill="var(--accent)"><title>${MONTHS_AR[m]}: ${fmt(a[m])}</title></rect>`;
    s+=`<rect x="${x+1}" y="${pt+ih-h2}" width="${bw}" height="${Math.max(0,h2)}" rx="2" fill="var(--ok)"><title>${MONTHS_AR[m]} محصّل: ${fmt(b[m])}</title></rect>`;
    s+=`<text x="${x}" y="${H-8}" text-anchor="middle">${m+1}</text>`;
    path+=(m?"L":"M")+x+" "+(pt+ih-prev[m]/top*ih); }
  s+=`<path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>`;
  return `<div class="chart">${s}</svg></div>`;
}
function niceStep(max){ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

/* ---------------- invoices list ---------------- */
function filteredInvoices(special){
  const L=S.list, q=L.q.trim().toLowerCase();
  return S.invoices.filter(i=>{
    if(special && i.kind!=="special") return false;
    if(!special){ if(L.tab==="invoice"&&i.kind!=="invoice") return false; if(L.tab==="proforma"&&i.kind!=="proforma") return false; if(L.tab==="special"&&i.kind!=="special") return false; }
    const st=statusOf(i);
    if(L.status==="legacy"){ if(!awaitingReview(i)) return false; }
    else if(L.status==="open"){ if(!["issued","partial","open"].includes(st)) return false; }
    else if(L.status && st!==L.status) return false;
    if(L.customer && i.customerId!==L.customer) return false;
    if(L.from && i.date<L.from) return false;
    if(L.to && i.date>L.to) return false;
    if(q){ const hay=[dispNo(i),i.customerName,i.site,i.location,i.typeOfWorks,i.workOrder,i.ref,i.purpose,...(i.lines||[]).map(l=>l.desc)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function invTable(list,opt={}){
  if(!list.length) return `<div class="empty"><b>لا توجد فواتير مطابقة</b>${can("edit")&&!opt.compact?'أنشئ فاتورة جديدة من الزر بالأعلى.':''}</div>`;

function buildRecord(base){
  const data=JSON.parse(JSON.stringify(base)); for(const k of ["_id","_kind","id"]) delete data[k];
  if(data.kind==="special" && data.mode==="grouped"){
    data.lines=(data.linked||[]).map(x=>({desc:`Invoice No. ${x.no} dated ${dmy(x.date)}${x.desc?" – "+x.desc:""}`,unit:"",qty:null,price:null,amount:x.amount}));
    data.deductions=[];
  } else {
    data.lines=(data.lines||[]).map(l=>l.heading?{desc:String(l.desc||""),heading:true}:{desc:String(l.desc||""),unit:String(l.unit||""),qty:blank(l.qty)?null:Number(l.qty),price:blank(l.price)?null:Number(l.price),...(blank(l.qty)&&blank(l.price)&&!blank(l.amount)?{amount:Number(l.amount)}:{})});
    const sub=calc(data).sub;
    data.deductions=(data.deductions||[]).filter(d=>String(d.label||"").trim()||Number(d.pct)||Number(d.amount)).map(d=>({label:String(d.label||""),pct:blank(d.pct)?null:Number(d.pct),amount:dedAmount(d,sub)}));
  }
  const c=calc(data);
  Object.assign(data,{subtotal:c.sub,total:c.total,paid:c.paid,balance:c.balance,year:+String(data.date||todayISO()).slice(0,4),excluded:data.kind!=="invoice",warranty:warrantyText(data)});
  return data;
}

/* ---------------- repeat (monthly contracts) ----------------
   Copies an invoice into a new DRAFT with a new date; the official number is given on issue.
   Optionally moves month names in the descriptions forward (e.g. "October 2026" -> "November 2026"). */
function nextMonth(iso){ const [y,m,d]=(iso||todayISO()).split("-").map(Number); const t=new Date(y,m,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(Math.min(d,last)).padStart(2,"0")}`; }
const MONTHS_EN3=MONTHS_EN.map(m=>m.slice(0,3));
function shiftMonthText(txt, fromISO, toISO){
  if(!txt || !fromISO || !toISO) return txt;
  const [fy,fm]=fromISO.split("-").map(Number), [ty,tm]=toISO.split("-").map(Number);
  if(fy===ty && fm===tm) return txt;
  let s=String(txt);
  const yr=t=>fy!==ty?t.replace(new RegExp("(^|\\D)"+fy+"(?!\\d)","g"),"$1"+ty):t;
  const swap=(from,to,flags)=>{ s=s.replace(new RegExp("(^|[^A-Za-z\\u0600-\\u06FF])("+from+")((?:\\s*[-/,]?\\s*)"+fy+")?(?![A-Za-z\\u0600-\\u06FF])",flags),(all,pre,name,y)=>pre+to+(y?yr(y):"")); };
  swap(MONTHS_EN[fm-1], MONTHS_EN[tm-1], "gi");
  swap(MONTHS_EN3[fm-1], MONTHS_EN3[tm-1], "g");
  swap(MONTHS_AR[fm-1], MONTHS_AR[tm-1], "g");
  const pad=n=>String(n).padStart(2,"0");
  s=s.replace(new RegExp("(^|\\D)"+pad(fm)+"([/-])"+fy+"(?!\\d)","g"),"$1"+pad(tm)+"$2"+ty);
  return s;
}
const REPEAT_DROP=["id","no","snap","docNos","issuedAt","issuedBy","imported","reviewed","reviewedAt","reviewedBy","sheet","cancelReason","cancelledAt","cancelledBy","convertedTo","fromProforma","createdAt","createdBy","updatedAt","updatedBy","transferredDate","transferRef","transferAmount"];
function repeatDraft(i, newDate, shift){
  const n=clone(i); for(const k of REPEAT_DROP) delete n[k];
  const sh=t=>shift?shiftMonthText(t,i.date,newDate):t;
  n.lines=(n.lines||[]).map(l=>({...l, desc:sh(l.desc)}));
  Object.assign(n,{date:newDate, completedDate:newDate, payments:[], history:[], status:"draft", repeatOf:dispNo(i), notes:(i.notes&&!isLegacy(i))?i.notes:"", worksList:sh(n.worksList||""), purpose:sh(n.purpose||""), spStatus:n.kind==="special"?"open":n.spStatus});
  if(n.kind==="special" && n.mode==="grouped"){ n.linked=[]; }
  return n;
}

async function patchInvoice(id, patch, action, auditRef){
  const i=invById(id); if(!i) return;
  const data={...i, ...patch}; delete data.id;
  const c=calc(data); const now=new Date().toISOString();
  Object.assign(data,{paid:c.paid,balance:c.balance,total:c.total,subtotal:c.sub,updatedAt:now,updatedBy:actor(),history:[...(i.history||[]),{at:now,by:actor(),action}].slice(-40)});
  await Store.save("invoices", id, data);
  const idx=S.invoices.findIndex(x=>x.id===id); if(idx>=0) S.invoices[idx]={...data,id};
  await audit(action, auditRef||i.no||dispNo(i));
}

async function makePdf(html, filename){
  if(!window.html2canvas || !window.jspdf){ toast("مكتبات PDF لم تُحمّل بعد — أعد المحاولة بعد لحظات"); return; }
  toast("جارٍ تجهيز ملف PDF…");
  const root=$("#render-root"); root.innerHTML=html;
  try{ await document.fonts.ready; }catch(e){}
  await Promise.all($$("img",root).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  let first=true;
  try{
    for(const sh of $$(".sheet",root)){
      const canvas=await html2canvas(sh,{scale:3,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
      const pageHpx=canvas.width*297/210;
      for(let y=0; y<canvas.height-4; y+=pageHpx){
        const h=Math.min(pageHpx, canvas.height-y);
        const part=document.createElement("canvas"); part.width=canvas.width; part.height=h;
        part.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
        if(!first) pdf.addPage(); first=false;

    }

  await saveFile(filename, pdf.output("blob"));
}

const xlsSafe = v => typeof v==="string" && /^[=+\-@\t\r]/.test(v) ? "'"+v : v;
function exportXlsx(T, name){
  if(!window.XLSX){ toast("مكتبة Excel لم تُحمّل بعد"); return; }
  const aoa=[T.head, ...T.rows.map(r=>[...r].map(xlsSafe)), ...(T.foot?[T.foot.map(xlsSafe)]:[])];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=T.head.map(()=>({wch:18}));
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]}; XLSX.utils.book_append_sheet(wb, ws, "Report");
  saveFile(safeName(name)+".xlsx", new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})]));
  audit("تصدير Excel", name);
}

async function reviewLegacy(i, paid){

    Object.keys(st.tpl.warranty).forEach(k=>{ st.tpl.warranty[k].body=v("tw-"+k+"-b"); st.tpl.warranty[k].exclusions=v("tw-"+k+"-e"); });
    try{ await Store.saveSettings(st); S.settings=deepMerge(DEFAULT_SETTINGS,st); await audit("تعديل الإعدادات","settings"); toast("تم حفظ الإعدادات"); }catch(err){ toast("تعذر حفظ الإعدادات — تحتاج صلاحية محرر"); } };
  const rs=$("#s-reset"); if(rs) rs.onclick=()=>confirmBox("استعادة نصوص النماذج الافتراضية؟ (لا تتغير بيانات الشركة والمستخدمين)","استعادة",async()=>{ const st=clone(S.settings); st.tpl=clone(DEFAULT_SETTINGS.tpl); await Store.saveSettings(st); S.settings=st; await audit("استعادة النصوص الافتراضية","settings"); toast("تمت الاستعادة"); $("#editor-form")?.remove(); render(); });
  const ua=$("#u-add"); if(ua) ua.onclick=()=>modal(`<h3>مستخدم جديد</h3><div class="grid g2"><label class="f">اسم المستخدم (إنجليزي)<input class="i ltr" id="nu-u"></label><label class="f">الاسم الظاهر<input class="i" id="nu-n"></label>
    <label class="f">الدور<select class="i" id="nu-r"><option value="accountant">محاسب</option><option value="admin">الإدارة (Admin / CEO)</option></select></label><label class="f">كلمة المرور (8 أحرف على الأقل)<input class="i ltr" type="password" id="nu-p" autocomplete="new-password"></label></div>
    <div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn primary" id="nu-ok">إضافة</button></div>`,(bg,close)=>{
    $("#nu-ok",bg).onclick=async()=>{ const u=$("#nu-u",bg).value.trim().toLowerCase(), p=$("#nu-p",bg).value;
      if(!/^[a-z0-9._-]{3,30}$/.test(u)){ toast("اسم المستخدم: حروف إنجليزية وأرقام (3 على الأقل)"); return; } if((S.settings.users||[]).some(x=>x.u===u)){ toast("اسم المستخدم مستخدم"); return; } if(p.length<8){ toast("كلمة المرور 8 أحرف على الأقل"); return; }
      try{ const st=clone(S.settings); st.users=[...(st.users||[]), await makeUser(u,$("#nu-n",bg).value,$("#nu-r",bg).value,p)]; await Store.saveSettings(st); S.settings=st; await audit("إضافة مستخدم", u, $("#nu-r",bg).value); bg.remove(); toast("تمت إضافة المستخدم"); $("#editor-form")?.remove(); render(); }catch(e){ toast("تعذر الحفظ — تحتاج صلاحية محرر"); } };
  });
  $$("[data-upw]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.upw, u=S.settings.users[k];
    modal(`<h3>كلمة مرور جديدة — <span class="code">${esc(u.u)}</span></h3><label class="f">كلمة المرور (8 أحرف على الأقل)<input class="i ltr" type="password" id="pw-n" autocomplete="new-password"></label><div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn primary" id="pw-ok">حفظ</button></div>`,(bg,close)=>{
      $("#pw-ok",bg).onclick=async()=>{ const p=$("#pw-n",bg).value; if(p.length<8){ toast("8 أحرف على الأقل"); return; }
        try{ const st=clone(S.settings); const salt=newSalt(); st.users[k]={...st.users[k],salt,hash:await hashPw(p,salt)}; await Store.saveSettings(st); S.settings=st; await audit("تغيير كلمة مرور", u.u); close(); toast("تم تغيير كلمة المرور"); }catch(e){ toast("تعذر الحفظ"); } }; }); });
  $$("[data-utog]").forEach(b=>b.onclick=async()=>{ const k=+b.dataset.utog; const st=clone(S.settings); const u=st.users[k];
    if(u.active!==false && u.role==="admin" && st.users.filter(x=>x.role==="admin"&&x.active!==false).length<=1){ toast("لا يمكن إيقاف آخر حساب إدارة"); return; }
    u.active = u.active===false; try{ await Store.saveSettings(st); S.settings=st; await audit(u.active?"تفعيل مستخدم":"إيقاف مستخدم", u.u); $("#editor-form")?.remove(); render(); }catch(e){ toast("تعذر الحفظ"); } });
  $("#bk-exp").onclick=()=>{ const st=clone(S.settings); st.users=(st.users||[]).map(u=>({u:u.u,name:u.name,role:u.role,active:u.active})); const data={app:"alharam-invoices",version:2,exportedAt:new Date().toISOString(),settings:st,counters:S.counters,customers:S.customers,invoices:S.invoices}; saveFile(`Alharam-Backup-${todayISO()}.json`, JSON.stringify(data,null,1)); audit("تصدير نسخة احتياطية",""); };
  $("#bk-xls").onclick=()=>{ if(!window.XLSX) return toast("مكتبة Excel لم تُحمّل");
    const wb=XLSX.utils.book_new(), sf=o=>{ const r={}; for(const k in o) r[k]=xlsSafe(o[k]); return r; };
    const inv=S.invoices.map(i=>{const c=calc(i);return sf({"الرقم":dispNo(i),"النوع":KIND[i.kind],"التاريخ":i.date,"العميل":i.customerName,"المدرسة":i.site||"","نوع الأعمال":i.typeOfWorks||"","أمر العمل":i.workOrder||"","المرجع":i.ref||"","الموقع":i.location||"","المجموع":c.sub,"الاستقطاعات":c.ded,"الخصم":+i.discount||0,"الصافي":c.total,"المدفوع":c.paid,"الرصيد":c.balance,"الحالة":STATUS_AR[statusOf(i)],"مستوردة":isLegacy(i)?"نعم":"","معتمدة بواسطة":i.issuedBy||""});});
    const lines=[]; S.invoices.forEach(i=>(i.lines||[]).forEach((l,k)=>lines.push(sf({"الفاتورة":dispNo(i),"#":k+1,"الوصف":l.desc,"عنوان":l.heading?"نعم":"","الوحدة":l.unit||"","الكمية":l.qty??"","السعر":l.price??"","الإجمالي":l.heading?"":lineTotal(l)}))));
    const pays=[]; S.invoices.forEach(i=>(i.payments||[]).forEach(p=>pays.push(sf({"سند القبض":p.rcv?.no||"","الفاتورة":dispNo(i),"العميل":i.customerName,"التاريخ":p.date,"المبلغ":p.amount,"الطريقة":p.method||"","المرجع":p.ref||"","معكوسة":p.reversed?"نعم":""}))));
    const docs=registerRows().map(r=>sf({"رقم المستند":r.no,"النوع":r.type,"التاريخ":String(r.at||"").slice(0,10),"الفاتورة":dispNo(r.inv),"العميل":r.inv.customerName}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(inv),"Invoices"); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lines),"Lines");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pays),"Payments"); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(docs),"Documents");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.customers.map(c=>sf({"#":c.serial,"العميل":c.name,"English":c.nameEn||"","العنوان":c.address||"","الهاتف":c.phone||"","ص.ب":c.pobox||""}))),"Customers");
    saveFile(`Alharam-All-${todayISO()}.xlsx`, new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})])); audit("تصدير Excel كامل",""); };
  const fi=$("#bk-file"); if(fi) fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ let d; try{ d=JSON.parse(rd.result); }catch(e){ toast("ملف غير صالح"); return; }
    if(d.app!=="alharam-invoices"){ toast("هذا الملف ليس نسخة احتياطية من النظام"); return; }
    const okId=id=>/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(String(id||""));
    confirmBox(`استعادة ${d.invoices?.length||0} فاتورة و ${d.customers?.length||0} عميل؟ السجلات بنفس المعرّف ستُستبدل. المستخدمون وكلمات المرور الحالية لا تتغير.`,"استعادة",async()=>{
      let n=0; for(const c of d.customers||[]){ const {id,...x}=c; if(okId(id)){ await Store.save("customers",id,x); n++; } }
      for(const i of d.invoices||[]){ const {id,...x}=i; if(okId(id)){ await Store.save("invoices",id,x); n++; } }
      if(d.settings&&S.isPlatformAdmin){ const st=deepMerge(S.settings,{...d.settings,users:S.settings.users}); await Store.saveSettings(st); }
      await audit("استعادة نسخة احتياطية", n+" سجل"); toast(`تمت استعادة ${n} سجل`); }); }; rd.readAsText(f); };
}

boot();
</script>
