<title>نظام فواتير الحرم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: right-hand rail (RTL) for the ledger sections, wide work area; documents render as true A4 paper sheets */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E3E8F0; --line:#CDD5E1;
  --ink:#141C33; --muted:#5B6680; --accent:#1F3C8F; --accent-ink:#FFFFFF; --accent-soft:#DDE4F6;
  --gold:#9C7629; --gold-soft:#F3E9D2;
  --ok:#1E7A4F; --ok-bg:#DCF0E4; --warn:#9A6200; --warn-bg:#FAEBC9; --bad:#B23A30; --bad-bg:#F7DEDA; --info:#3D4F7A; --info-bg:#E2E7F2;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-soft:#F1F1F1; --paper-gold:#9C7629;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-doc:"Tinos","Times New Roman",Times,serif;
  --f-doc-ar:"Noto Naskh Arabic","Traditional Arabic",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161D30; --sunk:#1D263C; --line:#2C3752;
  --ink:#E5E9F3; --muted:#9AA5BF; --accent:#8BA4F2; --accent-ink:#0B1330; --accent-soft:#25325A;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D30; --sunk:#1D263C; --line:#2C3752;
  --ink:#E5E9F3; --muted:#9AA5BF; --accent:#8BA4F2; --accent-ink:#0B1330; --accent-soft:#25325A;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding-block:18px;padding-inline:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:auto}
.brand b{font-family:var(--f-display);font-size:16px;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
main{min-width:0;padding-block:22px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mobile-nav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mobile-nav a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink);background:var(--sunk);font-size:13px}
  .mobile-nav a.on{background:var(--accent);color:var(--accent-ink)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
textarea.i{min-height:70px;resize:vertical;line-height:1.6}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr,textarea.ltr{direction:ltr;text-align:left}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:span 2} @media (max-width:520px){.span2{grid-column:auto}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .l,.kpi.lead .s,.kpi.lead .v small{color:var(--accent-ink);opacity:.85}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--sunk);text-align:start;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 10px;white-space:nowrap;position:sticky;top:0}
table.t td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:end;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--sunk)}
.ltr{direction:ltr;unicode-bidi:isolate}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.paid{background:var(--ok-bg);color:var(--ok)}
.chip.partial{background:var(--warn-bg);color:var(--warn)}
.chip.issued{background:var(--info-bg);color:var(--info)}
.chip.overdue{background:var(--bad-bg);color:var(--bad)}
.chip.draft{background:var(--sunk);color:var(--muted)}
.chip.cancelled{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.tag.pf{background:var(--accent-soft);color:var(--accent)}

/* tabs / filters */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;align-items:end}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:8px;align-items:center;font-size:12.5px;padding-block:5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent)}

/* editor lines */
table.lines{width:100%;border-collapse:collapse;min-width:680px}
table.lines th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:6px;background:var(--sunk);white-space:nowrap}
table.lines td{padding:4px;border-top:1px solid var(--line);vertical-align:top}
table.lines input{width:100%;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;min-width:0}
table.lines input:hover{border-color:var(--line)}
table.lines input:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.lines tr.head input.d{font-weight:700}
table.lines td.tot{padding:10px 8px;text-align:end;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;line-height:0}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn.on{color:var(--gold)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.totals{display:grid;grid-template-columns:auto 160px;gap:6px 16px;justify-content:end;align-items:center;margin-top:12px}
.totals .big{font-size:18px;font-weight:700}
.sticky-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;border-radius:0 0 var(--r) var(--r);z-index:5;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}

/* invoice detail */
.hero-inv{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero-inv .no{font-family:var(--f-display);font-size:24px;direction:ltr;unicode-bidi:isolate}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.doccard{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.doccard b{font-size:14px}
.doccard .hint{flex:1}
.doccard .row{display:flex;gap:6px;flex-wrap:wrap}

/* toast + modal */
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px;font-family:var(--f-display);font-size:16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);margin-bottom:14px;font-size:13px}
.banner.info{background:var(--info-bg);color:var(--info)}
.checkl{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.checkl label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.checkl label:hover{background:var(--sunk)}

/* ---------- paper documents ---------- */
.paper-wrap{overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px;background:var(--sunk);border-radius:var(--r)}
.paper-scale{transform-origin:top center}
.sheet{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:14.5px;line-height:1.45;direction:ltr;text-align:left;position:relative;padding:34px 46px 120px;box-shadow:0 2px 14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.sheet .ar{font-family:var(--f-doc-ar);direction:rtl}
.sheet table{border-collapse:collapse;width:100%;color:var(--paper-ink);font-family:inherit}
.sheet td,.sheet th{color:var(--paper-ink)}
.lh{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:center;gap:14px;border-bottom:2px solid var(--paper-gold);padding-bottom:10px}
.lh .en{font-size:13.5px;font-weight:700;line-height:1.35}
.lh .en span{display:block;font-weight:400;font-size:11.5px}
.lh .arh{font-family:var(--f-doc-ar);direction:rtl;text-align:right;font-size:14px;font-weight:700;line-height:1.5}
.lh .arh span{display:block;font-weight:400;font-size:11.5px}
.lh img{width:62px;justify-self:center}
.reg{font-family:var(--f-doc-ar);direction:rtl;font-size:11.5px;text-align:center;padding:5px 0;border-bottom:1px solid #bbb;color:#333}
.reg .ltr{font-family:var(--f-doc)}
.doc-title{text-align:center;margin:18px 0 14px}
.doc-title b{display:inline-block;font-size:23px;letter-spacing:3px;border-top:1.5px solid var(--paper-line);border-bottom:1.5px solid var(--paper-line);padding:3px 26px}
.doc-title.ar b{letter-spacing:0;font-family:var(--f-doc-ar)}
.meta-row{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin-top:12px}
.billto{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;border:1px solid var(--paper-line);padding:8px 12px;margin-bottom:12px;font-size:13.5px}
.billto b{white-space:nowrap}
.billto .v{min-width:0;overflow-wrap:anywhere}
table.items th{background:var(--paper-soft);border:1px solid var(--paper-line);padding:6px 6px;font-size:13px}
table.items td{border:1px solid var(--paper-line);padding:5px 7px;font-size:13.5px;vertical-align:top;white-space:pre-line}
table.items td.c{text-align:center}
table.items td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.items tr.h td{font-weight:700;text-decoration:underline;background:#fafafa}
table.items tr.sum td{font-weight:700}
.words{border:1px solid var(--paper-line);border-top:0;padding:6px 9px;font-size:13px;font-style:italic}
.bank{margin-top:14px;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 12px;width:max-content;max-width:100%}
.bank .ttl{grid-column:1/-1;font-weight:700;text-decoration:underline;margin-bottom:3px}
.signs{margin-top:auto;padding-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:center;font-size:13px;position:relative}
.signs>div>div:last-child{border-top:1px solid var(--paper-line);padding-top:5px}
.signs.two{grid-template-columns:1fr 1fr}
.signs.one{grid-template-columns:minmax(0,300px);justify-content:end}
.stampbox{position:relative;height:118px}
.stampbox img.stamp{position:absolute;width:118px;opacity:.88;bottom:0;left:50%;transform:translateX(-62%) rotate(-8deg)}
.stampbox img.sign{position:absolute;width:150px;bottom:20px;left:50%;transform:translateX(-35%)}
.foot-strip{position:absolute;left:30px;right:30px;bottom:24px}
.foot-strip img{width:100%;display:block}
.cert-meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;margin-top:16px;align-items:start}
table.kv td{border:1px solid var(--paper-line);padding:4px 8px;font-size:13px;vertical-align:top}
table.kv td:first-child{font-weight:700;background:var(--paper-soft);white-space:nowrap;width:1%}
.cert-body{font-size:15.5px;line-height:1.9;margin-top:10px;text-align:justify}
.cert-body p{margin:0 0 14px}
.cert-body ol{margin:4px 0 14px;padding-left:22px}
.cert-body h4{margin:12px 0 4px;font-size:15.5px;text-decoration:underline}
.letter{font-size:15px;line-height:1.85;margin-top:10px}
.letter p{margin:0 0 12px}
.letter ol{margin:0 0 12px;padding-left:24px}
.sheet.rtl .letter{direction:rtl;text-align:right;font-family:var(--f-doc-ar);font-size:15.5px}
.sheet.rtl .letter ol{padding-left:0;padding-right:24px}
.pagebreak{display:none}
.watermark{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:90px;color:rgba(178,58,48,.12);transform:rotate(-24deg);font-weight:700;pointer-events:none}

#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .sheet{box-shadow:none;page-break-after:always;break-after:page;height:1123px;overflow:hidden}
}
#render-root{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}

/* amount in words — English */
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function en3(n){ let s=""; const h=Math.floor(n/100), r=n%100; if(h) s+=ONES[h]+" Hundred"; if(r){ if(s) s+=" and "; s+= r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?"-"+ONES[r%10]:""); } return s; }
function enWords(n){ n=Math.floor(n); if(!n) return "Zero"; const sc=["","Thousand","Million","Billion"]; let parts=[],i=0; while(n>0){ const c=n%1000; if(c) parts.unshift(en3(c)+(sc[i]?" "+sc[i]:"")); n=Math.floor(n/1000); i++; } return parts.join(" "); }
function amountEn(x){ x=r2(x); const r=Math.floor(x), d=Math.round((x-r)*100); return "Qatari Riyals "+enWords(r)+(d?" and "+enWords(d)+" Dirhams":"")+" Only"; }
/* amount in words — Arabic */
const AONES=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];

function ar99(n){ if(n<20) return AONES[n]; const u=n%10,t=Math.floor(n/10); return u? AONES[u]+" و"+ATENS[t] : ATENS[t]; }
function ar3(n){ const h=Math.floor(n/100), r=n%100; return [AHUN[h], r?ar99(r):""].filter(Boolean).join(" و"); }
function arScale(n, one, two, plural){ if(n===1) return one; if(n===2) return two; if(n>=3&&n<=10) return ar3(n)+" "+plural; return ar3(n)+" "+one; }
function arWords(n){ n=Math.floor(n); if(!n) return "صفر"; const parts=[]; const b=Math.floor(n/1e9)%1000, m=Math.floor(n/1e6)%1000, t=Math.floor(n/1000)%1000, r=n%1000;

/* ---------------- invoice math & status ---------------- */
const blank = v => v===null || v===undefined || v==="";
function lineTotal(l){
  if(!l || l.heading) return 0;
  if(blank(l.qty) && blank(l.price)) return r2(Number(l.amount)||0);
  if(blank(l.qty)) return r2(Number(l.price)||0);           /* lump-sum line: price only */
  return r2((Number(l.qty)||0)*(Number(l.price)||0));
}
function dedAmount(d, sub){ return r2(!blank(d.pct) && Number(d.pct) ? sub*Number(d.pct)/100 : Number(d.amount)||0); }
function calc(inv){
  const sub = r2((inv.lines||[]).reduce((s,l)=> s + lineTotal(l),0));
  const ded = r2((inv.deductions||[]).reduce((s,d)=> s + dedAmount(d,sub),0));
  const total = r2(sub - ded - (Number(inv.discount)||0));
  const paid = r2((inv.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0));
  return {sub,ded,total,paid,balance:r2(total-paid)};
}
function statusOf(inv){
  if(inv.status==="cancelled") return "cancelled";
  if(inv.status==="draft") return "draft";
  const c = calc(inv);
  if(c.total>0 && c.paid>=c.total-0.004) return "paid";
  if(inv.kind==="invoice" && inv.dueDate && inv.dueDate < todayISO()) return c.paid>0?"partial":"overdue";
  if(c.paid>0) return "partial";
  return "issued";
}
const inAccounts = inv => inv.kind==="invoice" && inv.status!=="cancelled" && inv.status!=="draft";

/* numbering: ALH-YY-MMNN for invoices (sequence restarts monthly, as in the Excel book);
   PF-YY-NNN and SP-YY-NNN for proforma and special series (yearly) */
function nextNo(kind, dateISO){
  const N=S.settings.numbering, yy=(dateISO||todayISO()).slice(2,4), mm=(dateISO||todayISO()).slice(5,7);
  if(kind==="invoice"){
    const pre=`${N.invoice}-${yy}-${mm}`; let max=0;
    for(const i of S.invoices){ const m=String(i.no||"").match(new RegExp("^"+pre.replace(/[-]/g,"\\-")+"(\\d{2,3})$")); if(m) max=Math.max(max,+m[1]); }
    return pre+String(max+1).padStart(2,"0");
  }
  const p = kind==="proforma"?N.proforma:N.special, pre=`${p}-${yy}-`; let max=0;
  for(const i of S.invoices){ const m=String(i.no||"").match(new RegExp("^"+pre.replace(/[-]/g,"\\-")+"(\\d+)$")); if(m) max=Math.max(max,+m[1]); }
  return pre+String(max+1).padStart(3,"0");
}

/* ---------------- storage layer ---------------- */
const LS_KEY="alharam-invoices-v1";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null") || {invoices:{},customers:{},settings:null}; }catch(e){ return {invoices:{},customers:{},settings:null}; } }
function lsWrite(d){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); return true; }catch(e){ toast("تعذر الحفظ في المتصفح: "+e.message); return false; } }

const Store = {
  async save(col, id, data){
    if(S.mode==="cloud"){ await withRetry(()=>DB.collection(col).doc(id).set(data)); }
    else { const d=lsRead(); d[col]=d[col]||{}; d[col][id]=data; if(!lsWrite(d)) throw new Error("local"); localLoad(); }
  },
  async remove(col, id){
    if(S.mode==="cloud"){ await withRetry(()=>DB.collection(col).doc(id).delete()); }
    else { const d=lsRead(); if(d[col]) delete d[col][id]; lsWrite(d); localLoad(); }
  },
  async exists(col, id){
    if(S.mode==="cloud"){ const s=await DB.collection(col).doc(id).get(); return s.exists; }
    return !!(lsRead()[col]||{})[id];
  },
  async saveSettings(st){
    if(S.mode==="cloud"){ await withRetry(()=>DB.doc("settings/main").set(st)); }
    else { const d=lsRead(); d.settings=st; lsWrite(d); localLoad(); }
  }
};
async function withRetry(fn){
  try{ return await fn(); }
  catch(e){
    if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return await fn(); }
    if(e && e.code==="invalid_argument" && S.mode==="cloud"){ S.canWrite=false; render(); }
    if(e && e.code==="quota_exceeded") toast("امتلأت سعة قاعدة البيانات. صدّر نسخة احتياطية واحذف المسودات القديمة.");
    throw e;
  }
}
function localLoad(){
  const d=lsRead();
  S.invoices=Object.entries(d.invoices||{}).map(([id,v])=>({...v,id}));
  S.customers=Object.entries(d.customers||{}).map(([id,v])=>({...v,id}));
  S.settings=deepMerge(DEFAULT_SETTINGS, d.settings||{});
  S.loaded={inv:true,cus:true,set:true};
  sortData(); render();
}
function sortData(){
  S.invoices.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || String(b.no).localeCompare(String(a.no)));
  S.customers.sort((a,b)=> (a.name||"").localeCompare(b.name||"","ar"));
}

async function boot(){
  render();
  let cloud=null;
  try{ if(window.claude && typeof window.claude.use==="function"){ cloud = await window.claude.use("db"); } }catch(e){ cloud=null; }
  if(cloud){
    DB=cloud; S.mode="cloud";
    try{ USER = await window.claude.use("user"); }catch(e){ USER=null; }
    try{ DL = await window.claude.use("downloads"); }catch(e){ DL=null; }
    if(USER){
      try{ S.uid = await USER.id(); }catch(e){}
      try{ const w=await USER.can("data.write"); S.canWrite = w!==false; }catch(e){}
      try{ S.isAdmin = await USER.canEdit(); }catch(e){}
    }
    subscribe();
  } else {
    S.mode="local"; localLoad();
  }
  render();
}
function subscribe(){
  const timer=setTimeout(()=>{ S.stale=true; render(); },10000);
  const done=()=>{ if(S.loaded.inv&&S.loaded.cus){ clearTimeout(timer); S.stale=false; } };
  DB.collection("invoices").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
    S.invoices = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.inv=true; done(); sortData(); renderSoon();
  }, err=>{ S.loaded.inv=true; S.stale=true; clearTimeout(timer); toast("تعذر قراءة الفواتير ("+err.code+")"); render(); });
  DB.collection("customers").onSnapshot(snap=>{
    S.customers = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.cus=true; done(); sortData(); renderSoon();
  }, err=>{ S.loaded.cus=true; S.stale=true; clearTimeout(timer); render(); });
  DB.doc("settings/main").onSnapshot(snap=>{
    S.settings = deepMerge(DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    S.loaded.set=true; renderSoon();
  }, ()=>{ S.loaded.set=true; });
}
let _rs=null;
function renderSoon(){ if(_rs) return; _rs=requestAnimationFrame(()=>{ _rs=null; if(isEditing()) { refreshChrome(); return; } render(); }); }
function isEditing(){ return ["new","edit","customer","settings"].includes(S.route.name) && !!$("#editor-form"); }

/* ---------------- routing ---------------- */
function parseHash(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const routes=["dashboard","invoices","new","new-special","new-proforma","reports","customers","settings","special"];
  if(!h) return {name:"dashboard",arg:""};
  if(routes.includes(h)) return {name:h.startsWith("new")?"new":h, arg:h.startsWith("new-")?h.slice(4):""};
  const m=h.match(/^(inv|edit|doc-invoice|doc-completion|doc-warranty|doc-cover|doc-pack|customer|statement)-(.+)$/);
  if(m) return {name:m[1],arg:m[2]};
  return {name:"dashboard",arg:""};
}
function go(h){ if(location.hash==="#"+h) { S.route=parseHash(); render(); } else location.hash=h; window.scrollTo(0,0); }
window.addEventListener("hashchange",()=>{ S.route=parseHash(); S.selected.clear(); render(); window.scrollTo(0,0); });

/* ---------------- toast & modal ---------------- */
let _tt=null;
function toast(msg){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; clearTimeout(_tt); _tt=setTimeout(()=>t.remove(),3200); }
function modal(html, onMount){
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  $$("[data-close]",bg).forEach(b=>b.onclick=close);
  onMount && onMount(bg, close);
  const f=$("input,select,textarea,button",bg); f && f.focus();
  return close;
}
function confirmBox(msg, okLabel, fn, danger){
  modal(`<h3>تأكيد</h3><p>${esc(msg)}</p><div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn ${danger?"danger":"primary"}" id="cb-ok">${esc(okLabel)}</button></div>`,(bg,close)=>{ $("#cb-ok",bg).onclick=async()=>{ close(); await fn(); }; });
}

/* ---------------- shell ---------------- */
const NAV=[
  ["dashboard","لوحة التحكم",IC.dash],["invoices","الفواتير",IC.inv],["new","فاتورة جديدة",IC.plus],
  ["special","الفواتير المجمعة",IC.stack],["reports","التقارير",IC.rep],["customers","العملاء",IC.users],["settings","الإعدادات",IC.gear]
];
function navActive(n){ const r=S.route.name; if(n==="invoices") return ["invoices","inv","edit"].includes(r)||r.startsWith("doc"); if(n==="customers") return ["customers","customer","statement"].includes(r); return r===n; }
function shell(content){
  const conn = S.mode==="cloud" ? (S.stale?'<span class="conn"><i class="dot warn"></i>البيانات قد لا تكون محدّثة</span>':'<span class="conn"><i class="dot ok"></i>متصل بقاعدة البيانات السحابية</span>')
    : S.mode==="local" ? '<span class="conn"><i class="dot warn"></i>وضع محلي — الحفظ في هذا المتصفح</span>' : '<span class="conn"><i class="dot"></i>جارٍ الاتصال…</span>';
  return `<div class="shell">
  <aside class="rail">
    <div class="brand"><img src="${IMG.logo}" alt=""><div><b>الحرم</b><small>نظام الفواتير والمستندات</small></div></div>
    <nav class="nav" aria-label="الأقسام">${NAV.map(([h,l,ic],i)=>(i===5?'<div class="sep"></div>':'')+`<a href="#${h}" class="${navActive(h)?"on":""}">${ic}<span>${l}</span></a>`).join("")}</nav>
    <div class="rail-foot">${conn}${!S.canWrite?'<span>صلاحية عرض فقط</span>':''}</div>
  </aside>
  <div style="min-width:0">
    <nav class="mobile-nav" aria-label="الأقسام">${NAV.map(([h,l])=>`<a href="#${h}" class="${navActive(h)?"on":""}">${l}</a>`).join("")}</nav>
    <main id="main">${S.mode==="local"?'<div class="banner info">هذه النسخة تعمل بدون قاعدة بيانات سحابية — تُحفظ البيانات في هذا المتصفح فقط. خذ نسخة احتياطية دورياً من الإعدادات.</div>':''}${content}</main>
  </div></div>`;
}
function refreshChrome(){ /* keep editor intact; only update connection label */ const f=$(".rail-foot"); if(f){ const tmp=document.createElement("div"); tmp.innerHTML=shell(""); const nf=$(".rail-foot",tmp); if(nf) f.innerHTML=nf.innerHTML; } }

function render(){
  S.route = S.route || parseHash();
  const r=S.route.name; let html="";
  try{
    if(r==="dashboard") html=viewDashboard();
    else if(r==="invoices") html=viewInvoices(false);
    else if(r==="special") html=viewInvoices(true);
    else if(r==="new") html=viewEditor(null, S.route.arg||"invoice");
    else if(r==="edit") html=viewEditor(S.route.arg);
    else if(r==="inv") html=viewInvoice(S.route.arg);
    else if(r.startsWith("doc-")) html=viewDoc(r.slice(4), S.route.arg);
    else if(r==="reports") html=viewReports();
    else if(r==="customers") html=viewCustomers();
    else if(r==="customer") html=viewCustomerEdit(S.route.arg);
    else if(r==="statement") html=viewStatement(S.route.arg);
    else if(r==="settings") html=viewSettings();
  }catch(e){ console.error(e); html=`<div class="banner">حدث خطأ أثناء العرض: ${esc(e.message)}</div>`; }
  $("#app").innerHTML = shell(html);
  bind();
}

/* ---------------- dashboard ---------------- */
function years(){ const s=new Set(S.invoices.map(i=>+(i.date||"").slice(0,4)).filter(Boolean)); s.add(new Date().getFullYear()); return [...s].sort((a,b)=>b-a); }
function viewDashboard(){
  if(!S.loaded.inv && S.mode==="cloud") return `<div class="top"><div><h1>لوحة التحكم</h1><p>جارٍ تحميل الفواتير من قاعدة البيانات…</p></div></div><div class="kpis">${'<div class="kpi"><div class="l">…</div><div class="v">—</div></div>'.repeat(4)}</div>`;
  const Y=S.year, yr=S.invoices.filter(i=>(i.date||"").startsWith(String(Y)));
  const acc=yr.filter(inAccounts), all=S.invoices.filter(inAccounts);
  const invoiced=r2(acc.reduce((s,i)=>s+calc(i).total,0));
  const collected=r2(acc.reduce((s,i)=>s+Math.min(calc(i).paid,calc(i).total),0));
  const outAll=all.map(i=>({i,c:calc(i),st:statusOf(i)})).filter(x=>x.c.balance>0.004);
  const outstanding=r2(outAll.reduce((s,x)=>s+x.c.balance,0));
  const overdue=outAll.filter(x=>x.st==="overdue"||(x.st==="partial"&&x.i.dueDate<todayISO()));
  const overdueAmt=r2(overdue.reduce((s,x)=>s+x.c.balance,0));
  const sp=yr.filter(i=>i.kind==="special"&&i.status!=="cancelled"), spAmt=r2(sp.reduce((s,i)=>s+calc(i).total,0));
  const pf=yr.filter(i=>i.kind==="proforma"&&i.status!=="cancelled");
  const pct = invoiced? Math.round(collected/invoiced*100):0;
  // monthly
  const mi=Array(12).fill(0), mc=Array(12).fill(0);
  acc.forEach(i=>{ const m=+i.date.slice(5,7)-1; mi[m]+=calc(i).total; });
  S.invoices.filter(inAccounts).forEach(i=>(i.payments||[]).forEach(p=>{ if((p.date||"").startsWith(String(Y))) mc[+p.date.slice(5,7)-1]+=Number(p.amount)||0; }));
  // customers
  const byC={}; acc.forEach(i=>{ const k=i.customerName||"—"; byC[k]=(byC[k]||0)+calc(i).total; });
  const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,8), topMax=top[0]?.[1]||1;
  // aging
  const ag=[0,0,0,0]; outAll.forEach(x=>{ const d=daysBetween(x.i.date,todayISO()); ag[d<=30?0:d<=60?1:d<=90?2:3]+=x.c.balance; });
  const recent=S.invoices.slice(0,8);
  return `<div class="top"><div><h1>لوحة التحكم</h1><p>ملخص الفواتير والتحصيل لسنة ${Y}</p></div>
    <div class="actions"><select class="i" id="dash-year" aria-label="السنة" style="width:auto">${years().map(y=>`<option ${y===Y?"selected":""}>${y}</option>`).join("")}</select>
    ${S.canWrite?`<a class="btn primary" href="#new">${IC.plus}فاتورة جديدة</a>`:""}</div></div>
  <div class="stack">
  <div class="kpis">
    <div class="kpi lead"><div class="l">إجمالي الفواتير ${Y}</div><div class="v">${fmt(invoiced)} <small>ر.ق</small></div><div class="s">${acc.length} فاتورة في الحسابات العامة</div></div>
    <div class="kpi"><div class="l">المحصّل من فواتير ${Y}</div><div class="v">${fmt(collected)} <small>ر.ق</small></div><div class="meter"><i style="width:${pct}%"></i></div><div class="s">نسبة التحصيل ${pct}%</div></div>
    <div class="kpi"><div class="l">الرصيد المستحق (كل السنوات)</div><div class="v">${fmt(outstanding)} <small>ر.ق</small></div><div class="s">${outAll.length} فاتورة مفتوحة</div></div>
    <div class="kpi"><div class="l">متأخرات بعد تاريخ الاستحقاق</div><div class="v" style="color:${overdueAmt?"var(--bad)":"inherit"}">${fmt(overdueAmt)} <small>ر.ق</small></div><div class="s">${overdue.length} فاتورة متأخرة</div></div>
  </div>
  <div class="cols">
    <div class="panel"><h2>الفواتير والتحصيل شهرياً <small>${Y}</small></h2>${monthChart(mi,mc)}
      <div class="legend"><span><i style="background:var(--accent)"></i>قيمة الفواتير</span><span><i style="background:var(--ok)"></i>المحصّل</span></div></div>
    <div class="panel"><h2>أعمار الديون <small>الرصيد المفتوح</small></h2>
      ${[["حتى 30 يوماً",ag[0]],["31 – 60 يوماً",ag[1]],["61 – 90 يوماً",ag[2]],["أكثر من 90 يوماً",ag[3]]].map(([l,v],k)=>`<div class="hbar"><span class="nm">${l}</span><span class="bar"><i style="width:${outstanding?v/outstanding*100:0}%;background:${k===3?"var(--bad)":k===2?"var(--warn)":"var(--accent)"}"></i></span><span class="num">${fmt0(v)}</span></div>`).join("")}
      <div class="hint" style="margin-top:10px">الفواتير المجمعة (${sp.length}) بقيمة ${fmt0(spAmt)} ر.ق والمبدئية (${pf.length}) خارج الحسابات العامة.</div>
    </div>
  </div>
  <div class="cols">
    <div class="panel"><h2>أحدث الفواتير <a class="btn sm" href="#invoices">عرض الكل</a></h2>${invTable(recent,{compact:true})}</div>
    <div class="panel"><h2>أكبر العملاء <small>${Y}</small></h2>
      ${top.length?top.map(([n,v])=>`<div class="hbar"><span class="nm" title="${esc(n)}" dir="auto">${esc(n)}</span><span class="bar"><i style="width:${v/topMax*100}%"></i></span><span class="num">${fmt0(v)}</span></div>`).join(""):'<div class="empty">لا توجد فواتير في هذه السنة</div>'}
    </div>
  </div>
  </div>`;
}
function monthChart(a,b){
  const W=640,H=230,pl=48,pb=26,pt=10,pr=8, max=Math.max(1,...a,...b);
  const step=niceStep(max), top=Math.ceil(max/step)*step, ih=H-pb-pt, gw=(W-pl-pr)/12, bw=Math.min(16,gw/3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني شهري">`;
  for(let v=0; v<=top+0.001; v+=step){ const y=pt+ih-(v/top)*ih; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v>=1000?fmt0(v/1000)+"k":fmt0(v)}</text>`; }
  for(let m=0;m<12;m++){ const x=pl+gw*m+gw/2; const h1=a[m]/top*ih, h2=b[m]/top*ih;
    s+=`<rect x="${x-bw-1}" y="${pt+ih-h1}" width="${bw}" height="${Math.max(0,h1)}" rx="2" fill="var(--accent)"><title>${MONTHS_AR[m]}: ${fmt(a[m])}</title></rect>`;
    s+=`<rect x="${x+1}" y="${pt+ih-h2}" width="${bw}" height="${Math.max(0,h2)}" rx="2" fill="var(--ok)"><title>${MONTHS_AR[m]} محصّل: ${fmt(b[m])}</title></rect>`;
    s+=`<text x="${x}" y="${H-8}" text-anchor="middle">${m+1}</text>`; }
  return `<div class="chart">${s}</svg></div>`;
}
function niceStep(max){ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

/* ---------------- invoices list ---------------- */
function filteredInvoices(special){
  const q=S.listQ.trim().toLowerCase();
  return S.invoices.filter(i=>{
    if(special ? i.kind!=="special" : false) return false;
    if(!special){ if(S.listTab==="invoice"&&i.kind!=="invoice") return false; if(S.listTab==="proforma"&&i.kind!=="proforma") return false; if(S.listTab==="special"&&i.kind!=="special") return false; }
    const st=statusOf(i);
    if(S.listStatus==="open" ? !["issued","partial","overdue"].includes(st) : S.listStatus && st!==S.listStatus) return false;
    if(S.listCustomer && i.customerId!==S.listCustomer) return false;
    if(S.listFrom && i.date<S.listFrom) return false;
    if(S.listTo && i.date>S.listTo) return false;
    if(q){ const hay=[i.no,i.customerName,i.site,i.location,i.typeOfWorks,i.workOrder,i.ref,...(i.lines||[]).map(l=>l.desc)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function invTable(list,opt={}){
  if(!list.length) return `<div class="empty"><b>لا توجد فواتير مطابقة</b>${S.canWrite&&!opt.compact?'ابدأ بإنشاء فاتورة جديدة من الزر بالأعلى.':''}</div>`;
  const sel=opt.select;
  const tot=list.reduce((s,i)=>{const c=calc(i); s.t+=c.total; s.p+=c.paid; s.b+=c.balance; return s;},{t:0,p:0,b:0});
  return `<div class="tw"><table class="t"><thead><tr>${sel?'<th><input type="checkbox" id="sel-all" aria-label="تحديد الكل"></th>':''}<th>رقم الفاتورة</th><th>التاريخ</th><th>العميل</th>${opt.compact?'':'<th>الموقع / الأعمال</th>'}<th class="n">القيمة</th>${opt.compact?'':'<th class="n">المدفوع</th><th class="n">الرصيد</th>'}<th>الحالة</th></tr></thead><tbody>
  ${list.map(i=>{const c=calc(i),st=statusOf(i); return `<tr class="click" data-open="${esc(i.id)}">${sel?`<td><input type="checkbox" class="sel" value="${esc(i.id)}" ${S.selected.has(i.id)?"checked":""} aria-label="تحديد"></td>`:''}<td><span class="code">${esc(i.no)}</span> ${kindTag(i.kind)}</td><td class="num">${dmy(i.date)}</td><td><bdi>${esc(i.customerName||"—")}</bdi></td>${opt.compact?'':`<td class="muted">${esc([i.site,i.typeOfWorks].filter(Boolean).join(" — ")||(i.lines||[]).find(l=>l.desc)?.desc||"")}</td>`}<td class="n">${fmt(c.total)}</td>${opt.compact?'':`<td class="n">${fmt(c.paid)}</td><td class="n">${fmt(c.balance)}</td>`}<td>${chip(st)}</td></tr>`;}).join("")}
  </tbody>${opt.compact?'':`<tfoot><tr>${sel?'<td></td>':''}<td colspan="4">الإجمالي (${list.length})</td><td class="n">${fmt(tot.t)}</td><td class="n">${fmt(tot.p)}</td><td class="n">${fmt(tot.b)}</td><td></td></tr></tfoot>`}</table></div>`;
}
function viewInvoices(special){
  const list=filteredInvoices(special);
  const tabs=[["all","الكل"],["invoice","فواتير ضريبية / عادية"],["proforma","مبدئية"],["special","مجمعة / مخصصة"]];
  return `<div class="top"><div><h1>${special?"الفواتير المجمعة والمخصصة":"الفواتير"}</h1><p>${special?"تسلسل مستقل خاص بتحويلات العملاء عن عدة فواتير — لا تدخل في الحسابات العامة.":"سجل كل الفواتير مع البحث والتصفية والطباعة."}</p></div>
  <div class="actions">${S.canWrite?(special?`<a class="btn gold" href="#new-special">${IC.plus}فاتورة مجمعة جديدة</a>`:`<a class="btn" href="#new-proforma">${IC.plus}فاتورة مبدئية</a><a class="btn primary" href="#new">${IC.plus}فاتورة جديدة</a>`):""}
  <button class="btn" id="exp-list">${IC.xls}تصدير Excel</button></div></div>
  ${special?'':`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" class="${S.listTab===k?"on":""}">${l}</button>`).join("")}</div>`}
  <div class="filters">
    <label class="f">بحث<input class="i" id="f-q" value="${esc(S.listQ)}" placeholder="رقم، عميل، مدرسة، بند…"></label>
    <label class="f">الحالة<select class="i" id="f-st"><option value="">الكل</option><option value="open" ${S.listStatus==="open"?"selected":""}>كل المفتوحة</option>${["issued","partial","overdue","paid","draft","cancelled"].map(k=>`<option value="${k}" ${S.listStatus===k?"selected":""}>${STATUS_AR[k]}</option>`).join("")}</select></label>
    <label class="f">العميل<select class="i" id="f-cu"><option value="">الكل</option>${S.customers.map(c=>`<option value="${esc(c.id)}" ${S.listCustomer===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
    <label class="f">من تاريخ<input type="date" class="i" id="f-from" value="${S.listFrom}"></label>
    <label class="f">إلى تاريخ<input type="date" class="i" id="f-to" value="${S.listTo}"></label>
  </div>
  ${S.canWrite?`<div class="actions" style="margin-bottom:10px" id="bulk" ${S.selected.size?"":"hidden"}><span class="muted">${S.selected.size} محددة:</span><button class="btn sm" data-bulk="paid">تسجيل كمدفوعة بالكامل</button><button class="btn sm" data-bulk="pack">تنزيل المستندات PDF</button><button class="btn sm" data-bulk="clear">إلغاء التحديد</button></div>`:''}
  ${invTable(list,{select:S.canWrite})}`;
}

/* ---------------- editor ---------------- */
let ED=null;

  const d=todayISO();
  return {kind, no:nextNo(kind,d), date:d, dueDate:kind==="invoice"?addDays(d,S.settings.terms):"", customerId:"", customerName:"", customerNameEn:"", customerAddress:"", customerPhone:"", customerPobox:"",
    ref:"", workOrder:"", location:"", site:"", typeOfWorks:"", completedDate:d, warranty:"1 Year", notes:"", worksList:"",
    lines:[{desc:"",unit:"",qty:"",price:""}], deductions:[], discount:0, payments:[], linked:[], status:"issued"};
}

function linesRows(){
  return ED.lines.map((l,k)=>`<tr class="${l.heading?"head":""}" data-k="${k}"><td class="muted" style="padding-top:12px">${l.heading?"—":k+1}</td>
   <td><input class="d" data-f="desc" value="${esc(l.desc)}" aria-label="الوصف"></td>
   ${l.heading?'<td colspan="4" class="muted" style="padding-top:12px;font-size:12px">عنوان قسم</td>':`<td><input data-f="unit" value="${esc(l.unit||"")}" aria-label="الوحدة"></td><td><input class="ltr" data-f="qty" value="${esc(l.qty??"")}" inputmode="decimal" aria-label="الكمية"></td><td><input class="ltr" data-f="price" value="${esc(l.price??"")}" inputmode="decimal" aria-label="السعر"></td><td class="tot" data-tot>${fmt(lineTotal(l))}</td>`}
   <td style="white-space:nowrap"><button type="button" class="iconbtn" data-act="up" title="أعلى">${IC.up}</button><button type="button" class="iconbtn" data-act="down" title="أسفل">${IC.down}</button><button type="button" class="iconbtn ${l.heading?"on":""}" data-act="head" title="تحويل لعنوان">${IC.h}</button><button type="button" class="iconbtn" data-act="del" title="حذف">${IC.trash}</button></td></tr>`).join("");
}
function dedRows(){
  const sub=calc(ED).sub;
  if(!(ED.deductions||[]).length) return '<p class="hint">لا توجد استقطاعات.</p>';
  return `<div class="tw" style="border:0"><table class="lines"><thead><tr><th>البيان (يطبع)</th><th style="width:90px">نسبة %</th><th style="width:130px">أو مبلغ</th><th style="width:120px;text-align:end">القيمة</th><th style="width:40px"></th></tr></thead><tbody>${ED.deductions.map((d,k)=>`<tr data-dk="${k}"><td><input class="ltr" data-df="label" value="${esc(d.label)}" aria-label="البيان"></td><td><input class="ltr" data-df="pct" value="${esc(d.pct??"")}" inputmode="decimal" aria-label="النسبة"></td><td><input class="ltr" data-df="amount" value="${esc(blank(d.pct)?d.amount??"":"")}" inputmode="decimal" aria-label="المبلغ" ${!blank(d.pct)?"disabled":""}></td><td class="tot" data-dtot>${fmt(dedAmount(d,sub))}</td><td><button type="button" class="iconbtn" data-ddel="${k}" title="حذف">${IC.trash}</button></td></tr>`).join("")}</tbody></table></div>`;
}
function linkedBox(){
  if(!ED.customerId) return '<p class="hint">اختر العميل أولاً لعرض فواتيره.</p>';
  const list=S.invoices.filter(i=>i.kind==="invoice"&&i.customerId===ED.customerId&&i.status!=="cancelled");
  if(!list.length) return '<p class="hint">لا توجد فواتير لهذا العميل.</p>';
  const ids=new Set((ED.linked||[]).map(x=>x.id));
  return `<div class="checkl">${list.map(i=>{const c=calc(i);return `<label><input type="checkbox" class="lk" value="${esc(i.id)}" ${ids.has(i.id)?"checked":""}><span class="code">${esc(i.no)}</span><span class="muted">${dmy(i.date)}</span><span style="margin-inline-start:auto" class="num">${fmt(c.total)}</span>${chip(statusOf(i))}</label>`;}).join("")}</div>
  <div class="actions" style="margin-top:8px"><button type="button" class="btn sm" id="lk-fill">إدراج الفواتير المحددة كبنود</button><span class="hint">${ids.size} محددة</span></div>`;
}
function readEditor(){
  const v=id=>{const el=$("#"+id); return el?el.value:"";};
  Object.assign(ED,{no:v("e-no").trim(), date:v("e-date"), dueDate:v("e-due"), status:v("e-status"), typeOfWorks:v("e-tow").trim(), ref:v("e-ref").trim(), workOrder:v("e-wo").trim(),
    location:v("e-loc").trim(), site:v("e-site").trim(), completedDate:v("e-comp"), warranty:v("e-war").trim(), worksList:v("e-wl").trim(), notes:v("e-notes"), discount:r2(v("e-disc").replace(/,/g,""))});
  if(!$("#e-kind").disabled) ED.kind=$("#e-kind").value;
}
function updateTotals(){
  const c=calc(ED); const a=$("#t-sub"), b=$("#t-tot"), w=$("#t-words");
  if(a) a.textContent=fmt(c.sub); if(b) b.textContent=fmt(c.total); const dd=$("#t-ded"); if(dd) dd.textContent=fmt(c.ded);
  $$("#ded-box tr[data-dk]").forEach(tr=>{ const d=ED.deductions[+tr.dataset.dk]; const td=tr.querySelector("[data-dtot]"); if(d&&td) td.textContent=fmt(dedAmount(d,c.sub)); }); if(w) w.textContent=amountAr(c.total);
}
function applyCustomer(id){
  const c=custById(id); ED.customerId=id||"";
  ED.customerName=c?.name||""; ED.customerNameEn=c?.nameEn||""; ED.customerAddress=c?.address||""; ED.customerPhone=c?.phone||""; ED.customerPobox=c?.pobox||"";
  const s=$("#cust-snap"); if(s) s.textContent = c?`سيُطبع: ${c.nameEn||c.name} — ${c.address||""} ${c.phone?"— "+c.phone:""}`:"";
  const lb=$("#linked-box"); if(lb){ ED.linked=[]; lb.innerHTML=linkedBox(); }
}
async function saveEditor(andNew){
  readEditor();
  if(!ED.no){ toast("أدخل رقم الفاتورة"); $("#e-no").focus(); return; }
  if(!ED.date){ toast("أدخل التاريخ"); return; }
  if(!ED.customerId){ toast("اختر العميل"); $("#e-cust").focus(); return; }
  ED.lines=ED.lines.filter(l=>String(l.desc||"").trim()||Number(l.qty)||Number(l.price));
  if(ED.lines.some(l=>!l.heading&&[l.qty,l.price].some(v=>!blank(v)&&isNaN(Number(v))))){ toast("تحقق من الكميات والأسعار — يجب أن تكون أرقاماً"); return; }
  if(!ED.lines.length){ toast("أضف بنداً واحداً على الأقل"); ED.lines=[{desc:"",unit:"",qty:"",price:""}]; $("#lines-body").innerHTML=linesRows(); return; }
  const dup=S.invoices.find(i=>i.no===ED.no && i.id!==ED._id);
  if(dup){ toast("رقم الفاتورة مستخدم مسبقاً: "+ED.no); $("#e-no").focus(); return; }
  const btn=$("#save-btn"); btn.disabled=true; $("#save-hint").textContent="جارٍ الحفظ…";
  try{
    const c=calc(ED); const isNew=!ED._id;
    let id=ED._id || slug(ED.no) || uid("inv");
    if(isNew && await Store.exists("invoices", id)){ toast("هذا الرقم محفوظ من جهاز آخر — تم اقتراح رقم جديد"); ED.no=nextNo(ED.kind,ED.date); $("#e-no").value=ED.no; btn.disabled=false; $("#save-hint").textContent="لم تحفظ بعد"; return; }
    const now=new Date().toISOString();
    const data={...ED}; delete data._id; delete data._orig; delete data._kind; delete data.id;
    data.lines=ED.lines.map(l=>l.heading?{desc:String(l.desc||""),heading:true}:{desc:String(l.desc||""),unit:String(l.unit||""),qty:blank(l.qty)?null:Number(l.qty),price:blank(l.price)?null:Number(l.price)});
    data.deductions=(ED.deductions||[]).filter(d=>String(d.label||"").trim()||Number(d.pct)||Number(d.amount)).map(d=>({label:String(d.label||""),pct:blank(d.pct)?null:Number(d.pct),amount:dedAmount(d,c.sub)}));
    Object.assign(data,{subtotal:c.sub,total:c.total,paid:c.paid,balance:c.balance,year:+ED.date.slice(0,4),updatedAt:now,updatedBy:S.uid||"",excluded:ED.kind!=="invoice"});
    if(isNew){ data.createdAt=now; data.createdBy=S.uid||""; }
    data.history=[...(ED.history||[]),{at:now,by:S.uid||"",action:isNew?"إنشاء":"تعديل"}].slice(-30);
    await Store.save("invoices", id, data);
    toast(isNew?"تم حفظ الفاتورة "+ED.no:"تم حفظ التعديلات");
    const k=ED.kind; ED=null;
    if(andNew){ go(k==="invoice"?"new":"new-"+k); render(); }
    else go("inv-"+id);
  }catch(e){ console.error(e); toast("تعذر الحفظ: "+(e.message||e.code||e)); btn.disabled=false; $("#save-hint").textContent="لم تحفظ"; }
}

async function patchInvoice(id, patch, action){
  const i=invById(id); if(!i) return;
  const data={...i, ...patch}; delete data.id;
  const c=calc(data); const now=new Date().toISOString();
  Object.assign(data,{paid:c.paid,balance:c.balance,total:c.total,subtotal:c.sub,updatedAt:now,history:[...(i.history||[]),{at:now,by:S.uid||"",action}].slice(-30)});
  await Store.save("invoices", id, data);
}

async function saveFile(filename, data){
  if(DL){ try{ await DL.save({filename, data}); toast("تم التنزيل: "+filename); return true; }catch(e){ if(e.code==="declined") return false; toast("تعذر التنزيل ("+e.code+")"); return false; } }
  try{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); return true; }
  catch(e){ toast("تعذر التنزيل في هذا العرض"); return false; }
}
async function makePdf(html, filename){
  if(!window.html2canvas || !window.jspdf){ toast("مكتبات PDF لم تُحمّل بعد — أعد المحاولة بعد لحظات"); return; }
  toast("جارٍ تجهيز ملف PDF…");
  const root=$("#render-root"); root.innerHTML=html;
  try{ await document.fonts.ready; }catch(e){}
  await Promise.all($$("img",root).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  const sheets=$$(".sheet",root); let first=true;
  for(const sh of sheets){
    const canvas=await html2canvas(sh,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
    const pageHpx=canvas.width*297/210;
    for(let y=0; y<canvas.height-4; y+=pageHpx){
      const h=Math.min(pageHpx, canvas.height-y);
      const part=document.createElement("canvas"); part.width=canvas.width; part.height=h;
      part.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first) pdf.addPage(); first=false;
      pdf.addImage(part.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,h*210/canvas.width);
    }
  }
  root.innerHTML="";
  await saveFile(filename, pdf.output("blob"));
}

  L.forEach(i=>{const k=key(i),c=calc(i); G[k]=G[k]||{n:0,t:0,p:0,b:0}; G[k].n++; G[k].t+=c.total; G[k].p+=c.paid; G[k].b+=c.balance;});

  const tot=ent.reduce((s,[,v])=>({n:s.n+v.n,t:s.t+v.t,p:s.p+v.p,b:s.b+v.b}),{n:0,t:0,p:0,b:0});
  const rows=ent.map(([k,v])=>[R.group==="month"?MONTHS_AR[+k.slice(5)-1]+" "+k.slice(0,4):k, v.n, r2(v.t), r2(v.p), r2(v.b), tot.t?Math.round(v.t/tot.t*1000)/10+"%":"0%"]);
  return tableHTML({title:"ملخص مجمّع",head:["البند","عدد الفواتير","القيمة","المدفوع","الرصيد","النسبة"],num:{2:1,3:1,4:1},rows,foot:rows.length?["الإجمالي",tot.n,r2(tot.t),r2(tot.p),r2(tot.b),"100%"]:null});
}
function repAging(){
  const t=S.rep.to||todayISO();
  const L=S.invoices.filter(inAccounts).filter(i=>(!S.rep.customer||i.customerId===S.rep.customer)&&(!S.rep.from||i.date>=S.rep.from)&&i.date<=t);
  const G={};
  L.forEach(i=>{ const paid=r2((i.payments||[]).filter(p=>p.date<=t).reduce((s,p)=>s+(+p.amount||0),0)); const bal=r2(calc(i).total-paid); if(bal<=0.004) return; const d=daysBetween(i.date,t), k=i.customerName||"—"; G[k]=G[k]||[0,0,0,0,0]; G[k][d<=30?0:d<=60?1:d<=90?2:3]+=bal; G[k][4]+=bal; });
  const rows=Object.entries(G).sort((a,b)=>b[1][4]-a[1][4]).map(([k,v])=>[k,...v.map(r2)]);
  const s=k=>r2(rows.reduce((a,r)=>a+r[k],0));
  return `<p class="hint">الرصيد المفتوح كما في ${dmy(t)} حسب عمر الفاتورة.</p>`+tableHTML({title:"أعمار الديون كما في "+dmy(t),head:["العميل","0–30 يوم","31–60 يوم","61–90 يوم","أكثر من 90","الإجمالي"],num:{1:1,2:1,3:1,4:1,5:1},rows,foot:rows.length?["الإجمالي",s(1),s(2),s(3),s(4),s(5)]:null});
}
function repPayments(){
  const R=S.rep, rows=[];
  S.invoices.filter(i=>i.kind!=="proforma"&&(!R.customer||i.customerId===R.customer)).forEach(i=>(i.payments||[]).forEach(p=>{ if(R.from&&p.date<R.from) return; if(R.to&&p.date>R.to) return; const r=[dmy(p.date),i.no,i.customerName||"",p.method||"",p.ref||"",+p.amount||0]; r._open=i.id; r._d=p.date; rows.push(r); }));

function exportXlsx(T, name){
  if(!window.XLSX){ toast("مكتبة Excel لم تُحمّل بعد"); return; }
  const aoa=[T.head, ...T.rows.map(r=>[...r]), ...(T.foot?[T.foot]:[])];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=T.head.map(()=>({wch:18})); ws["!views"]=[{RTL:true}];
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]}; XLSX.utils.book_append_sheet(wb, ws, "Report");
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  saveFile(name.replace(/[^\w\-]+/g,"-")+".xlsx", new Blob([out]));
}

function bindList(special){
  $$("[data-tab]").forEach(b=>b.onclick=()=>{S.listTab=b.dataset.tab; render();});
  const rer=(el,key)=>{ el.addEventListener(el.tagName==="INPUT"&&el.type!=="date"?"input":"change",()=>{ S[key]=el.value; const id=el.id, p=el.selectionStart; render(); const n=$("#"+id); if(n){ n.focus(); try{ n.setSelectionRange(p,p);}catch(e){} } }); };
  rer($("#f-q"),"listQ"); rer($("#f-st"),"listStatus"); rer($("#f-cu"),"listCustomer"); rer($("#f-from"),"listFrom"); rer($("#f-to"),"listTo");
  const upd=()=>{ const b=$("#bulk"); if(b){ b.hidden=!S.selected.size; b.querySelector("span").textContent=S.selected.size+" محددة:"; } };
  $$(".sel").forEach(cb=>cb.onchange=()=>{ cb.checked?S.selected.add(cb.value):S.selected.delete(cb.value); upd(); });
  const all=$("#sel-all"); if(all) all.onchange=()=>{ $$(".sel").forEach(cb=>{ cb.checked=all.checked; all.checked?S.selected.add(cb.value):S.selected.delete(cb.value); }); upd(); };
  $$("[data-bulk]").forEach(b=>b.onclick=async()=>{
    const ids=[...S.selected];
    if(b.dataset.bulk==="clear"){ S.selected.clear(); render(); return; }
    if(b.dataset.bulk==="pack"){ const html=ids.map(id=>invById(id)).filter(Boolean).map(i=>docHtml("invoice",i)).join(""); await makePdf(html,`Invoices-${ids.length}.pdf`); return; }
    if(b.dataset.bulk==="paid") confirmBox(`تسجيل ${ids.length} فاتورة كمدفوعة بالكامل بتاريخ اليوم؟`,"تسجيل الدفع",async()=>{
      let n=0; for(const id of ids){ const i=invById(id); if(!i) continue; const c=calc(i); if(c.balance<=0.004||i.kind==="proforma") continue; await patchInvoice(id,{payments:[...(i.payments||[]),{date:todayISO(),amount:c.balance,method:"تحويل بنكي",ref:"تسوية جماعية"}]},"دفعة جماعية"); n++; }
      S.selected.clear(); toast(`تم تسجيل ${n} دفعة`); render(); });
  });
  $("#exp-list").onclick=()=>{ const L=filteredInvoices(special); exportXlsx({head:["الرقم","النوع","التاريخ","العميل","المدرسة / الموقع","نوع الأعمال","أمر العمل","المرجع","القيمة","المدفوع","الرصيد","الحالة"],rows:L.map(i=>{const c=calc(i);return [i.no,KIND[i.kind],i.date,i.customerName||"",i.site||"",i.typeOfWorks||"",i.workOrder||"",i.ref||"",c.total,c.paid,c.balance,STATUS_AR[statusOf(i)]];})},"Alharam-Invoices-"+todayISO()); };
}
function bindEditor(){
  const form=$("#editor-form"); if(!form) return;
  const body=$("#lines-body");
  body.addEventListener("input",e=>{ const inp=e.target.closest("input[data-f]"); if(!inp) return; const k=+inp.closest("tr").dataset.k; const f=inp.dataset.f;
    ED.lines[k][f]= (f==="qty"||f==="price") ? inp.value.replace(/,/g,"") : inp.value;
    const td=inp.closest("tr").querySelector("[data-tot]"); if(td) td.textContent=fmt(lineTotal(ED.lines[k])); updateTotals(); });
  body.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const tr=e.target.closest("tr"); if(+tr.dataset.k===ED.lines.length-1){ ED.lines.push({desc:"",unit:ED.lines[ED.lines.length-1].unit||"",qty:"",price:""}); body.innerHTML=linesRows(); } const nx=body.querySelector(`tr[data-k="${+tr.dataset.k+1}"] input`); nx&&nx.focus(); } });
  body.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const k=+b.closest("tr").dataset.k, L=ED.lines;
    if(b.dataset.act==="del"){ L.splice(k,1); if(!L.length) L.push({desc:"",unit:"",qty:"",price:""}); }
    if(b.dataset.act==="up"&&k>0) [L[k-1],L[k]]=[L[k],L[k-1]];
    if(b.dataset.act==="down"&&k<L.length-1) [L[k+1],L[k]]=[L[k],L[k+1]];
    if(b.dataset.act==="head") L[k].heading=!L[k].heading;
    body.innerHTML=linesRows(); updateTotals(); });
  $("#add-line").onclick=()=>{ ED.lines.push({desc:"",unit:"",qty:"",price:""}); body.innerHTML=linesRows(); body.querySelector(`tr[data-k="${ED.lines.length-1}"] input`).focus(); };
  $("#add-head").onclick=()=>{ ED.lines.push({desc:"",heading:true}); body.innerHTML=linesRows(); body.querySelector(`tr[data-k="${ED.lines.length-1}"] input`).focus(); };
  const db=$("#ded-box");
  db.addEventListener("input",e=>{ const inp=e.target.closest("input[data-df]"); if(!inp) return; const d=ED.deductions[+inp.closest("tr").dataset.dk]; const f=inp.dataset.df;
    d[f]= f==="label"?inp.value:inp.value.replace(/,/g,""); if(f==="pct"){ const a=inp.closest("tr").querySelector('[data-df="amount"]'); a.disabled=!blank(d.pct); } updateTotals(); });
  db.addEventListener("click",e=>{ const b=e.target.closest("[data-ddel]"); if(!b) return; ED.deductions.splice(+b.dataset.ddel,1); db.innerHTML=dedRows(); updateTotals(); });
  $$("[data-dadd]").forEach(b=>b.onclick=()=>{ ED.deductions=ED.deductions||[]; const t=b.dataset.dadd;
    ED.deductions.push(t==="ret"?{label:"Less: Retention (5%)",pct:5,amount:""}:t==="adv"?{label:"Less: Advance payment",pct:"",amount:""}:{label:"",pct:"",amount:""}); db.innerHTML=dedRows(); updateTotals(); });
  $("#e-disc").oninput=()=>{ ED.discount=r2($("#e-disc").value.replace(/,/g,"")); updateTotals(); };
  $("#e-cust").onchange=()=>applyCustomer($("#e-cust").value);
  $("#e-addcust").onclick=()=>quickCustomerModal(id=>{ readEditor(); applyCustomer(id); const sel=$("#e-cust"); sel.innerHTML=`<option value="">— اختر العميل —</option>`+S.customers.map(c=>`<option value="${esc(c.id)}" ${c.id===id?"selected":""}>${esc(c.name)}</option>`).join(""); });
  const kind=$("#e-kind"); if(!kind.disabled) kind.onchange=()=>{ readEditor(); const k=kind.value; ED.kind=k; ED._kind=k; ED.no=nextNo(k,ED.date); if(k!=="invoice") ED.dueDate=""; else ED.dueDate=addDays(ED.date,S.settings.terms); render(); };
  $("#e-date").onchange=()=>{ const d=$("#e-date").value; if(!ED._id && d){ $("#e-no").value=nextNo(ED.kind,d); if(ED.kind==="invoice") $("#e-due").value=addDays(d,S.settings.terms); } };
  const lb=$("#linked-box"); if(lb){
    lb.addEventListener("change",e=>{ if(!e.target.classList.contains("lk")) return; const ids=$$(".lk:checked",lb).map(x=>x.value); ED.linked=ids.map(id=>{const i=invById(id);return {id,no:i.no,date:i.date,total:calc(i).total};}); lb.querySelector(".hint:last-child")&&(lb.querySelector(".actions .hint").textContent=ids.length+" محددة"); });
    lb.addEventListener("click",e=>{ if(e.target.id!=="lk-fill") return; if(!ED.linked.length){ toast("حدد فاتورة واحدة على الأقل"); return; }
      ED.lines=[{desc:"Payment for the following invoices :",heading:true},...ED.linked.map(x=>{const i=invById(x.id); return {desc:`Invoice No. ${x.no} dated ${dmy(x.date)}${i&&i.site?" – "+i.site:""}${i&&i.typeOfWorks?" ("+i.typeOfWorks+")":""}`,unit:"Inv",qty:1,price:x.total};})];
      body.innerHTML=linesRows(); updateTotals(); toast("تم إدراج "+ED.linked.length+" فاتورة"); });
  }
  form.addEventListener("submit",e=>{ e.preventDefault(); saveEditor(false); });
  $("#save-new").onclick=()=>saveEditor(true);
  updateTotals();
}
function bindInvoice(){
  const i=invById(S.route.arg); if(!i) return;
  $$("[data-pdf]").forEach(b=>b.onclick=()=>makePdf(docHtml(b.dataset.pdf,i),pdfName(b.dataset.pdf,i)));
  $("#pack").onclick=()=>makePdf(docHtml("pack",i),pdfName("pack",i));
  const ap=$("#add-pay"); if(ap) ap.onclick=()=>paymentModal(i,null,async p=>{ try{ await patchInvoice(i.id,{payments:[...(i.payments||[]),p]},"دفعة "+fmt(p.amount)); toast("تم تسجيل الدفعة"); }catch(e){ toast("تعذر الحفظ"); } });
  $$("[data-delpay]").forEach(b=>b.onclick=()=>confirmBox("حذف هذه الدفعة؟","حذف",async()=>{ const P=[...i.payments]; const [x]=P.splice(+b.dataset.delpay,1); await patchInvoice(i.id,{payments:P},"حذف دفعة "+fmt(x.amount)); toast("تم حذف الدفعة"); },true));
  const del=$("#del-inv"); if(del) del.onclick=()=>confirmBox(`حذف الفاتورة ${i.no} نهائياً؟ يفضّل تغيير حالتها إلى "ملغاة" للحفاظ على التسلسل.`,"حذف نهائي",async()=>{ await Store.remove("invoices",i.id); toast("تم حذف الفاتورة"); go("invoices"); },true);
  const dup=$("#dup"); if(dup) dup.onclick=()=>{ const n=clone(i); delete n.id; Object.assign(n,{payments:[],history:[],status:"issued",date:todayISO(),completedDate:todayISO()}); n.no=nextNo(n.kind,n.date); if(n.kind==="invoice") n.dueDate=addDays(n.date,S.settings.terms); ED=n; ED._id=null; ED._kind=n.kind; location.hash=n.kind==="invoice"?"new":"new-"+n.kind; };
  const cv=$("#convert"); if(cv) cv.onclick=()=>confirmBox("تحويل الفاتورة المبدئية إلى فاتورة رسمية برقم جديد؟ ستبقى المبدئية محفوظة كمرجع.","تحويل",async()=>{
    const n=clone(i); delete n.id; const d=todayISO(); Object.assign(n,{kind:"invoice",date:d,dueDate:addDays(d,S.settings.terms),payments:[],status:"issued",fromProforma:i.no}); n.no=nextNo("invoice",d);
    const id=slug(n.no)||uid("inv"); const c=calc(n), now=new Date().toISOString(); Object.assign(n,{subtotal:c.sub,total:c.total,paid:0,balance:c.total,year:+d.slice(0,4),excluded:false,createdAt:now,updatedAt:now,history:[{at:now,by:S.uid||"",action:"تحويل من "+i.no}]});
    await Store.save("invoices",id,n); await patchInvoice(i.id,{convertedTo:n.no},"حُوّلت إلى "+n.no); toast("تم إنشاء الفاتورة "+n.no); go("inv-"+id); });
  const sp=$("#sp-pay"); if(sp) sp.onclick=()=>{
    const targets=(i.linked||[]).map(x=>invById(x.id)).filter(Boolean).filter(x=>calc(x).balance>0.004);
    if(!targets.length){ toast("كل الفواتير المرتبطة مسددة"); return; }
    paymentModal({...i,lines:[{qty:1,price:targets.reduce((s,x)=>s+calc(x).balance,0)}],discount:0,payments:[]},null,async p=>{
      let left=p.amount; for(const t of targets){ if(left<=0.004) break; const a=r2(Math.min(left,calc(t).balance)); left=r2(left-a); await patchInvoice(t.id,{payments:[...(t.payments||[]),{...p,amount:a,ref:(p.ref?p.ref+" / ":"")+i.no}]},"دفعة عبر "+i.no); }
      await patchInvoice(i.id,{payments:[...(i.payments||[]),{...p,amount:r2(p.amount-left)}]},"تحويل موزع على الفواتير");
      toast("تم توزيع الدفعة على "+targets.length+" فاتورة"); });
  };
  if(USER && (i.history||[]).some(h=>h.by&&!S.names[h.by])){
    const ids=[...new Set(i.history.map(h=>h.by).filter(Boolean))];
    USER.profiles(ids).then(ps=>{ let ch=false; for(const id of ids){ const n=ps&&ps[id]&&ps[id].name; if(n&&S.names[id]!==n){ S.names[id]=n; ch=true; } } if(ch&&S.route.name==="inv") render(); }).catch(()=>{});
  }
}
function bindDoc(kind){
  const i=invById(S.route.arg); if(!i) return;
  fitPaper(); setTimeout(fitPaper,400); try{ document.fonts.ready.then(fitPaper); }catch(e){}
  $("#doc-pdf").onclick=()=>makePdf(docHtml(kind,i),pdfName(kind,i));
  const p=$("#doc-print"); if(p) p.onclick=()=>printDirect(docHtml(kind,i));
  const l=$("#doc-lang"); if(l) l.onchange=()=>{ S.docLang=l.value; render(); };
}
function bindReports(){
  $$("[data-rtab]").forEach(b=>b.onclick=()=>{S.repTab=b.dataset.rtab; render();});
  const m={"r-from":"from","r-to":"to","r-cu":"customer","r-kind":"kind","r-st":"status","r-grp":"group"};
  for(const [id,k] of Object.entries(m)){ const el=$("#"+id); if(el) el.onchange=()=>{S.rep[k]=el.value; render();}; }
  $$("[data-quick]").forEach(b=>b.onclick=()=>{ const [f,t]=QUICK[+b.dataset.quick](); S.rep.from=f; S.rep.to=t; render(); });
  const sub=()=> (S.rep.from||S.rep.to?`الفترة ${dmy(S.rep.from)||"البداية"} – ${dmy(S.rep.to)||"اليوم"}`:"كل الفترات")+(S.rep.customer?" — "+(custById(S.rep.customer)?.name||""):"");
  $("#rep-xls").onclick=()=>{ if(!REP_TABLE||!REP_TABLE.rows.length){ toast("لا توجد بيانات للتصدير"); return; } exportXlsx(REP_TABLE,"Alharam-"+(S.route.name==="statement"?"Statement":S.repTab)+"-"+todayISO()); };
  $("#rep-pdf").onclick=()=>{ if(!REP_TABLE||!REP_TABLE.rows.length){ toast("لا توجد بيانات"); return; } makePdf(reportSheetHtml(REP_TABLE,S.route.name==="statement"?"حتى "+dmy(todayISO()):sub()),"Alharam-"+(S.route.name==="statement"?"Statement":S.repTab)+"-"+todayISO()+".pdf"); };
}
function bindCustomer(){
  const form=$("#editor-form"); if(!form) return; const id=S.route.arg;
  form.onsubmit=async e=>{ e.preventDefault(); const name=$("#c-name").value.trim(); if(!name){ toast("أدخل اسم العميل"); return; }
    const old=id==="new"?{}:custById(id)||{}; const cid=id==="new"?uid("c"):id;
    const data={...old,name,nameEn:$("#c-en").value.trim(),address:$("#c-addr").value.trim(),phone:$("#c-ph").value.trim(),pobox:$("#c-po").value.trim(),contact:$("#c-ct").value.trim(),email:$("#c-em").value.trim(),updatedAt:new Date().toISOString()};
    delete data.id; if(id==="new"){ data.serial=Math.max(0,...S.customers.map(c=>+c.serial||0))+1; data.createdAt=data.updatedAt; }
    try{ await Store.save("customers",cid,data); toast("تم حفظ العميل"); go("customers"); }catch(err){ toast("تعذر الحفظ"); } };
  const d=$("#c-del"); if(d) d.onclick=()=>confirmBox("حذف هذا العميل؟","حذف",async()=>{ await Store.remove("customers",id); toast("تم الحذف"); go("customers"); },true);
}
function bindSettings(){
  const form=$("#editor-form");
  if(form) form.onsubmit=async e=>{ e.preventDefault(); const v=id=>$("#"+id).value;
    const st={company:{nameAr:v("s-nar"),nameEn:v("s-nen"),shortEn:v("s-sen"),cr:v("s-cr"),capital:v("s-cap"),legalAr:v("s-legal"),tel:v("s-tel"),mobile:v("s-mob"),pobox:v("s-po"),city:v("s-city"),email:v("s-mail")},
      bank:{holder:v("b-h"),name:v("b-n"),account:v("b-a"),iban:v("b-i"),swift:v("b-s")},numbering:{invoice:v("n-i").trim()||"ALH",proforma:v("n-p").trim()||"PF",special:v("n-s").trim()||"SP"},terms:+v("n-t")||30,
      show:{stamp:$("#sh-stamp").checked,sign:$("#sh-sign").checked,strip:$("#sh-strip").checked},
      tpl:{completionIntro:v("t-ci"),completionDate:v("t-cd"),completionList:v("t-cl"),completionConfirm:v("t-cc"),warrantyBody:v("t-wb"),warrantyExclusions:v("t-we"),warrantyReporting:v("t-wr"),coverEn:v("t-ce"),coverAr:v("t-ca")}};
    try{ await Store.saveSettings(st); S.settings=deepMerge(DEFAULT_SETTINGS,st); toast("تم حفظ الإعدادات"); }catch(err){ toast("تعذر حفظ الإعدادات — تحتاج صلاحية محرر"); } };
  const rs=$("#s-reset"); if(rs) rs.onclick=()=>confirmBox("استعادة نصوص النماذج الافتراضية؟ (لن تتغير بيانات الشركة)","استعادة",async()=>{ const st=clone(S.settings); st.tpl=clone(DEFAULT_SETTINGS.tpl); await Store.saveSettings(st); S.settings=st; toast("تمت الاستعادة"); render(); });
  $("#bk-exp").onclick=()=>{ const data={app:"alharam-invoices",version:1,exportedAt:new Date().toISOString(),settings:S.settings,customers:S.customers,invoices:S.invoices}; saveFile(`Alharam-Backup-${todayISO()}.json`, JSON.stringify(data,null,1)); };
  $("#bk-xls").onclick=()=>{ if(!window.XLSX) return toast("مكتبة Excel لم تُحمّل");
    const wb=XLSX.utils.book_new();
    const inv=S.invoices.map(i=>{const c=calc(i);return {"الرقم":i.no,"النوع":KIND[i.kind],"التاريخ":i.date,"الاستحقاق":i.dueDate||"","العميل":i.customerName,"المدرسة":i.site||"","نوع الأعمال":i.typeOfWorks||"","أمر العمل":i.workOrder||"","المرجع":i.ref||"","الموقع":i.location||"","المجموع":c.sub,"الاستقطاعات":c.ded,"الخصم":+i.discount||0,"الصافي":c.total,"المدفوع":c.paid,"الرصيد":c.balance,"الحالة":STATUS_AR[statusOf(i)]};});
    const lines=[]; S.invoices.forEach(i=>(i.lines||[]).forEach((l,k)=>lines.push({"الفاتورة":i.no,"#":k+1,"الوصف":l.desc,"عنوان":l.heading?"نعم":"","الوحدة":l.unit||"","الكمية":l.qty??"","السعر":l.price??"","الإجمالي":l.heading?"":lineTotal(l)})));
    const pays=[]; S.invoices.forEach(i=>(i.payments||[]).forEach(p=>pays.push({"الفاتورة":i.no,"العميل":i.customerName,"التاريخ":p.date,"المبلغ":p.amount,"الطريقة":p.method||"","المرجع":p.ref||""})));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(inv),"Invoices"); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lines),"Lines");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pays),"Payments"); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.customers.map(c=>({"#":c.serial,"العميل":c.name,"English":c.nameEn||"","العنوان":c.address||"","الهاتف":c.phone||"","ص.ب":c.pobox||""}))),"Customers");
    saveFile(`Alharam-All-${todayISO()}.xlsx`, new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})])); };
  const fi=$("#bk-file"); if(fi) fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ let d; try{ d=JSON.parse(rd.result); }catch(e){ toast("ملف غير صالح"); return; }
    if(d.app!=="alharam-invoices"){ toast("هذا الملف ليس نسخة احتياطية من النظام"); return; }
    confirmBox(`استعادة ${d.invoices?.length||0} فاتورة و ${d.customers?.length||0} عميل؟ السجلات بنفس المعرّف ستُستبدل.`,"استعادة",async()=>{
      let n=0; for(const c of d.customers||[]){ const {id,...x}=c; if(slug(id)===id){ await Store.save("customers",id,x); n++; } }
      for(const i of d.invoices||[]){ const {id,...x}=i; if(slug(id)===id){ await Store.save("invoices",id,x); n++; } }
      if(d.settings&&S.isAdmin) await Store.saveSettings(d.settings);
      toast(`تمت استعادة ${n} سجل`); }); }; rd.readAsText(f); };
}

S.route=parseHash();
boot();
</script>
