<title>نظام فواتير الحرم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: right-hand rail (RTL) for ledger sections, wide work area; documents render as true A4 paper sheets matching the company's Excel originals */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E6E9EF; --line:#D3D8E2;
  --ink:#151B2B; --muted:#5A6275; --accent:#1B2A4A; --accent-ink:#FFFFFF; --accent-soft:#E2E6EF;
  --rail:#16213B; --rail-ink:#E6EAF2; --rail-muted:#9AA6C0; --rail-hover:rgba(255,255,255,.07); --rail-on:rgba(214,178,98,.17); --rail-gold:#E0BD6E;
  --c-bar:#0E9A6C; --c-line:#E07A0F; --c-blue:#1F7FC8; --c-teal:#13958A; --c-gray:#A3AAB8; --c-grid:#E1E5EC;
  --gold:#9C7629; --gold-soft:#F3E9D2;
  --ok:#1E7A4F; --ok-bg:#DCF0E4; --warn:#9A6200; --warn-bg:#FAEBC9; --bad:#B23A30; --bad-bg:#F7DEDA; --info:#3D4F7A; --info-bg:#E2E7F2;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#222222; --paper-soft:#F1F1F1; --paper-blue:#DCE6F1; --paper-red:#D0021B; --paper-navy:#1F3C8F; --paper-gold:#9C7629;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-doc:"Tinos","Times New Roman",Times,serif;
  --f-doc-sans:"Arimo",Arial,Helvetica,sans-serif;
  --f-doc-ar:"Noto Naskh Arabic","Traditional Arabic",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1019; --surface:#151B29; --sunk:#1C2334; --line:#2B3347;
  --ink:#E6E9F0; --muted:#9BA3B6; --accent:#B4C3E4; --accent-ink:#0E1628; --accent-soft:#26314B;
  --rail:#0A0F1C; --rail-ink:#E6EAF2; --rail-muted:#8E99B2; --rail-hover:rgba(255,255,255,.06); --rail-on:rgba(214,178,98,.14); --rail-gold:#E0BD6E;
  --c-bar:#2BC08A; --c-line:#F2954A; --c-blue:#4AA3E8; --c-teal:#2CB5A8; --c-gray:#6E7890; --c-grid:#2A3348;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1019; --surface:#151B29; --sunk:#1C2334; --line:#2B3347;
  --ink:#E6E9F0; --muted:#9BA3B6; --accent:#B4C3E4; --accent-ink:#0E1628; --accent-soft:#26314B;
  --rail:#0A0F1C; --rail-ink:#E6EAF2; --rail-muted:#8E99B2; --rail-hover:rgba(255,255,255,.06); --rail-on:rgba(214,178,98,.14); --rail-gold:#E0BD6E;
  --c-bar:#2BC08A; --c-line:#F2954A; --c-blue:#4AA3E8; --c-teal:#2CB5A8; --c-gray:#6E7890; --c-grid:#2A3348;
  --gold:#D9B35E; --gold-soft:#3A3020;
  --ok:#5BC98F; --ok-bg:#163828; --warn:#E6AE45; --warn-bg:#3A2D12; --bad:#F08077; --bad-bg:#40201C; --info:#AAB8DD; --info-bg:#232E4A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.shell.collapsed{grid-template-columns:62px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-ink);border-inline-end:1px solid transparent;padding-block:14px;padding-inline:10px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:28px;height:auto}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.2;display:block}
.brand small{color:var(--muted);font-size:10.5px;display:block;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.railtog{margin-inline-start:auto}
.shell.collapsed .rail{padding-inline:8px;align-items:center}
.shell.collapsed .nav a span,.shell.collapsed .nav .nbadge,.shell.collapsed .brand>div,.shell.collapsed .who>div,.shell.collapsed .who .iconbtn,.shell.collapsed .rail-foot .conn{display:none}
.shell.collapsed .nav a{justify-content:center;padding:8px}
.shell.collapsed .brand{flex-direction:column;gap:6px}
.shell.collapsed .railtog{margin:0}
.shell.collapsed .who{border:0;padding:0}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;color:var(--ink);font-size:13px}
.conn{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
main{min-width:0;padding-block:22px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;background:var(--rail);border-top:2px solid var(--gold);padding-bottom:max(8px,env(safe-area-inset-bottom,0px))!important;overflow-x:auto;gap:4px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mobile-nav a{white-space:nowrap;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--rail-ink);background:rgba(255,255,255,.08);font-size:13px}
  .mobile-nav a.on{background:var(--rail-gold);color:#16213B;font-weight:700}
  .sticky-bar{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
}

/* embedded cheque system */
.chq-host{display:block;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
/* navy rail */
.rail .nav a{color:var(--rail-ink)} .rail .nav a:hover{background:var(--rail-hover)} .rail .nav a.on{background:var(--rail-on);color:var(--rail-gold)}
.rail .nav .sep{background:rgba(255,255,255,.12)} .rail .brand small,.rail .rail-foot{color:var(--rail-muted)} .rail .brand b{color:#fff}
.rail .who{border-color:rgba(255,255,255,.14)} .rail .who b{color:var(--rail-ink)} .rail .who .av{background:var(--rail-on);color:var(--rail-gold)}
.rail .iconbtn{color:var(--rail-muted)} .rail .iconbtn:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nbadge{margin-inline-start:auto;background:var(--rail-gold);color:#16213B;border-radius:999px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:19px}
.ver{font-size:11px;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
/* dashboard (reference layout) */
.dash2{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:16px}
.dash3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.dash2,.dash3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.04);min-width:0}
.card h3{margin:0 0 14px;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.card svg{width:100%;height:auto;display:block;direction:ltr}
.card svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.rowcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13.5px}
.rowcard b{color:var(--c-line);font-variant-numeric:tabular-nums;white-space:nowrap}
.rowcard .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-inv{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;text-decoration:none;color:inherit;align-items:center}
.mini-inv:hover{border-color:var(--accent)}
.mini-inv .no{font-weight:700;direction:ltr;unicode-bidi:isolate;font-size:13.5px}
.mini-inv .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.mini-inv .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-list{max-height:340px;overflow:auto;padding-inline-end:4px}
.chart-legend{display:flex;gap:18px;justify-content:center;font-size:13px;margin-top:10px;flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart-legend i.dot{border-radius:50%}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--ink);min-width:0}
input.i[disabled],select.i[disabled],textarea.i[disabled]{background:var(--sunk);color:var(--muted)}
textarea.i{min-height:70px;resize:vertical;line-height:1.6}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.ltr,textarea.ltr{direction:ltr;text-align:left}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:span 2} @media (max-width:520px){.span2{grid-column:auto}}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}.checks li{border-inline-start:4px solid var(--muted);background:var(--bg);padding:7px 10px;border-radius:6px;font-size:13.5px}
.ai-out{white-space:pre-line;background:var(--gold-soft);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.8}
.ai-card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ai-card h3 .btn{margin-inline-start:auto}
.btn.rec{background:#C62828;color:#fff;border-color:#C62828;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.7}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.cols.even{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .l,.kpi.lead .s,.kpi.lead .v small{color:var(--accent-ink);opacity:.85}
.kpis.mini .kpi{padding:10px 14px}.kpis.mini .kpi .v{font-size:18px}
a.kpi{text-decoration:none;color:inherit}a.kpi:hover{border-color:var(--accent)}
.delta{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;margin-inline-start:6px}
.delta.up{background:var(--ok-bg);color:var(--ok)}.delta.down{background:var(--bad-bg);color:var(--bad)}
.kpi.lead .delta{background:rgba(255,255,255,.18);color:inherit}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--sunk);text-align:start;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 10px;white-space:nowrap}
table.t td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t td.n,table.t th.n{text-align:end;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--sunk)}
.ltr{direction:ltr;unicode-bidi:isolate}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.paid,.chip.transferred{background:var(--ok-bg);color:var(--ok)}
.chip.partial,.chip.pending{background:var(--warn-bg);color:var(--warn)}
.chip.issued,.chip.open{background:var(--info-bg);color:var(--info)}
.chip.draft{background:var(--sunk);color:var(--muted)}
.chip.cancelled{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.chip.cancelled-red{background:var(--bad-bg);color:var(--bad)}
.chip.legacy{background:var(--gold-soft);color:var(--gold)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.tag.pf{background:var(--accent-soft);color:var(--accent)}
.tag.lg{background:var(--sunk);color:var(--muted)}
.lock{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.lock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* tabs / filters */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;font-size:12.5px;padding-block:5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent)}

/* editor */
.ghead{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.85fr) minmax(0,2.6fr)}
@media (max-width:860px){.ghead{grid-template-columns:repeat(2,minmax(0,1fr))}.ghead .wide{grid-column:1/-1}}
@media (max-width:520px){.ghead{grid-template-columns:minmax(0,1fr)}}
.disc{display:flex;gap:6px;align-items:center}.disc select{width:auto}.disc input{width:72px}
table.lines{width:100%;border-collapse:collapse;min-width:680px}
table.lines th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:6px;background:var(--sunk);white-space:nowrap}
table.lines td{padding:4px;border-top:1px solid var(--line);vertical-align:top}
table.lines input{width:100%;border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;min-width:0}
table.lines input:hover{border-color:var(--line)}
table.lines input:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.lines input[disabled]{color:var(--ink)}
table.lines tr.head input.d{font-weight:700}
table.lines td.tot{padding:10px 8px;text-align:end;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

/* amount in words — English (style of the original Excel invoice) */
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function en3(n){ let s=""; const h=Math.floor(n/100), r=n%100; if(h) s+=ONES[h]+" Hundred"; if(r){ if(s) s+=" "; s+= r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?" "+ONES[r%10]:""); } return s; }
function enWords(n){ n=Math.floor(Math.abs(n)); if(!n) return "Zero"; const sc=["","Thousand","Million","Billion"]; let parts=[],i=0; while(n>0){ const c=n%1000; if(c) parts.unshift(en3(c)+(sc[i]?" "+sc[i]:"")); n=Math.floor(n/1000); i++; } return parts.join(" "); }
function amountEn(x){ x=r2(x); const r=Math.floor(Math.abs(x)), d=Math.round((Math.abs(x)-r)*100); return "Only "+enWords(r)+" Qatar Riyal and "+(d?enWords(d):"No")+" Dirhams"; }
/* amount in words — Arabic */
const AONES=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
const ATENS=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
const AHUN=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
function ar99(n){ if(n<20) return AONES[n]; const u=n%10,t=Math.floor(n/10); return u? AONES[u]+" و"+ATENS[t] : ATENS[t]; }
function ar3(n){ const h=Math.floor(n/100), r=n%100; return [AHUN[h], r?ar99(r):""].filter(Boolean).join(" و"); }
function arScale(n, one, two, plural){ if(n===1) return one; if(n===2) return two; if(n>=3&&n<=10) return ar3(n)+" "+plural; return ar3(n)+" "+one; }
function arWords(n){ n=Math.floor(Math.abs(n)); if(!n) return "صفر"; const parts=[]; const b=Math.floor(n/1e9)%1000, m=Math.floor(n/1e6)%1000, t=Math.floor(n/1000)%1000, r=n%1000;
  if(b) parts.push(arScale(b,"مليار","ملياران","مليارات")); if(m) parts.push(arScale(m,"مليون","مليونان","ملايين")); if(t) parts.push(arScale(t,"ألف","ألفان","آلاف")); if(r) parts.push(ar3(r)); return parts.join(" و"); }
function amountAr(x){ x=r2(x); const r=Math.floor(Math.abs(x)), d=Math.round((Math.abs(x)-r)*100); return "فقط "+arWords(r)+" ريال قطري"+(d?" و"+arWords(d)+" درهم":"")+" لا غير"; }

/* ---------------- invoice math & status ---------------- */
function lineTotal(l){
  if(!l || l.heading) return 0;
  if(blank(l.qty) && blank(l.price)) return r2(Number(l.amount)||0);
  if(blank(l.qty)) return r2(Number(l.price)||0);
  return r2((Number(l.qty)||0)*(Number(l.price)||0));
}
function discAmt(inv, sub){ return r2(!blank(inv.discPct) && Number(inv.discPct) ? sub*Number(inv.discPct)/100 : Number(inv.discount)||0); }
function discLabel(inv){ const p=Number(inv.discPct)||0; return inv.discType==="retention" ? "Retention"+(p?` (${p}%)`:"") : (p?`Discount (${p}%)`:"Dis."); }
function dedAmount(d, sub){ return r2(!blank(d.pct) && Number(d.pct) ? sub*Number(d.pct)/100 : Number(d.amount)||0); }
const activePays = inv => (inv.payments||[]).filter(p=>!p.reversed);
function calc(inv){
  const sub = r2((inv.lines||[]).reduce((s,l)=> s + lineTotal(l),0));
  const ded = r2((inv.deductions||[]).reduce((s,d)=> s + dedAmount(d,sub),0));
  const total = r2(sub - ded - discAmt(inv,sub));
  const paid = inv.kind==="special" ? 0 : r2(activePays(inv).reduce((s,p)=>s+(Number(p.amount)||0),0));
  return {sub,ded,total,paid,balance:r2(total-paid)};
}
function statusOf(inv){
  if(inv.status==="cancelled") return "cancelled";
  if(inv.status==="draft") return "draft";
  if(inv.status==="pending") return "pending";
  if(inv.kind==="special") return inv.spStatus==="transferred"?"transferred":"open";
  if(inv.kind==="proforma") return inv.convertedTo?"paid":"issued";
  const c=calc(inv);
  if(c.total>0 && c.paid>=c.total-0.004) return "paid";
  if(c.paid>0) return "partial";
  return "issued";
}
const isLegacy = inv => !!inv.imported;
const awaitingReview = inv => false; /* payment follow-up is done in QuickBooks */
const inAccounts = inv => inv.kind==="invoice" && inv.status==="issued";
const confirmed = inv => inAccounts(inv) && !awaitingReview(inv);

}

function warrantyType(inv){

  const t=[inv.typeOfWorks, inv.worksList, ...(inv.lines||[]).map(l=>l.desc)].join(" ").toLowerCase();

  return "general";
}

/* ---------------- serial numbers ----------------
   PREFIX-SERIES-NNNNNN, one continuous counter per series (never resets).
   Numbers are reserved only when a document is issued; drafts use a temporary label.
   Reservation takes a short lease on counters/<SERIES> so two devices never get the same number. */
const fmtSerial = (series, n) => `${S.settings.numbering.prefix}-${series}-${String(n).padStart(6,"0")}`;
function usedNumbers(){
  const out=[];
  for(const i of S.invoices){ if(i.no) out.push(i.no); for(const k of DOC_KINDS) if(i.docNos?.[k]?.no) out.push(i.docNos[k].no); for(const p of i.payments||[]) if(p.rcv?.no) out.push(p.rcv.no); }
  return out;
}
function maxUsed(series){
  const re=new RegExp("^"+S.settings.numbering.prefix.replace(/[^A-Za-z0-9]/g,"\\$&")+"-"+series+"-(\\d+)$"); let m=0;
  for(const n of usedNumbers()){ const x=String(n).match(re); if(x) m=Math.max(m,+x[1]); }
  return m;
}
async function allocate(series){
  const start=Number(S.settings.numbering.start?.[series]||1);
  const now=new Date().toISOString();
  if(S.mode==="cloud"){
    const ref=DB.doc("counters/"+series);
    for(let attempt=0; attempt<8; attempt++){
      let lease; try{ lease=await ref.acquire({holder:S.session.u+"-"+(S.uid||"x"), ttlMs:6000}); }catch(e){ lease={acquired:true}; }
      if(!lease.acquired){ await new Promise(r=>setTimeout(r,500+Math.random()*500)); continue; }
      const snap=await ref.get(); const last=snap.exists?Number(snap.data().last)||0:0;
      const n=Math.max(last, maxUsed(series), start-1)+1;
      await ref.set({last:n, series, at:now, by:actor()});
      S.counters[series]={last:n};
      return fmtSerial(series,n);
    }
    throw new Error("الترقيم مشغول — حاول مرة أخرى");
  }
  const d=lsRead(); d.counters=d.counters||{}; const last=Number(d.counters[series]?.last)||0;
  const n=Math.max(last, maxUsed(series), start-1)+1; d.counters[series]={last:n,at:now,by:actor()}; lsWrite(d); S.counters=d.counters;
  return fmtSerial(series,n);
}

async function withRetry(fn){
  try{ return await fn(); }
  catch(e){
    if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return await fn(); }
    if(e && e.code==="invalid_argument" && S.mode==="cloud") toast("رفضت قاعدة البيانات الحفظ — قد لا تملك صلاحية التعديل على هذه المشاركة");
    if(e && e.code==="quota_exceeded") toast("امتلأت سعة قاعدة البيانات. صدّر نسخة احتياطية.");
    throw e;
  }
}

function subscribe(){
  const timer=setTimeout(()=>{ S.stale=true; S.loaded.set=true; S.loaded.users=true; render(); },10000);
  const done=()=>{ if(S.loaded.inv&&S.loaded.cus){ clearTimeout(timer); S.stale=false; } };
  DB.collection("invoices").orderBy("date","desc").limit(20000).onSnapshot(snap=>{
    S.invoices = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.inv=true; done(); sortData(); renderSoon();
  }, err=>{ S.loaded.inv=true; S.stale=true; clearTimeout(timer); toast("تعذر قراءة الفواتير ("+err.code+")"); render(); });
  DB.collection("customers").onSnapshot(snap=>{
    S.customers = snap.docs.map(d=>({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache) S.loaded.cus=true; done(); sortData(); renderSoon();
  }, ()=>{ S.loaded.cus=true; S.stale=true; render(); });
  DB.collection("users").onSnapshot(snap=>{ const u={}; snap.docs.forEach(d=>u[d.id]=d.data()); S.users=u; if(!snap.metadata.fromCache) S.loaded.users=true; renderSoon(); }, ()=>{ S.loaded.users=true; renderSoon(); });
  DB.collection("meta").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.meta=m; }, ()=>{});
  DB.collection("counters").onSnapshot(snap=>{ const c={}; snap.docs.forEach(d=>c[d.id]=d.data()); S.counters=c; }, ()=>{});
  DB.doc("settings/main").onSnapshot(snap=>{
    S.settings = deepMerge(DEFAULT_SETTINGS, snap.exists ? snap.data() : {});
    if(!snap.metadata.fromCache || snap.exists) S.loaded.set=true; renderSoon();
  }, ()=>{ S.loaded.set=true; renderSoon(); });
}

/* ---------------- authentication ----------------
   Usernames/password hashes live in settings/main (PBKDF2-SHA256, per-user salt).
   The real data protection is the artifact's sharing level; the login decides which screens a person gets. */
async function hashPw(pw, salt){
  if(!(window.crypto && crypto.subtle)) throw new Error("المتصفح لا يدعم التشفير المطلوب");
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function makeUser(u, name, roleName, pw){ const salt=newSalt(); return {u:u.trim().toLowerCase(), name:String(name||"").trim()||u, role:roleName, salt, hash:await hashPw(pw,salt), active:true, createdAt:new Date().toISOString()}; }
async function login(u, pw, remember){
  const user=allUsers().find(x=>x.u===String(u).trim().toLowerCase() && x.active!==false);
  if(!user) return "اسم المستخدم أو كلمة المرور غير صحيحة";
  const h=await hashPw(pw,user.salt);
  if(h!==user.hash) return "اسم المستخدم أو كلمة المرور غير صحيحة";
  S.session={u:user.u, name:user.name, role:user.role, at:Date.now(), mustChange:!!user.mustChange};
  ssSet("alharam-session",S.session); if(remember) lsSet("alharam-session",S.session); else lsSet("alharam-session",null);
  audit("تسجيل دخول", user.u);
  return "";
}
function logout(){ audit("تسجيل خروج", actor()); S.session=null; ssSet("alharam-session",null); lsSet("alharam-session",null); history.replaceState(null,"",location.pathname+location.search); S.route={name:"",arg:""}; render(); }
function validateSession(){
  if(!S.session) return;
  const user=allUsers().find(x=>x.u===S.session.u && x.active!==false);
  if(S.loaded.users && (!user || user.role!==S.session.role)){ S.session=null; ssSet("alharam-session",null); lsSet("alharam-session",null); }
  else if(user){ S.session.name=user.name; S.session.mustChange=!!user.mustChange; }
}

const pendingCount = () => S.invoices.filter(i=>i.status==="pending").length;
/* ---------- retention (amounts held by the client for a period) ---------- */
const RET_RE=/retention|retintion|retension|retaining|محتجز|احتجاز/i;
function retAmount(i){ if(!i||i.kind!=="invoice"||i.status!=="issued") return 0; const sub=calc(i).sub;
  return r2((i.discType==="retention"?discAmt(i,sub):0)+(i.deductions||[]).filter(d=>RET_RE.test(d.label||"")).reduce((s,d)=>s+dedAmount(d,sub),0)); }
function retInfo(i){
  const amount=retAmount(i); if(!(amount>0.004)) return null;
  const months=Number(i.retentionMonths)||12, base=i.completedDate||i.date, due=addMonths(base,months);
  const rel=i.retention&&i.retention.releasedAt?i.retention:null, left=daysUntil(due);
  const status=rel?"released":left<0?"expired":left<=30?"due":"held";
  return {amount, months, base, due, left, status, rel, collected:rel?Number(rel.amount)||amount:0};
}
const daysUntil = iso => Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/86400000);
const RET_AR={held:"محتجزة",due:"تستحق خلال 30 يوماً",expired:"انتهت المدة — للتحصيل",released:"تم التحصيل"};
const RET_CHIP={held:"issued",due:"pending",expired:"cancelled-red",released:"paid"};
const retAlerts = () => S.invoices.map(retInfo).filter(r=>r&&(r.status==="due"||r.status==="expired")).length;
const ROUTE_PERM = {automation:"automation", retentions:"retention", cheques:"cheques", approvals:"approve", dashboard:"dashboard", invoices:"invoices", special:"invoices", new:"edit", edit:"edit", inv:"invoices", register:"register", reports:"reports", customers:"customers", customer:"customers", statement:"statement", config:"settings", audit:"audit", sequences:"reports", rcpt:"print"};
function parseHash(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const simple=["automation","retentions","cheques","approvals","dashboard","invoices","special","register","reports","customers","config","audit","sequences"];
  if(!h) return {name:"", arg:""};
  if(simple.includes(h)) return {name:h, arg:""};
  if(h==="new"||h==="new-invoice") return {name:"new",arg:"invoice"};
  if(h==="new-proforma") return {name:"new",arg:"proforma"};
  if(h==="new-special") return {name:"new",arg:"special"};
  let m=h.match(/^rcpt-(.+)-(\d+)$/); if(m) return {name:"rcpt",arg:m[1],k:+m[2]};
  m=h.match(/^(inv|edit|doc-invoice|doc-completion|doc-warranty|doc-cover|doc-delivery|doc-pack|customer|statement)-(.+)$/);
  if(m) return {name:m[1],arg:m[2]};
  return {name:"",arg:""};

/* ---------------- toast & modal ---------------- */
let _tt=null;
function toast(msg){ let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; clearTimeout(_tt); _tt=setTimeout(()=>t.remove(),3400); }
function modal(html, onMount){
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" dir="rtl">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); renderSoon(); };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  $$("[data-close]",bg).forEach(b=>b.onclick=close);
  onMount && onMount(bg, close);
  const f=$("input,select,textarea",bg)||$("button",bg); f && f.focus();
  return close;
}
function confirmBox(msg, okLabel, fn, danger, withReason){
  modal(`<h3>تأكيد</h3><p style="white-space:pre-line">${esc(msg)}</p>${withReason?'<label class="f">السبب (إلزامي)<textarea class="i" id="cb-reason"></textarea></label>':''}<div class="foot"><button class="btn" data-close>رجوع</button><button class="btn ${danger?"danger":"primary"}" id="cb-ok">${esc(okLabel)}</button></div>`,(bg,close)=>{
    $("#cb-ok",bg).onclick=async()=>{ const reason=withReason?$("#cb-reason",bg).value.trim():""; if(withReason&&reason.length<3){ toast("اكتب السبب"); return; } bg.remove(); try{ await fn(reason); }catch(e){ console.error(e); toast("تعذرت العملية: "+(e.message||e.code||e)); } renderSoon(); };
  });
}

  const mi=Array(12).fill(0), mp=Array(12).fill(0), mc=Array(12).fill(0);

  const yInv=S.invoices.filter(i=>i.kind==="invoice"&&(i.date||"").startsWith(String(Y)));

const shortNum = v => v>=1e6 ? (Math.round(v/1e5)/10)+"M" : v>=1000 ? fmt0(v/1000)+"k" : fmt0(v);
function monthChart(cur, coll, prev){
  const W=720,H=290,pl=54,pr=14,pt=14,pb=36, max=Math.max(1,...cur,...coll,...prev);
  const step=niceStep(max), top=Math.ceil(max/step)*step, ih=H-pt-pb, gw=(W-pl-pr)/12, bw=Math.min(42,gw*0.56);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الحركة الشهرية">`;
  for(let v=0; v<=top+0.001; v+=step){ const y=pt+ih-(v/top)*ih; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--c-grid)" stroke-dasharray="4 4"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${shortNum(v)}</text>`; }
  for(let m=0;m<=12;m++){ const x=pl+gw*m; s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${pt+ih}" stroke="var(--c-grid)" stroke-dasharray="4 4"/>`; }
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--muted)"/><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${pt+ih}" stroke="var(--muted)"/>`;
  let pc="", pp="", dots="";
  for(let m=0;m<12;m++){ const x=pl+gw*m+gw/2, h=cur[m]/top*ih, yc=pt+ih-coll[m]/top*ih, yp=pt+ih-prev[m]/top*ih;
    if(h>0) s+=`<rect x="${x-bw/2}" y="${pt+ih-h}" width="${bw}" height="${h}" rx="3" fill="${QCOL[Math.floor(m/3)]}"><title>${MONTHS_AR[m]} مفوتر: ${fmt(cur[m])}</title></rect>`;
    s+=`<text x="${x}" y="${H-12}" text-anchor="middle">${MONTHS_AR[m]}</text>`;
    pc+=(m?"L":"M")+x+" "+yc; pp+=(m?"L":"M")+x+" "+yp;
    dots+=`<circle cx="${x}" cy="${yc}" r="4" fill="var(--surface)" stroke="var(--c-line)" stroke-width="2"><title>${MONTHS_AR[m]} محصل: ${fmt(coll[m])}</title></circle>`; }
  s+=`<path d="${pp}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="6 5" opacity=".85"/><path d="${pc}" fill="none" stroke="var(--c-line)" stroke-width="2.2" stroke-linejoin="round"/>${dots}`;
  return s+`</svg>`;
}
function donut(parts){
  const tot=parts.reduce((s,p)=>s+p.v,0), cx=110, cy=110, R=92, r=56, W=220;
  let s=`<svg viewBox="0 0 ${W} ${W}" style="max-width:240px;margin:0 auto" role="img" aria-label="حالة الفواتير">`;
  if(!tot) return s+`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--sunk)" stroke-width="${R-r}"/><text x="${cx}" y="${cy+5}" text-anchor="middle">لا توجد فواتير</text></svg>`;
  const live=parts.filter(p=>p.v>0);
  if(live.length===1) s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${live[0].color}" stroke-width="${R-r}"/>`;
  else { let a=-Math.PI/2; const gap=0.04, pt=(rad,ang)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
    for(const p of live){ const ang=p.v/tot*Math.PI*2, a0=a+gap/2, a1=a+ang-gap/2, big=(a1-a0)>Math.PI?1:0;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
      s+=`<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z" fill="${p.color}"><title>${p.label}: ${p.v}</title></path>`; a+=ang; } }
  return s+`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--ink)">${tot}</text><text x="${cx}" y="${cy+18}" text-anchor="middle">فاتورة</text></svg>`;
}
function hbarChart(rows){
  if(!rows.length) return '<div class="empty">لا توجد بيانات</div>';
  const W=400, lw=150, rowH=46, pt=6, H=pt+rows.length*rowH+28, max=Math.max(...rows.map(r=>r[1]),1), step=niceStep(max), top=Math.ceil(max/step)*step, x0=W-lw, iw=x0-14;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="أعلى العملاء">`;
  for(let v=0; v<=top+0.001; v+=step){ const x=x0-(v/top)*iw; s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-24}" stroke="var(--c-grid)" stroke-dasharray="4 4"/><text x="${x}" y="${H-8}" text-anchor="middle">${shortNum(v)}</text>`; }
  rows.forEach(([n,v],k)=>{ const y=pt+k*rowH+7, h=rowH-14, w=Math.max(2,(v/top)*iw); const nm=n.length>22?n.slice(0,21)+"…":n;
    s+=`<rect x="${x0-w}" y="${y}" width="${w}" height="${h}" rx="3" fill="${PAL[k%PAL.length]}"><title>${esc(n)}: ${fmt(v)}</title></rect><text x="${W-4}" y="${y+h/2+4}" text-anchor="end" style="fill:var(--ink);font-size:12px">${esc(nm)}</text>`; });
  s+=`<line x1="${x0}" x2="${x0}" y1="${pt}" y2="${H-24}" stroke="var(--muted)"/>`;
  return s+`</svg>`;
}
function niceStep(max){ const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

/* ---------------- invoices list ---------------- */
function filteredInvoices(special){
  const L=S.list, q=L.q.trim().toLowerCase();
  return S.invoices.filter(i=>{
    if(special && i.kind!=="special") return false;
    if(!special){ if(L.tab==="invoice"&&i.kind!=="invoice") return false; if(L.tab==="proforma"&&i.kind!=="proforma") return false; if(L.tab==="special"&&i.kind!=="special") return false; }
    const st=statusOf(i);
    if(L.status==="legacy"){ if(!awaitingReview(i)) return false; }
    else if(L.status==="open"){ if(!["issued","partial","open"].includes(st)) return false; }
    else if(L.status && st!==L.status) return false;
    if(L.customer && i.customerId!==L.customer) return false;
    if(L.from && i.date<L.from) return false;
    if(L.to && i.date>L.to) return false;
    if(q){ const hay=[dispNo(i),i.customerName,i.site,i.location,i.typeOfWorks,i.workOrder,i.ref,i.purpose,...(i.lines||[]).map(l=>l.desc)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

function viewRetentions(){

  const list=all.filter(({i,r})=>(F.status==="all"||(F.status==="open"?r.status!=="released":r.status===F.status))&&(!F.customer||i.customerId===F.customer)&&(!q||[dispNo(i),i.customerName,i.site].join(" ").toLowerCase().includes(q)));
  const sum=f=>r2(all.filter(f).reduce((s,x)=>s+x.r.amount,0)), cnt=f=>all.filter(f).length;
  const cy=String(new Date().getFullYear());
  const custs=[...new Map(all.map(x=>[x.i.customerId,x.i.customerName])).entries()];
  return `<div class="top"><div><h1>المحتجزات (Retention)</h1><p>مبالغ يحتجزها العملاء من الفواتير لمدة محددة. يُنبَّه عند اقتراب انتهاء المدة، ويُسجَّل التحصيل عند استلامها.</p></div>
   <div class="actions"><button class="btn" id="ret-xls">${IC.xls}تصدير Excel</button></div></div>
   <div class="kpis" style="margin-bottom:16px">
    <div class="kpi lead"><div class="l">محتجزات قائمة لم تُحصّل</div><div class="v">${fmt(sum(x=>x.r.status!=="released"))} <small>ر.ق</small></div><div class="s">${cnt(x=>x.r.status!=="released")} فاتورة</div></div>
    <div class="kpi"><div class="l">انتهت مدتها — للتحصيل</div><div class="v" style="color:var(--bad)">${fmt(sum(x=>x.r.status==="expired"))} <small>ر.ق</small></div><div class="s">${cnt(x=>x.r.status==="expired")} فاتورة</div></div>
    <div class="kpi"><div class="l">تستحق خلال 30 يوماً</div><div class="v" style="color:var(--warn)">${fmt(sum(x=>x.r.status==="due"))} <small>ر.ق</small></div><div class="s">${cnt(x=>x.r.status==="due")} فاتورة</div></div>
    <div class="kpi"><div class="l">حُصّلت خلال ${cy}</div><div class="v">${fmt(r2(all.filter(x=>x.r.rel&&String(x.r.rel.releasedAt).startsWith(cy)).reduce((s,x)=>s+x.r.collected,0)))} <small>ر.ق</small></div><div class="s">${cnt(x=>x.r.status==="released")} محتجزات محصلة إجمالاً</div></div>
   </div>
   <div class="filters">
    <label class="f">الحالة<select class="i" id="rt-st">${[["open","كل غير المحصلة"],["expired",RET_AR.expired],["due",RET_AR.due],["held",RET_AR.held],["released",RET_AR.released],["all","الكل"]].map(([k,l])=>`<option value="${k}" ${F.status===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">العميل<select class="i" id="rt-cu"><option value="">كل العملاء</option>${custs.map(([id,n])=>`<option value="${esc(id)}" ${F.customer===id?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
    <label class="f">بحث<input class="i" id="rt-q" value="${esc(F.q)}" placeholder="رقم الفاتورة، العميل، الموقع"></label>
   </div>
   <div class="actions" style="margin-bottom:10px" id="rt-bulk" hidden><span class="muted" id="rt-n"></span>${can("pay")?'<button class="btn sm primary" id="rt-collect">تسجيل التحصيل للمحدد</button>':''}</div>
   ${list.length?`<div class="tw"><table class="t"><thead><tr><th><input type="checkbox" id="rt-all" aria-label="تحديد الكل"></th><th>الفاتورة</th><th>العميل</th><th>تاريخ الإنجاز</th><th class="n">المحتجز</th><th>المدة</th><th>تاريخ الاستحقاق</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody>
   ${list.map(({i,r})=>`<tr class="click" data-open="${esc(i.id)}"><td>${r.rel?"":`<input type="checkbox" class="rt-sel" value="${esc(i.id)}" aria-label="تحديد">`}</td><td class="code">${esc(dispNo(i))}</td><td><bdi>${esc(i.customerName)}</bdi></td><td class="num">${dmy(r.base)}</td><td class="n">${fmt(r.amount)}</td><td>${r.months} شهر</td><td class="num">${dmy(r.due)}</td><td class="num">${r.rel?"—":r.left>=0?r.left+" يوم":`<b style="color:var(--bad)">متأخرة ${-r.left} يوم</b>`}</td><td><span class="chip ${RET_CHIP[r.status]}">${RET_AR[r.status]}</span>${r.rel?`<div class="hint">${dmy(r.rel.releasedAt)} — ${fmt(r.rel.amount)}</div>`:""}</td><td>${!r.rel&&can("pay")?`<button class="btn sm" data-rc="${esc(i.id)}">تحصيل</button>`:""}</td></tr>`).join("")}
   </tbody><tfoot><tr><td></td><td colspan="3">الإجمالي (${list.length})</td><td class="n">${fmt(list.reduce((s,x)=>s+x.r.amount,0))}</td><td colspan="5"></td></tr></tfoot></table></div>`
   :'<div class="empty"><b>لا توجد محتجزات مطابقة</b>تظهر هنا الفواتير المعتمدة التي فيها استقطاع محتجزات (Retention) — من خانة الخصم أو من الاستقطاعات.</div>'}`;
}
function retCollectModal(ids){
  const L=ids.map(invById).filter(i=>i&&retInfo(i)&&!retInfo(i).rel); if(!L.length){ toast("لا توجد محتجزات قابلة للتحصيل في التحديد"); return; }
  const one=L.length===1, r0=retInfo(L[0]);
  modal(`<h3>تسجيل تحصيل المحتجزات ${one?"— <span class=\"code\">"+esc(dispNo(L[0]))+"</span>":"("+L.length+" فواتير)"}</h3>
   <div class="grid g2"><label class="f">تاريخ التحصيل<input type="date" class="i" id="rc-d" value="${todayISO()}"></label>
   ${one?`<label class="f">المبلغ المحصل<input class="i ltr" id="rc-a" inputmode="decimal" value="${r0.amount}"></label>`:`<div class="f"><span class="hint">الإجمالي</span><b class="num">${fmt(L.reduce((s,i)=>s+retInfo(i).amount,0))} ر.ق</b></div>`}
   <label class="f span2">المرجع (شيك / تحويل)<input class="i ltr" id="rc-r"></label></div>
   <div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn primary" id="rc-ok">تسجيل</button></div>`,(bg)=>{
    $("#rc-ok",bg).onclick=async()=>{ const d=$("#rc-d",bg).value||todayISO(), ref=$("#rc-r",bg).value.trim(); let amt=one?r2($("#rc-a",bg).value.replace(/,/g,"")):null;
      if(one&&!(amt>0)){ toast("أدخل مبلغاً صحيحاً"); return; } bg.remove();
      try{ for(const i of L){ const r=retInfo(invById(i.id)); await patchInvoice(i.id,{retention:{releasedAt:d,amount:one?amt:r.amount,ref,by:actor(),at:new Date().toISOString()}},"تحصيل محتجزات "+fmt(one?amt:r.amount)); }
        toast(one?"تم تسجيل التحصيل":`تم تسجيل تحصيل ${L.length} محتجزات`); }catch(e){ toast("تعذر الحفظ: "+(e.message||e.code||e)); } renderSoon(); };
  });
}
function bindRetentions(){
  $("#rt-st").onchange=e=>{ S.ret.status=e.target.value; render(); };
  $("#rt-cu").onchange=e=>{ S.ret.customer=e.target.value; render(); };
  liveInput("#rt-q",v=>S.ret.q=v);
  const upd=()=>{ const n=$$(".rt-sel:checked").length, b=$("#rt-bulk"); if(b){ b.hidden=!n; $("#rt-n").textContent=n+" محددة:"; } };
  $$(".rt-sel").forEach(c=>c.onchange=upd);
  const all=$("#rt-all"); if(all) all.onchange=()=>{ $$(".rt-sel").forEach(c=>c.checked=all.checked); upd(); };
  const bc=$("#rt-collect"); if(bc) bc.onclick=()=>retCollectModal($$(".rt-sel:checked").map(c=>c.value));
  $$("[data-rc]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); retCollectModal([b.dataset.rc]); });
  $("#ret-xls").onclick=()=>exportXlsx({head:["الفاتورة","العميل","تاريخ الإنجاز","المحتجز","المدة (شهر)","تاريخ الاستحقاق","الأيام المتبقية","الحالة","تاريخ التحصيل","المبلغ المحصل","المرجع"],
    rows:retRows().map(({i,r})=>[dispNo(i),i.customerName||"",r.base,r.amount,r.months,r.due,r.rel?"":r.left,RET_AR[r.status],r.rel?r.rel.releasedAt:"",r.rel?Number(r.rel.amount):"",r.rel?r.rel.ref||"":""])},"Alharam-Retentions-"+todayISO());
}

/* ---------------- management approval ---------------- */
function viewApprovals(){
  const L=S.invoices.filter(i=>i.status==="pending").sort((a,b)=>String(a.submittedAt||"").localeCompare(String(b.submittedAt||"")));
  return `<div class="top"><div><h1>بانتظار اعتماد الإدارة</h1><p>فواتير أعدّها المحاسب وأرسلها للاعتماد. عند الاعتماد يُعطى الرقم الرسمي، أو تُعاد للمحاسب مع ملاحظة.</p></div>
   <div class="actions">${L.length?`<button class="btn primary" id="ap-all">${IC.check}اعتماد الكل (${L.length})</button>`:""}</div></div>
   ${L.length?`<div class="tw"><table class="t"><thead><tr><th>المسودة</th><th>النوع</th><th>التاريخ</th><th>العميل</th><th>الموقع / الأعمال</th><th class="n">القيمة</th><th>أرسلها</th><th>الفحص</th><th></th></tr></thead><tbody>
   ${L.map(i=>`<tr class="click" data-open="${esc(i.id)}"><td class="code">${esc(dispNo(i))}</td><td>${KIND[i.kind]}</td><td class="num">${dmy(i.date)}</td><td><bdi>${esc(i.customerName)}</bdi></td><td class="muted">${esc([i.site,i.typeOfWorks].filter(Boolean).join(" — ")||i.purpose||"")}</td><td class="n">${fmt(calc(i).total)}</td><td>${esc(i.submittedBy||"")}<div class="hint">${i.submittedAt?new Date(i.submittedAt).toLocaleString("en-GB"):""}</div></td><td>${checkBadge(i)}</td>
     <td style="white-space:nowrap"><a class="btn sm" href="#doc-invoice-${esc(i.id)}">معاينة</a> <button class="btn sm primary" data-ap="${esc(i.id)}">اعتماد</button> <button class="btn sm" data-ret="${esc(i.id)}">إعادة</button></td></tr>`).join("")}
   </tbody></table></div>`:'<div class="empty"><b>لا توجد فواتير بانتظار الاعتماد</b>عندما يرسل المحاسب فاتورة للاعتماد تظهر هنا.</div>'}`;
}
function returnModal(i){ confirmBox(`إعادة ${dispNo(i)} للمحاسب كمسودة؟ ستظهر له ملاحظتك.`,"إعادة للمحاسب",async note=>{ await patchInvoice(i.id,{status:"draft",returnNote:note,returnedBy:actor(),returnedAt:new Date().toISOString()},"إعادة للمحاسب — "+note); toast("تمت الإعادة"); },false,true); }
function bindApprovals(){
  $$("[data-ap]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const i=invById(b.dataset.ap); const w=checkInvoice(i).filter(x=>x.lvl!=="info"); confirmBox(`اعتماد ${KIND[i.kind]} للعميل ${i.customerName} بقيمة ${fmt(calc(i).total)}؟`+(w.length?`\n\nملاحظات الفحص:\n`+w.map(x=>"• "+x.msg).join("\n"):""),"اعتماد",async()=>{ await issueExisting(i); }); });
  $$("[data-ret]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); returnModal(invById(b.dataset.ret)); });
  const all=$("#ap-all"); if(all) all.onclick=()=>{ const L=S.invoices.filter(i=>i.status==="pending"); confirmBox(`اعتماد ${L.length} فاتورة وإعطاؤها أرقاماً رسمية؟`,"اعتماد الكل",async()=>{ for(const i of L) await issueExisting(invById(i.id),true); toast(`تم اعتماد ${L.length} فاتورة`); }); };
}

let ED=null;
function blankInvoice(kind){
  const d=todayISO();
  return {kind, status:"draft", date:d, customerId:"", customerName:"", customerNameEn:"", customerAddress:"", customerPhone:"", customerPobox:"",
    ref:"", workOrder:"", location:"", site:"", typeOfWorks:"", completedDate:d, warrantyMonths:12, warrantyType:"auto", notes:"", worksList:"",
    stamp:S.settings.stampDefault, coverStyle:"detailed",
    lines:[{desc:"",unit:"",qty:"",price:""}], deductions:[], discount:0, payments:[], linked:[], mode:"grouped", purpose:"", spStatus:"open"};
}
function suggest(field){ return [...new Set(S.invoices.map(i=>(i[field]||"").trim()).filter(Boolean))].slice(0,200); }
function viewEditor(id, kind){

    if(inv.status==="cancelled") return `<div class="banner bad">الفاتورة ملغاة ولا يمكن تعديلها.</div>`;
    if(!ED||ED._id!==id){ ED=clone(inv); ED._id=id; ED.lines=(ED.lines||[]).map(l=>(!l.heading&&blank(l.qty)&&blank(l.price)&&!blank(l.amount))?{...l,price:l.amount,qty:"",amount:undefined}:l); ED.deductions=ED.deductions||[];
      if(ED.warrantyMonths==null){ const m=String(ED.warranty||"").match(/(\d+)\s*(year|month)/i); ED.warrantyMonths=m?(+m[1])*(/year/i.test(m[2])?12:1):12; }
      if(ED.stamp==null) ED.stamp=S.settings.stampDefault; } }
  else if(!ED||ED._id||ED._kind!==kind){ ED=blankInvoice(kind); ED._kind=kind; ED._id=null; }

    </div>
    <p class="hint" id="cust-snap" style="margin:8px 0 0">${e.customerName?`سيُطبع: ${esc(e.customerNameEn||e.customerName)} — ${esc(e.customerAddress||"")} ${e.customerPhone?"— "+esc(e.customerPhone):""}`:""}</p>
    ${isSp?`<div class="grid g2" style="margin-top:12px"><label class="f">الغرض (يطبع على الفاتورة)<input class="i" id="e-purpose" value="${esc(e.purpose||"")}" placeholder="تحويل مبلغ مجمع عن فواتير أعمال الصيانة والدهانات"></label>

  ${isSp?"":`<div class="panel"><h2>بيانات المشروع والشهادات <small>تُستخدم في شهادة الإنجاز والضمان وكتاب التغطية</small></h2>

      <label class="f">رقم أمر العمل (Work Order)<input class="i ltr" id="e-wo" value="${esc(e.workOrder)}" placeholder="26-3267"></label>
      <label class="f">موقع المشروع (Located)<input class="i ltr" id="e-loc" value="${esc(e.location)}" list="dl-loc" placeholder="Zone 1 In MOEHE Building Fabric Project"></label>

    const sub=calc(data).sub;
    data.discount=discAmt(data, sub);

/* ---------------- repeat (monthly contracts) ----------------
   Copies an invoice into a new DRAFT with a new date; the official number is given on issue.
   Optionally moves month names in the descriptions forward (e.g. "October 2026" -> "November 2026"). */
function nextMonth(iso){ const [y,m,d]=(iso||todayISO()).split("-").map(Number); const t=new Date(y,m,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(Math.min(d,last)).padStart(2,"0")}`; }
const MONTHS_EN3=MONTHS_EN.map(m=>m.slice(0,3));
function shiftMonthText(txt, fromISO, toISO){
  if(!txt || !fromISO || !toISO) return txt;
  const [fy,fm]=fromISO.split("-").map(Number), [ty,tm]=toISO.split("-").map(Number);
  if(fy===ty && fm===tm) return txt;
  let s=String(txt);
  const yr=t=>fy!==ty?t.replace(new RegExp("(^|\\D)"+fy+"(?!\\d)","g"),"$1"+ty):t;
  const swap=(from,to,flags)=>{ s=s.replace(new RegExp("(^|[^A-Za-z\\u0600-\\u06FF])("+from+")((?:\\s*[-/,]?\\s*)"+fy+")?(?![A-Za-z\\u0600-\\u06FF])",flags),(all,pre,name,y)=>pre+to+(y?yr(y):"")); };
  swap(MONTHS_EN[fm-1], MONTHS_EN[tm-1], "gi");
  swap(MONTHS_EN3[fm-1], MONTHS_EN3[tm-1], "g");
  swap(MONTHS_AR[fm-1], MONTHS_AR[tm-1], "g");
  const pad=n=>String(n).padStart(2,"0");
  s=s.replace(new RegExp("(^|\\D)"+pad(fm)+"([/-])"+fy+"(?!\\d)","g"),"$1"+pad(tm)+"$2"+ty);
  return s;
}
const REPEAT_DROP=["id","no","snap","docNos","issuedAt","issuedBy","imported","reviewed","reviewedAt","reviewedBy","sheet","cancelReason","cancelledAt","cancelledBy","convertedTo","fromProforma","createdAt","createdBy","updatedAt","updatedBy","transferredDate","transferRef","transferAmount"];
function repeatDraft(i, newDate, shift){
  const n=clone(i); for(const k of REPEAT_DROP) delete n[k];
  const sh=t=>shift?shiftMonthText(t,i.date,newDate):t;
  n.lines=(n.lines||[]).map(l=>({...l, desc:sh(l.desc)}));
  Object.assign(n,{date:newDate, completedDate:newDate, payments:[], history:[], status:"draft", repeatOf:dispNo(i), notes:(i.notes&&!isLegacy(i))?i.notes:"", worksList:sh(n.worksList||""), purpose:sh(n.purpose||""), spStatus:n.kind==="special"?"open":n.spStatus});
  if(n.kind==="special" && n.mode==="grouped"){ n.linked=[]; }
  return n;
}

  const docs = isSp ? [["invoice","الفاتورة المجمعة","للتحويل البنكي — خارج الحسابات العامة."]]

      ["warranty","شهادة ضمان الأعمال", i.docNos?.warranty?.no?"رقم "+i.docNos.warranty.no:`نموذج ${S.settings.tpl.warranty[warrantyType(i)]?.label||""} — ${warrantyText(i)||"—"}.`],
      ["cover","كتاب التغطية", i.docNos?.cover?.no?"رقم "+i.docNos.cover.no:"خطاب إرسال المستندات (عربي / إنجليزي)."],

async function patchInvoice(id, patch, action, auditRef){
  const i=invById(id); if(!i) return;
  const data={...i, ...patch}; delete data.id;
  const c=calc(data); const now=new Date().toISOString();
  Object.assign(data,{paid:c.paid,balance:c.balance,total:c.total,subtotal:c.sub,updatedAt:now,updatedBy:actor(),history:[...(i.history||[]),{at:now,by:actor(),action}].slice(-40)});
  await Store.save("invoices", id, data);
  const idx=S.invoices.findIndex(x=>x.id===id); if(idx>=0) S.invoices[idx]={...data,id};
  await audit(action, auditRef||i.no||dispNo(i));
}
function paymentModal(title, max, onSave){
  modal(`<h3>${esc(title)}</h3>
   <div class="grid g2"><label class="f">التاريخ<input type="date" class="i" id="p-date" value="${todayISO()}"></label>
   <label class="f">المبلغ (الحد الأقصى ${fmt(max)})<input class="i ltr" id="p-amt" inputmode="decimal" value="${r2(max)}"></label>
   <label class="f">الطريقة<select class="i" id="p-m">${METHODS.map(m=>`<option>${m}</option>`).join("")}</select></label>
   <label class="f">المرجع / رقم الشيك أو التحويل<input class="i ltr" id="p-ref"></label></div>
   <div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn primary" id="p-ok">حفظ الدفعة</button></div>`,(bg,close)=>{
    $("#p-ok",bg).onclick=async()=>{ const amt=r2($("#p-amt",bg).value.replace(/,/g,"")); if(!(amt>0)){ toast("أدخل مبلغاً صحيحاً"); return; } if(amt>max+0.004){ toast("المبلغ أكبر من الرصيد المتبقي ("+fmt(max)+")"); return; }
      const b=$("#p-ok",bg); b.disabled=true; try{ const p={id:uid("p"),date:$("#p-date",bg).value||todayISO(),amount:amt,method:$("#p-m",bg).value,ref:$("#p-ref",bg).value.trim(),by:actor(),at:new Date().toISOString()}; bg.remove(); await onSave(p); renderSoon(); }catch(e){ toast("تعذر الحفظ: "+(e.message||e.code||e)); } };
  });
}

}

function docInvoice(i, o){
  const c=calc(i), isSp=i.kind==="special", grouped=isSp&&i.mode==="grouped"&&(i.linked||[]).length;
  const title = isSp?"CONSOLIDATED INVOICE":i.kind==="proforma"?"PROFORMA INVOICE":"INVOICE";
  const {company:co}=coFor(i);
  let rows="";
  if(grouped){
    rows=(i.linked||[]).map((x,k)=>{ const v=invById(x.id)||x; return `<tr><td class="c">${k+1}</td><td class="c" style="font-weight:700">${esc(x.no)}</td><td class="c">${esc(longDate(x.date))}</td><td>${esc(x.desc||v.typeOfWorks||"")}</td><td class="c">${esc(x.workOrder||v.workOrder||"")}</td><td>${esc(x.site||v.site||"")}</td><td class="r">${fmt(x.amount)}</td></tr>`; }).join("");
  } else {

async function renderPdfBlob(html, scale){
  if(!window.html2canvas || !window.jspdf){ toast("مكتبات PDF لم تُحمّل بعد — أعد المحاولة بعد لحظات"); return null; }
  toast("جارٍ تجهيز ملف PDF…");
  const root=$("#render-root"); root.innerHTML=html;
  try{ await document.fonts.ready; }catch(e){}
  await Promise.all($$("img",root).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  let first=true;
  try{
    for(const sh of $$(".sheet",root)){
      const canvas=await html2canvas(sh,{scale:scale||3,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
      const pageHpx=canvas.width*297/210;
      for(let y=0; y<canvas.height-4; y+=pageHpx){
        const h=Math.min(pageHpx, canvas.height-y);
        const part=document.createElement("canvas"); part.width=canvas.width; part.height=h;
        part.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
        if(!first) pdf.addPage(); first=false;
        pdf.addImage(part.toDataURL("image/jpeg",0.93),"JPEG",0,0,210,h*210/canvas.width,undefined,"FAST");
      }
    }
  } finally { root.innerHTML=""; }
  return pdf.output("blob");
}

const mcpErr = e => MCP_ERR[e&&e.code]||(e&&e.message)||String(e||"");
async function mcpCall(srv, tool, input){ if(!MCP) throw {code:"server_not_connected", message:"الربط متاح فقط عند فتح النظام داخل claude.ai"}; const r=await MCP.callTool(srv,tool,input); return r&&r.payload!==undefined?r.payload:r; }
const AI_ERR={not_granted:"لم يُسمح باستخدام Claude في هذه الصفحة",rate_limited:"طلبات كثيرة — انتظر دقيقة ثم أعد المحاولة",invalid_json:"لم يُفهم الرد — أعد المحاولة بصياغة أوضح",images_unavailable:"إرسال الصور غير متاح في هذا العرض",prompt_too_large:"النص طويل جداً",cancelled:"أُلغي"};

const median = a => { const s=[...a].sort((x,y)=>x-y); if(!s.length) return 0; const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };

function aiCustomersBrief(){ return S.customers.filter(c=>!c.archived).map(c=>({id:c.id,name:c.name,nameEn:c.nameEn||""})); }
function aiHistoryBrief(){
  const top=f=>{ const m={}; S.invoices.forEach(i=>{ const v=(i[f]||"").trim(); if(v) m[v]=(m[v]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,25).map(x=>x[0]); };
  return {typeOfWorks:top("typeOfWorks"), sites:top("site"), locations:top("location"), sampleLines:S.invoices.filter(i=>i.kind==="invoice").slice(0,8).flatMap(i=>(i.lines||[]).filter(l=>!l.heading&&l.desc).slice(0,2).map(l=>({desc:l.desc,unit:l.unit||"",qty:l.qty,price:l.price}))).slice(0,12)};
}
function smartPrompt(text, hasImages){
  return `You are filling an invoice draft for "Al Haram for Maintenance and Agriculture" (Qatar, currency QAR). Today is ${todayISO()}.
The user dictated or typed the request below (Arabic or English)${hasImages?", and attached image(s) of a work order / quotation / message / previous invoice":""}.
Extract the invoice. Printed documents are ENGLISH ONLY: write line descriptions, typeOfWorks, site and location in professional English (translate Arabic), in the same style as the sample lines below. Keep numbers, work-order numbers and references exactly as given.
Pick customerId ONLY from the customer list (match Arabic or English names, abbreviations like "درويش" = Darwish). If no customer matches, leave customerId "" and put the spoken name in customerName.
Amounts: qty and price as numbers; for a lump-sum line leave qty null and put the amount in price. "احتجاز/محتجزات/retention X%" -> discType "retention" with discPct X. "خصم X%" -> discType "discount", discPct X. A fixed discount amount -> discount. Advance payments or other deductions -> deductions [{label:"Less: ...", pct, amount}].
Dates as YYYY-MM-DD ("اليوم"=today, month names -> first of that month only if no day given). Do not invent data that was not given: leave unknown fields "".
Reply with ONLY one JSON object:
{"customerId":"","customerName":"","date":"","typeOfWorks":"","site":"","location":"","workOrder":"","ref":"","completedDate":"","lines":[{"desc":"","unit":"","qty":null,"price":null}],"discType":"discount","discPct":null,"discount":null,"deductions":[],"notes":"","warnings":["short Arabic notes about anything unclear"]}

Customers: ${JSON.stringify(aiCustomersBrief())}
Known values: ${JSON.stringify(aiHistoryBrief())}

User request:
${text||"(see image)"}`;
}
function applySmart(d, replaceLines){
  if(!d || typeof d!=="object") throw new Error("رد غير صالح");
  const s=v=>typeof v==="string"?v.trim():"";
  const num=v=>v===null||v===undefined||v===""||isNaN(Number(v))?"":String(Number(v));
  if(s(d.customerId) && custById(s(d.customerId))) applyCustomer(s(d.customerId));
  if(/^\d{4}-\d{2}-\d{2}$/.test(s(d.date))) ED.date=s(d.date);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s(d.completedDate))) ED.completedDate=s(d.completedDate); else if(/^\d{4}-\d{2}-\d{2}$/.test(s(d.date))) ED.completedDate=s(d.date);
  for(const k of ["typeOfWorks","site","location","workOrder","ref"]) if(s(d[k])) ED[k]=s(d[k]);
  const L=Array.isArray(d.lines)?d.lines.filter(l=>l&&(s(l.desc)||num(l.price))).map(l=>({desc:s(l.desc),unit:s(l.unit),qty:num(l.qty),price:num(l.price)})):[];
  if(L.length){ const cur=(ED.lines||[]).filter(l=>String(l.desc||"").trim()||!blank(l.price)); ED.lines=replaceLines||!cur.length?L:[...cur,...L]; }
  if(d.discType==="retention"||d.discType==="discount") ED.discType=d.discType;
  if(num(d.discPct)){ ED.discPct=Number(d.discPct); ED.discount=0; } else if(num(d.discount)){ ED.discPct=null; ED.discount=Number(d.discount); }
  if(Array.isArray(d.deductions)&&d.deductions.length) ED.deductions=[...(ED.deductions||[]),...d.deductions.filter(x=>x&&(s(x.label)||num(x.pct)||num(x.amount))).map(x=>({label:s(x.label)||"Less:",pct:num(x.pct),amount:num(x.amount)}))];
  if(s(d.notes)) ED.notes=[ED.notes,s(d.notes)].filter(Boolean).join("\n");
  const w=(Array.isArray(d.warnings)?d.warnings.map(s).filter(Boolean):[]);
  if(!ED.customerId && s(d.customerName)) w.unshift("لم يُعثر على العميل \""+s(d.customerName)+"\" في القائمة — اختره أو أضفه.");
  return w;
}
let _dictOff=[];
function stopDictation(){ _dictOff.forEach(f=>{ try{ f(); }catch(e){} }); _dictOff=[]; if(DICT){ try{ if(DICT.active()) DICT.stop().catch(()=>{}); }catch(e){} } }
function bindMic(btn, target, partialEl){
  if(!btn||!DICT) return;
  const label=btn.querySelector("span");
  _dictOff.push(DICT.onPartial(({text})=>{ if(partialEl) partialEl.textContent=text; }));
  _dictOff.push(DICT.onFinal(({text})=>{ if(!text) return; target.value=(target.value?target.value.replace(/\s*$/," "):"")+text; if(partialEl) partialEl.textContent=""; target.dispatchEvent(new Event("input")); }));
  _dictOff.push(DICT.onState(({state,reason})=>{ const on=state==="listening"; btn.classList.toggle("rec",on); if(label) label.textContent=on?"إيقاف التسجيل":"تحدّث"; if(!on&&reason==="not_granted"){ btn.disabled=true; if(label) label.textContent="الميكروفون غير مسموح"; } }));
  btn.onclick=()=>{ if(DICT.active()){ DICT.stop().catch(()=>{}); return; } DICT.start().catch(e=>{ if(e&&e.code==="not_granted"){ btn.disabled=true; if(label) label.textContent="الميكروفون غير مسموح"; } else toast("تعذر تشغيل الميكروفون"); }); };
}

/* ---------------- 2) pre-approval checks ---------------- */
function checkInvoice(i){
  const out=[], add=(lvl,msg)=>out.push({lvl,msg});
  if(!i || i.kind==="special") return out;
  const c=calc(i), others=S.invoices.filter(x=>x.id!==i.id&&x.status!=="cancelled"&&x.kind===i.kind);
  const dDays=(a,b)=>Math.abs((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000);
  const dup=others.find(x=>x.customerId===i.customerId&&x.date&&i.date&&dDays(x.date,i.date)<=60&&Math.abs(calc(x).total-c.total)<0.5);
  if(dup) add("warn",`مطابقة في العميل والمبلغ لفاتورة ${dispNo(dup)} بتاريخ ${dmy(dup.date)} — تأكد أنها ليست مكررة`);
  if(i.workOrder){ const wo=others.filter(x=>(x.workOrder||"").trim().toLowerCase()===i.workOrder.trim().toLowerCase()&&x.customerId===i.customerId); if(wo.length&&!i.contractRoot&&!i.repeatOf) add("warn",`أمر العمل ${i.workOrder} مستخدم في ${wo.slice(0,3).map(dispNo).join("، ")}`); }
  if(i.contractRoot){ const sm=others.find(x=>x.contractRoot===i.contractRoot&&ym(x.date)===ym(i.date)); if(sm) add("warn",`يوجد للعقد الشهري نفسه فاتورة في نفس الشهر: ${dispNo(sm)}`); }
  const hist=S.invoices.filter(x=>x.id!==i.id&&inAccounts(x)&&x.customerId===i.customerId).map(x=>calc(x).total).filter(v=>v>0);
  if(hist.length>=5){ const m=median(hist); if(m>0&&c.total>m*3) add("warn",`القيمة ${fmt0(c.total)} أعلى بكثير من المعتاد لهذا العميل (الوسيط ${fmt0(m)})`); if(m>0&&c.total>0&&c.total<m*0.15) add("info",`القيمة أقل بكثير من المعتاد لهذا العميل (الوسيط ${fmt0(m)})`); }
  const dsc=discAmt(i,c.sub); if(c.sub>0&&i.discType!=="retention"&&dsc/c.sub>0.15) add("warn",`الخصم ${Math.round(dsc/c.sub*100)}% من المجموع`);
  if(c.sub>0&&c.ded/c.sub>0.5) add("warn","الاستقطاعات أكثر من نصف قيمة الفاتورة");
  if(c.total<=0) add("bad","صافي الفاتورة صفر أو أقل");

/* ---------------- 5) monthly contracts (automatic drafts) ---------------- */
const contractRoots = () => S.invoices.filter(i=>i.contract&&i.contract.on&&i.status!=="cancelled");
const contractChain = root => S.invoices.filter(x=>x.id===root.id||x.contractRoot===root.id).filter(x=>x.status!=="cancelled").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
const addYm = (m,n) => { const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
function contractDate(month, day){ const [y,m]=month.split("-").map(Number); const last=new Date(y,m,0).getDate(); return `${month}-${String(Math.min(Math.max(1,day||1),last)).padStart(2,"0")}`; }
function contractDue(root){
  const c=root.contract, cur=ym(todayISO()), out=[]; let m=addYm(c.lastMonth||ym(root.date),1);
  while(m<=cur && out.length<3){ const d=contractDate(m,c.day); if(d<=todayISO() && (!c.until||m<=c.until)) out.push(m); m=addYm(m,1); }
  return out;
}
async function generateContract(root){
  const made=[]; const months=contractDue(root);
  for(const m of months){
    const chain=contractChain(root);
    if(chain.some(x=>ym(x.date)===m) || ((root.site||root.typeOfWorks)&&S.invoices.some(x=>x.status!=="cancelled"&&x.kind===root.kind&&x.customerId===root.customerId&&(x.site||"")===(root.site||"")&&(x.typeOfWorks||"")===(root.typeOfWorks||"")&&ym(x.date)===m&&x.id!==root.id))){ continue; }
    const src=chain[chain.length-1]||root, d=contractDate(m,root.contract.day);
    const n=repeatDraft(src,d,root.contract.shift!==false); const now=new Date().toISOString();
    const data=buildRecord(n); Object.assign(data,{status:"draft",contractRoot:root.id,autoGenerated:true,createdAt:now,createdBy:actor()||"auto",updatedAt:now,updatedBy:actor()||"auto",history:[{at:now,by:actor()||"auto",action:"مسودة تلقائية من العقد الشهري ("+m+")"}]});
    delete data.contract; const id=uid("inv"); await Store.save("invoices",id,data); made.push(id);
  }
  if(months.length){ const fresh=invById(root.id)||root; await patchInvoice(root.id,{contract:{...fresh.contract,lastMonth:months[months.length-1]}},"العقد الشهري: آخر شهر "+months[months.length-1]); }
  if(made.length) await audit("مسودات العقود الشهرية", dispNo(root), made.length+" مسودة");
  return made.length;
}
async function runContracts(manual){
  if(!can("edit")) return 0;
  const roots=contractRoots().filter(r=>contractDue(r).length); if(!roots.length){ if(manual) toast("لا توجد عقود مستحقة الآن"); return 0; }
  let lease={acquired:true};
  if(S.mode==="cloud"){ try{ lease=await DB.doc("counters/AUTO").acquire({holder:actor()+"-"+(S.uid||"x"),ttlMs:30000}); }catch(e){ lease={acquired:true}; } }
  if(!lease.acquired){ if(manual) toast("جهاز آخر ينشئ المسودات الآن"); return 0; }
  let n=0; for(const r of roots) n+=await generateContract(r);
  if(n) toast(`العقود الشهرية: أُنشئت ${n} مسودة جديدة — راجعها في الفواتير`); else if(manual) toast("كل العقود محدثة");
  return n;
}

const qbOf = i => i.qb&&i.qb.id?i.qb:null;
function qbName(i){ const c=custById(i.customerId); return (c&&c.qbName)||i.customerNameEn||c?.nameEn||i.customerName||""; }
function qbLines(i){
  const c=calc(i), out=[]; let hdr="";
  (i.lines||[]).forEach(l=>{ if(l.heading){ hdr=l.desc||""; return; } const amt=lineTotal(l); if(!amt&&!String(l.desc||"").trim()) return;
    const hasQ=!blank(l.qty)&&!blank(l.price); const desc=(hdr?hdr+" — ":"")+String(l.desc||"")+(l.unit?` (${l.unit})`:"");
    out.push({desc, qty:hasQ?Number(l.qty):1, rate:hasQ?Number(l.price):amt, amount:amt}); });
  (i.deductions||[]).forEach(d=>{ const a=dedAmount(d,c.sub); if(a) out.push({desc:d.label||"Deduction",qty:1,rate:-a,amount:-a}); });
  const da=discAmt(i,c.sub); if(da) out.push({desc:discLabel(i),qty:1,rate:-da,amount:-da});
  const diff=r2(c.total-out.reduce((s,x)=>s+x.amount,0)); if(Math.abs(diff)>=0.01) out.push({desc:"Rounding",qty:1,rate:diff,amount:diff});
  return out;
}
const qbDate = iso => iso?dmy(iso):"";
const qbDue = (iso, terms) => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d+(Number(terms)||0))); return t.toISOString().slice(0,10); };

  const rows=[]; L.forEach(i=>{ const due=qbDue(i.date,terms);
    qbLines(i).forEach(x=>rows.push([dispNo(i),qbName(i),qbDate(i.date),qbDate(due),"Net "+terms,[i.typeOfWorks,i.site,i.workOrder&&"WO "+i.workOrder].filter(Boolean).join(" | "),item,x.desc,x.qty,r2(x.rate),r2(x.amount),qbDate(i.completedDate||i.date)])); });
  const ws=XLSX.utils.aoa_to_sheet([head,...rows].map(r=>r.map(xlsSafe))); ws["!cols"]=[{wch:16},{wch:34},{wch:12},{wch:12},{wch:8},{wch:40},{wch:16},{wch:60},{wch:10},{wch:12},{wch:14},{wch:12}];

  const ws2=XLSX.utils.aoa_to_sheet(sum.map(r=>r.map(xlsSafe))); ws2["!cols"]=[{wch:16},{wch:40},{wch:12},{wch:14}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"QuickBooks Import"); XLSX.utils.book_append_sheet(wb,ws2,"Summary");

async function qbFindCustomer(i){
  const c=custById(i.customerId); if(c&&c.qbId) return c.qbId;
  const names=[qbName(i), c?.nameEn, c?.name, i.customerName].filter(Boolean);
  const norm=s=>String(s||"").toLowerCase().replace(/\b(w\.?l\.?l|l\.?l\.?c|co|company|trading|contracting|for|and|&)\b/g," ").replace(/[^a-z0-9؀-ۿ]+/g," ").trim();
  let found=[];
  for(const nm of names){ const first=norm(nm).split(" ").filter(w=>w.length>2).slice(0,2).join(" "); if(!first) continue;
    const p=await mcpCall(SRV.qb,"contacts_search",{type:"Customer",text:first,limit:10}); found=arrOf(p); if(found.length) break; }

  return await new Promise((resolve,reject)=>{
    modal(`<h3>ربط العميل في QuickBooks</h3><p class="hint">لم يُحدَّد العميل <b>${esc(qbName(i))}</b> تلقائياً. اختر المطابق، أو أنشئه في QuickBooks.</p>
     ${found.length?`<div class="checkl">${found.map(x=>`<label><input type="radio" name="qbc" value="${esc(x.id)}"><span>${esc(x.display_name)}</span><span class="muted num">${esc(x.balance||"")}</span></label>`).join("")}</div>`:'<p class="hint">لا توجد نتائج بحث مشابهة.</p>'}
     <label class="f" style="margin-top:10px">بحث باسم آخر<div style="display:flex;gap:6px"><input class="i ltr" id="qbc-q"><button class="btn sm" id="qbc-s">بحث</button></div></label>
     <div class="foot"><button class="btn" data-close>إلغاء</button><button class="btn" id="qbc-new">إنشاء "${esc(qbName(i))}" في QuickBooks</button><button class="btn primary" id="qbc-ok">ربط المحدد</button></div>`,(bg,close)=>{
      let L=found; const box=()=>bg.querySelector(".checkl");
      $("#qbc-s",bg).onclick=async()=>{ try{ L=arrOf(await mcpCall(SRV.qb,"contacts_search",{type:"Customer",text:$("#qbc-q",bg).value.trim(),limit:15})); const h=L.map(x=>`<label><input type="radio" name="qbc" value="${esc(x.id)}"><span>${esc(x.display_name)}</span></label>`).join("")||'<p class="hint">لا نتائج</p>'; if(box()) box().innerHTML=h; else $("#qbc-q",bg).closest("label").insertAdjacentHTML("beforebegin",`<div class="checkl">${h}</div>`); }catch(e){ toast(mcpErr(e)); } };
      $("#qbc-ok",bg).onclick=async()=>{ const v=bg.querySelector('input[name=qbc]:checked')?.value; if(!v){ toast("اختر عميلاً"); return; } const x=L.find(y=>String(y.id)===v)||{id:v}; await qbLinkCustomer(c,x); bg.remove(); resolve(String(v)); };
      $("#qbc-new",bg).onclick=async()=>{ try{ const nm=qbName(i); const p=await mcpCall(SRV.qb,"contacts_create",{type:"Customer",display_name:nm,company_name:nm,...(c?.email?{email:c.email}:{}),...(c?.phone?{phone:c.phone}:{})}); const id=p&&(p.id||p.contact?.id||p.details?.id); if(!id) throw new Error("لم يُرجع QuickBooks رقم العميل"); await qbLinkCustomer(c,{id,display_name:nm}); bg.remove(); resolve(String(id)); }catch(e){ toast("تعذر الإنشاء: "+mcpErr(e)); } };
      bg.addEventListener("click",e=>{ if(e.target===bg||e.target.closest("[data-close]")) reject(new Error("أُلغي")); });
    });
  });

async function qbLinkCustomer(c, x){ if(!c) return; const d={...c}; delete d.id; d.qbId=String(x.id); if(x.display_name) d.qbName=x.display_name; await Store.save("customers",c.id,d); }
async function qbPost(i){
  if(!inAccounts(i)) throw new Error("الترحيل للفواتير المعتمدة فقط");
  if(qbOf(i)) return qbOf(i);
  const no=dispNo(i).slice(0,21);
  const ex=arrOf(await mcpCall(SRV.qb,"transactions_search",{types:["Invoice"],doc_number:no,limit:5}));
  let rec=ex[0]?{id:String(ex[0].id),doc:ex[0].doc_number||no,linked:true}:null;
  if(!rec){
    const itemId=await qbEnsureItem(), cust=await qbFindCustomer(i);
    const L=qbLines(i).map(x=>({kind:"Item",item_id:itemId,description:x.desc.slice(0,4000),quantity:x.qty,unit_price:String(r2(x.rate)),amount:String(r2(x.amount)),...(i.completedDate?{service_date:i.completedDate}:{})}));
    const terms=Number(S.settings.qb.terms)||30, due=qbDue(i.date,terms);
    const memo=[i.typeOfWorks,i.site,i.location,i.workOrder&&"WO "+i.workOrder,i.ref&&"Ref "+i.ref,"From Al Haram invoicing system"].filter(Boolean).join(" | ").slice(0,4000);
    const p=await mcpCall(SRV.qb,"transactions_create",{type:"Invoice",contact_id:cust,txn_date:i.date,due_date:due,doc_number:no,memo,lines:L});
    let id=p&&(p.id||p.transaction?.id||p.details?.id||p.record?.id);
    if(!id){ const chk=arrOf(await mcpCall(SRV.qb,"transactions_search",{types:["Invoice"],doc_number:no,limit:2})); id=chk[0]&&chk[0].id; }
    if(!id) throw new Error("لم يتأكد إنشاء الفاتورة في QuickBooks — تحقق هناك قبل إعادة المحاولة");
    rec={id:String(id),doc:no,total:p&&(p.total||p.transaction?.total)||""};
  }
  const q={...rec,at:new Date().toISOString(),by:actor()};
  await patchInvoice(i.id,{qb:q},rec.linked?"ربط بفاتورة موجودة في QuickBooks":"ترحيل إلى QuickBooks"); await audit("ترحيل إلى QuickBooks", dispNo(i), fmt(calc(i).total));
  return q;
}

      let n=0; for(const id of ids){ const i=invById(id); if(!i||!confirmed(i)) continue; const c=calc(i); if(c.balance<=0.004) continue; await patchInvoice(id,{payments:[...(i.payments||[]),{id:uid("p"),date:todayISO(),amount:c.balance,method:"تحويل بنكي",ref:"تسوية جماعية",by:actor(),at:new Date().toISOString()}]},"دفعة "+fmt(c.balance)); n++; }

async function reviewLegacy(i, paid){
  const c=calc(i); const patch={reviewed:true, reviewedAt:new Date().toISOString(), reviewedBy:actor()};

}
function bindEditor(){
