function bindInvoice(){
  const i=invById(S.route.arg); if(!i) return;
  const err=e=>toast("تعذر: "+(e.message||e.code||e));
  $$("[data-pdf]").forEach(b=>b.onclick=()=>outputDoc(b.dataset.pdf,i.id,"pdf").then(()=>render()).catch(err));
  const pk=$("#pack"); if(pk) pk.onclick=()=>outputDoc("pack",i.id,"pdf").then(()=>render()).catch(err);
  const sbm=$("#submit"); if(sbm) sbm.onclick=()=>confirmBox("إرسال الفاتورة لاعتماد الإدارة؟","إرسال",async()=>{ await patchInvoice(i.id,{status:"pending",submittedAt:new Date().toISOString(),submittedBy:actor(),returnNote:null},"إرسال لاعتماد الإدارة"); toast("أُرسلت للاعتماد"); notifySubmit(invById(i.id)); });
  const rt=$("#return"); if(rt) rt.onclick=()=>returnModal(i);
  const rc=$("#ret-collect"); if(rc) rc.onclick=()=>retCollectModal([i.id]);
  const rtu=$("#ret-undo"); if(rtu) rtu.onclick=()=>confirmBox("إلغاء تسجيل تحصيل المحتجزات لهذه الفاتورة؟","إلغاء التسجيل",async()=>{ await patchInvoice(i.id,{retention:null},"إلغاء تسجيل تحصيل المحتجزات"); toast("تم الإلغاء"); },true);
  const snd=$("#send"); if(snd) snd.onclick=()=>sendModal(i);
  const is=$("#issue"); if(is) is.onclick=()=>confirmBox(`اعتماد ${KIND[i.kind]} وإعطاؤها الرقم التسلسلي الرسمي؟ بعد الاعتماد تُقفل البيانات المالية.`,"اعتماد",async()=>{ await issueExisting(i); });
  const ap=$("#add-pay"); if(ap) ap.onclick=()=>paymentModal("تسجيل دفعة — "+dispNo(i), calc(i).balance, async p=>{ await patchInvoice(i.id,{payments:[...(i.payments||[]),p]},"دفعة "+fmt(p.amount)); toast("تم تسجيل الدفعة — يمكنك طباعة سند القبض"); });
  $$("[data-revpay]").forEach(b=>b.onclick=()=>confirmBox("عكس هذه الدفعة؟ تبقى ظاهرة في السجل كدفعة معكوسة ولا تُحذف.","عكس الدفعة",async reason=>{ const P=clone(i.payments); const k=+b.dataset.revpay; P[k].reversed={at:new Date().toISOString(),by:actor(),reason}; await patchInvoice(i.id,{payments:P},"عكس دفعة "+fmt(P[k].amount)+" — "+reason); toast("تم عكس الدفعة"); },true,true));
  const dd=$("#del-draft"); if(dd) dd.onclick=()=>confirmBox("حذف هذه المسودة نهائياً؟ (لم يُعطَ لها رقم رسمي)","حذف",async()=>{ await Store.remove("invoices",i.id); await audit("حذف مسودة", dispNo(i)); toast("تم حذف المسودة"); go("invoices"); },true);
  const ci=$("#cancel-inv"); if(ci) ci.onclick=()=>{
    if(activePays(i).length){ toast("لا يمكن الإلغاء مع وجود دفعات — اعكس الدفعات أولاً"); return; }
    if(linkedSpecials(i.id).length){ toast("الفاتورة مدرجة في فاتورة مجمعة مفتوحة — ألغِ المجمعة أولاً"); return; }
    confirmBox(`إلغاء ${dispNo(i)}؟ يبقى الرقم محفوظاً مع ختم CANCELLED ولا يُعاد استخدامه.`,"إلغاء نهائي",async reason=>{ await patchInvoice(i.id,{status:"cancelled",cancelReason:reason,cancelledAt:new Date().toISOString(),cancelledBy:actor(),spStatus:i.kind==="special"?"cancelled":(i.spStatus||null)},"إلغاء — "+reason); toast("تم الإلغاء"); },true,true); };
  const dup=$("#dup"); if(dup) dup.onclick=()=>repeatModal([i.id]);
  const air=$("#ai-review"); if(air) air.onclick=()=>aiReview(i,$("#ai-review-out"),air);
  const aic=$("[data-aicover]"); if(aic) aic.onclick=()=>aiCoverModal(i);
  const cts=$("#ct-set"); if(cts) cts.onclick=()=>contractModal(i);
  const qp=$("#qb-post"); if(qp) qp.onclick=()=>confirmBox(`ترحيل ${dispNo(i)} بقيمة ${fmt(calc(i).total)} ر.ق إلى QuickBooks؟ إن وُجدت فاتورة بنفس الرقم هناك تُربط ولا تتكرر.`,"ترحيل",async()=>{ const q=await qbPost(invById(i.id)); toast("تم الترحيل إلى QuickBooks برقم "+q.doc); });
  const cv=$("#convert"); if(cv) cv.onclick=()=>confirmBox("تحويل الفاتورة المبدئية إلى فاتورة رسمية برقم INV جديد؟ تبقى المبدئية محفوظة كمرجع.","تحويل واعتماد",async()=>{
    const n=clone(i); for(const k of ["id","docNos","snap","history"]) delete n[k]; const d=todayISO(), now=new Date().toISOString();
    Object.assign(n,{kind:"invoice",date:d,payments:[],status:"issued",fromProforma:i.no,createdAt:now,createdBy:actor(),issuedAt:now,issuedBy:actor(),snap:snapshot()});
    n.no=await allocate("INV"); const id=uid("inv"); const data=buildRecord(n); data.history=[{at:now,by:actor(),action:"اعتماد بالتحويل من "+i.no}];
    await Store.save("invoices",id,data); await audit("تحويل مبدئية إلى فاتورة", data.no, "من "+i.no);
    await patchInvoice(i.id,{convertedTo:data.no},"حُوّلت إلى "+data.no); toast("تم إنشاء الفاتورة "+data.no); go("inv-"+id); });
  const rp=$("#rev-paid"), ru=$("#rev-unpaid");
  if(rp) rp.onclick=()=>confirmBox("تأكيد أن هذه الفاتورة المستوردة مدفوعة بالكامل؟ تُسجَّل دفعة رصيد افتتاحي بتاريخ الفاتورة.","تأكيد",async()=>{ await reviewLegacy(i,true); toast("تمت المراجعة"); });
  if(ru) ru.onclick=()=>confirmBox("تأكيد أن هذه الفاتورة المستوردة غير مدفوعة؟ ستدخل في الرصيد المفتوح.","تأكيد",async()=>{ await reviewLegacy(i,false); toast("تمت المراجعة"); });
  const sp=$("#sp-pay"); if(sp) sp.onclick=()=>{
    const targets=(i.linked||[]).map(x=>invById(x.id)).filter(Boolean).filter(x=>calc(x).balance>0.004&&x.status!=="cancelled");
    const max=r2(targets.reduce((s,x)=>s+calc(x).balance,0));
    if(!targets.length){ confirmBox("كل الفواتير المشمولة مسددة. تعليم الفاتورة المجمعة كـ \"تم التحويل\"؟","تعليم",async()=>{ await patchInvoice(i.id,{spStatus:"transferred",transferredDate:todayISO()},"تم التحويل"); }); return; }
    paymentModal("وصول التحويل — "+dispNo(i), max, async p=>{
      let left=p.amount; for(const t of targets){ if(left<=0.004) break; const fresh=invById(t.id); const a=r2(Math.min(left,calc(fresh).balance)); left=r2(left-a); await patchInvoice(t.id,{payments:[...(fresh.payments||[]),{...p,id:uid("p"),amount:a,ref:(p.ref?p.ref+" / ":"")+dispNo(i),via:i.id}]},"دفعة عبر "+dispNo(i)); }
      const applied=r2(p.amount-left), cur=invById(i.id);
      await patchInvoice(i.id,{spStatus:applied>=max-0.004?"transferred":"open",transferredDate:p.date,transferRef:p.ref,transferAmount:r2((cur.transferAmount||0)+applied)},"وصول تحويل "+fmt(applied));
      toast("تم توزيع التحويل على الفواتير المشمولة"); });
  };
}
function bindDocToolbar(onOut){
  fitPaper(); setTimeout(fitPaper,400); try{ document.fonts.ready.then(fitPaper); }catch(e){}
  const st=$("#doc-stamp"); if(st) st.onchange=()=>{ S.doc.stamp=st.checked; render(); };
  const l=$("#doc-lang"); if(l) l.onchange=()=>{ S.doc.lang=l.value; render(); };
  const sy=$("#doc-style"); if(sy) sy.onchange=()=>{ S.doc.style=sy.value; S.doc.styleSet=true; render(); };
  $("#doc-pdf").onclick=()=>onOut("pdf").catch(e=>toast("تعذر: "+(e.message||e)));
  const p=$("#doc-print"); if(p) p.onclick=()=>onOut("print").catch(e=>toast("تعذر: "+(e.message||e)));
}
function bindDoc(kind){ const i=invById(S.route.arg); if(!i) return; bindDocToolbar(how=>outputDoc(kind,i.id,how).then(()=>render())); }
function bindReceipt(){
  const i=invById(S.route.arg), k=S.route.k; if(!i) return;
  bindDocToolbar(async how=>{ const fresh=await ensureReceipt(i,k); const html=docReceipt(fresh,k,docOpts(fresh)); const no=fresh.payments[k].rcv?.no||"receipt";
    await audit((how==="print"?"طباعة ":"تنزيل ")+"سند قبض", no);
    if(how==="print") printDirect(html); else await makePdf(html,`Receipt-${safeName(no)}.pdf`); render(); });
}
function bindReports(){
  $$("[data-rtab]").forEach(b=>b.onclick=()=>{S.repTab=b.dataset.rtab; render();});
  const m={"r-from":"from","r-to":"to","r-cu":"customer","r-kind":"kind","r-st":"status","r-grp":"group"};
  for(const [id,k] of Object.entries(m)){ const el=$("#"+id); if(el) el.onchange=()=>{S.rep[k]=el.value; render();}; }
  $$("[data-quick]").forEach(b=>b.onclick=()=>{ const [f,t]=QUICK[+b.dataset.quick](); S.rep.from=f; S.rep.to=t; render(); });
  const sub=()=> (S.rep.from||S.rep.to?`الفترة ${dmy(S.rep.from)||"البداية"} – ${dmy(S.rep.to)||"اليوم"}`:"كل الفترات")+(S.rep.customer?" — "+(custById(S.rep.customer)?.name||""):"");
  const nm=()=>"Alharam-"+(S.route.name==="statement"?"Statement":S.repTab)+"-"+todayISO();
  $("#rep-xls").onclick=()=>{ if(!REP_TABLE||!REP_TABLE.rows.length){ toast("لا توجد بيانات للتصدير"); return; } exportXlsx(REP_TABLE,nm()); };
  $("#rep-pdf").onclick=()=>{ if(!REP_TABLE||!REP_TABLE.rows.length){ toast("لا توجد بيانات"); return; } makePdf(reportSheetHtml(REP_TABLE,S.route.name==="statement"?"حتى "+dmy(todayISO()):sub()),nm()+".pdf"); audit("تقرير PDF", REP_TABLE.title); };
}

    const old=id==="new"?{}:custById(id)||{}; const cid=id==="new"?uid("c"):id;
    const data={...old,name,nameEn:$("#c-en").value.trim(),address:$("#c-addr").value.trim(),phone:$("#c-ph").value.trim(),pobox:$("#c-po").value.trim(),cr:$("#c-cr").value.trim(),contact:$("#c-ct").value.trim(),email:$("#c-em").value.trim(),updatedAt:new Date().toISOString(),updatedBy:actor()};
    delete data.id; if(id==="new"){ data.serial=Math.max(0,...S.customers.map(c=>+c.serial||0))+1; data.createdAt=data.updatedAt; data.createdBy=actor(); }
    try{ await Store.save("customers",cid,data); await audit(id==="new"?"إضافة عميل":"تعديل عميل", name); toast("تم حفظ العميل"); form.remove(); go("customers"); }catch(err){ toast("تعذر الحفظ"); } };

    const okId=id=>/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(String(id||""));
    confirmBox(`استعادة ${d.invoices?.length||0} فاتورة و ${d.customers?.length||0} عميل و ${d.cheques?.length||0} شيك؟ السجلات بنفس المعرّف ستُستبدل. المستخدمون وكلمات المرور الحالية لا تتغير.`,"استعادة",async()=>{
      let n=0; for(const c of d.customers||[]){ const {id,...x}=c; if(okId(id)){ await Store.save("customers",id,x); n++; } }
      for(const i of d.invoices||[]){ const {id,...x}=i; if(okId(id)){ await Store.save("invoices",id,x); n++; } }
      for(const c of d.cheques||[]){ const {id,...x}=c; if(okId(id)){ await Store.save("cheques",id,x); n++; } }
      for(const t of d.chequeTemplates||[]){ const {id,...x}=t; if(okId(id)){ await Store.save("templates",id,x); n++; } }
      if(d.chequeConfig&&S.mode==="cloud"){ try{ await DB.doc("config/main").set(d.chequeConfig); }catch(e){} }
      if(d.settings&&S.isPlatformAdmin){ const st=deepMerge(S.settings,d.settings); delete st.users; await Store.saveSettings(st); }
      await audit("استعادة نسخة احتياطية", n+" سجل"); toast(`تمت استعادة ${n} سجل`); }); }; rd.readAsText(f); };
}

boot();
</script>
